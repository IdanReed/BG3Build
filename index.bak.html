<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BG3 Party Plan</title>
<script>
  /* Set theme before first paint to avoid a flash of the wrong theme. */
  (function () {
    try {
      var stored = null;
      try { stored = localStorage.getItem("bg3-theme"); } catch (e) {}
      var t = (stored === "light" || stored === "dark")
        ? stored
        : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
<style>
  :root {
    --bg: #f5f6fb;
    --surface: #ffffff;
    --surface-2: #eceef6;
    --surface-3: #e2e5f0;
    --text: #191b22;
    --text-muted: #565b6e;
    --border: #d5d9e6;
    --accent: #6a35e0;
    --accent-soft: #efe9ff;
    --accent-text: #ffffff;
    --good: #1f8a4c;
    --warn: #a04b00;
    --shadow: 0 1px 3px rgba(20,22,40,.08), 0 4px 16px rgba(20,22,40,.06);
    --radius: 12px;
    --header-h: 76px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1016;
      --surface: #171a22;
      --surface-2: #1e222d;
      --surface-3: #262b38;
      --text: #e8eaf1;
      --text-muted: #a5aaba;
      --border: #2c3242;
      --accent: #a488ff;
      --accent-soft: #241f3a;
      --accent-text: #14121f;
      --good: #57cd87;
      --warn: #f0a860;
      --shadow: 0 1px 3px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  html[data-theme="light"] {
    --bg: #f5f6fb; --surface: #ffffff; --surface-2: #eceef6; --surface-3: #e2e5f0;
    --text: #191b22; --text-muted: #565b6e; --border: #d5d9e6; --accent: #6a35e0;
    --accent-soft: #efe9ff; --accent-text: #ffffff; --good: #1f8a4c; --warn: #a04b00;
    --shadow: 0 1px 3px rgba(20,22,40,.08), 0 4px 16px rgba(20,22,40,.06);
  }
  html[data-theme="dark"] {
    --bg: #0e1016; --surface: #171a22; --surface-2: #1e222d; --surface-3: #262b38;
    --text: #e8eaf1; --text-muted: #a5aaba; --border: #2c3242; --accent: #a488ff;
    --accent-soft: #241f3a; --accent-text: #14121f; --good: #57cd87; --warn: #f0a860;
    --shadow: 0 1px 3px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); }

  /* ---- Header ---- */
  header.app {
    position: sticky; top: 0; z-index: 30;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow);
  }
  .header-inner {
    max-width: 1200px; margin: 0 auto; padding: 14px 20px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .header-titles { flex: 1 1 340px; min-width: 0; }
  .header-titles h1 {
    margin: 0 0 8px; font-size: 1.25rem; line-height: 1.25; font-weight: 700;
    letter-spacing: -.01em;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface-2); color: var(--text-muted);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 3px 10px; font-size: .78rem; font-weight: 600; white-space: nowrap;
  }
  .chip.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .chip .chip-k { color: var(--text-muted); font-weight: 500; opacity: .8; }
  details.assumptions { flex-basis: 100%; margin-top: 4px; }
  details.assumptions summary {
    cursor: pointer; font-size: .8rem; color: var(--accent); font-weight: 600;
    list-style: none; display: inline-block; padding: 2px 0;
  }
  details.assumptions summary::-webkit-details-marker { display: none; }
  details.assumptions summary::before { content: "\25B8  "; }
  details.assumptions[open] summary::before { content: "\25BE  "; }
  details.assumptions .assume-body { font-size: .85rem; color: var(--text-muted); margin-top: 6px; }
  details.assumptions .assume-body p { margin: 6px 0; }
  details.assumptions summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  [role="tabpanel"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

  .theme-toggle {
    flex: 0 0 auto;
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 8px 14px; font-size: .82rem; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- Layout ---- */
  .layout {
    max-width: 1200px; margin: 0 auto; padding: 20px;
    display: grid; grid-template-columns: 250px 1fr; gap: 20px; align-items: start;
  }
  .sidebar {
    position: sticky; top: calc(var(--header-h, 76px) + 8px);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 8px; box-shadow: var(--shadow);
  }
  .sidebar h2 {
    font-size: .7rem; text-transform: uppercase; letter-spacing: .08em;
    color: var(--text-muted); margin: 8px 10px; font-weight: 700;
  }
  .nav-list { list-style: none; margin: 0 0 6px; padding: 0; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    background: none; border: none; text-align: left; cursor: pointer;
    color: var(--text); font: inherit; font-size: .92rem; font-weight: 500;
    padding: 9px 12px; border-radius: 8px; margin-bottom: 2px;
  }
  .nav-item:hover { background: var(--surface-2); }
  .nav-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .nav-item[aria-current="page"] {
    background: var(--accent-soft); color: var(--accent); font-weight: 700;
  }
  .nav-item .nav-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--border); flex: 0 0 auto;
  }
  .nav-item[aria-current="page"] .nav-dot { background: var(--accent); }
  .nav-item .nav-sub { display: block; font-size: .72rem; color: var(--text-muted); font-weight: 500; }
  .nav-item[aria-current="page"] .nav-sub { color: var(--accent); opacity: .85; }
  .nav-item .nav-label { display: flex; flex-direction: column; min-width: 0; }
  .nav-item .nav-label .nav-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  main.content { min-width: 0; }

  /* ---- Cards / sections ---- */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 18px 20px; margin-bottom: 18px;
  }
  .view-title { margin: 0 0 4px; font-size: 1.5rem; font-weight: 700; letter-spacing: -.01em; }
  .view-sub { color: var(--text-muted); margin: 0 0 4px; font-size: .95rem; }

  .section-title {
    font-size: .74rem; text-transform: uppercase; letter-spacing: .08em;
    color: var(--accent); font-weight: 700; margin: 0 0 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  .prose { margin: 0; color: var(--text); }
  .muted { color: var(--text-muted); }

  /* ---- Tables ---- */
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 10px; border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; font-size: .88rem; min-width: 420px; }
  thead th {
    background: var(--surface-2); text-align: left; padding: 9px 12px;
    font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em;
    color: var(--text-muted); white-space: nowrap; border-bottom: 1px solid var(--border);
  }
  tbody td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--surface-2) 45%, transparent); }
  td .cell-strong { font-weight: 600; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ---- Definition grid ---- */
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 20px; margin: 0; }
  .fact { min-width: 0; }
  .fact dt { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); font-weight: 700; margin-bottom: 2px; }
  .fact dd { margin: 0; font-size: .92rem; }
  .fact dd .note { display: block; font-size: .8rem; color: var(--text-muted); margin-top: 2px; }

  /* ---- Stat block ---- */
  .statblock { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .stat {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 4px; text-align: center;
  }
  .stat .stat-k { font-size: .66rem; font-weight: 700; letter-spacing: .05em; color: var(--text-muted); }
  .stat .stat-v { font-size: 1.35rem; font-weight: 700; line-height: 1.1; }
  @media (max-width: 560px) { .statblock { grid-template-columns: repeat(3, 1fr); } }

  /* ---- Lists ---- */
  ul.clean { list-style: none; margin: 0; padding: 0; }
  ul.clean li { position: relative; padding: 5px 0 5px 20px; font-size: .9rem; border-bottom: 1px solid var(--border); }
  ul.clean li:last-child { border-bottom: none; }
  ul.clean li::before { content: ""; position: absolute; left: 4px; top: 13px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  ul.clean li .li-strong { font-weight: 600; }
  ul.clean li .li-meta { color: var(--text-muted); font-size: .82rem; }

  .tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 4px 10px; font-size: .84rem; font-weight: 500;
  }

  /* ---- Itemization columns ---- */
  .acts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  .act-col { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .act-col h4 { margin: 0 0 8px; font-size: .82rem; color: var(--accent); text-transform: uppercase; letter-spacing: .05em; }

  /* ---- Meters ---- */
  .meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
  .meter .meter-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
  .meter .meter-k { font-size: .8rem; font-weight: 700; text-transform: capitalize; }
  .meter .meter-v { font-size: .8rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .meter .meter-track { height: 8px; background: var(--surface-3); border-radius: 999px; overflow: hidden; }
  .meter .meter-fill { height: 100%; background: var(--accent); border-radius: 999px; }

  /* ---- Nova ---- */
  .nova-config { border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 14px; background: var(--surface-2); }
  .nova-config h4 { margin: 0 0 10px; font-size: 1rem; }
  tr.total-row td { background: var(--accent-soft) !important; font-weight: 700; color: var(--accent); border-top: 2px solid var(--accent); }

  .callout {
    background: var(--surface-2); border-left: 3px solid var(--accent);
    border-radius: 0 8px 8px 0; padding: 10px 14px; font-size: .86rem; color: var(--text-muted);
    margin-top: 12px;
  }
  .callout .callout-k { display: block; font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); font-weight: 700; margin-bottom: 3px; }
  .callout.warn { border-left-color: var(--warn); }
  .callout.warn .callout-k { color: var(--warn); }

  /* ---- Tabs ---- */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; flex-wrap: wrap; }
  .tab {
    background: none; border: none; border-bottom: 2px solid transparent;
    padding: 9px 14px; font: inherit; font-size: .9rem; font-weight: 600; cursor: pointer;
    color: var(--text-muted); margin-bottom: -1px; display: inline-flex; align-items: center; gap: 8px;
    border-radius: 8px 8px 0 0;
  }
  .tab:hover { color: var(--text); background: var(--surface-2); }
  .tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .badge {
    background: var(--accent); color: var(--accent-text); font-size: .62rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: .04em; padding: 2px 6px; border-radius: 999px;
  }

  .subgrid { display: grid; gap: 18px; }
  @media (min-width: 780px) { .subgrid.two { grid-template-columns: 1fr 1fr; align-items: start; } }

  /* ---- Mobile ---- */
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; padding: 14px; gap: 14px; }
    .sidebar { position: static; top: auto; }
    .nav-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .nav-item { width: auto; margin-bottom: 0; }
    .sidebar h2 { width: 100%; margin: 6px 6px 2px; }
    .nav-item .nav-sub { display: none; }
  }
  @media (max-width: 480px) {
    .header-inner { padding: 12px 14px; }
    .card { padding: 14px; }
    .view-title { font-size: 1.25rem; }
  }
  .skip-link {
    position: absolute; left: -999px; top: 8px; background: var(--accent); color: var(--accent-text);
    padding: 8px 14px; border-radius: 8px; z-index: 100; font-weight: 600;
  }
  .skip-link:focus { left: 8px; }
</style>
</head>

</div>

<script>
"use strict";

/* ---------------- Data loading ---------------- */
async function loadData() {
  try {
    const res = await fetch("party_plan.json", { cache: "no-store" });
    if (!res.ok) throw new Error("bad status " + res.status);
    return await res.json();
  } catch (e) {
    // file:// double-click → CORS; fall back to embedded JSON.
    const node = document.getElementById("party-data");
    return JSON.parse(node.textContent);
  }
}

/* ---------------- DOM helper ---------------- */
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      const v = attrs[k];
      if (v == null) continue;
      if (k === "class") e.className = v;
      else if (k === "html") e.innerHTML = v;
      else if (k.slice(0, 2) === "on" && typeof v === "function") e.addEventListener(k.slice(2).toLowerCase(), v);
      else e.setAttribute(k, v);
    }
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    e.appendChild(typeof kid === "object" ? kid : document.createTextNode(String(kid)));
  }
  return e;
}

const arr = (v) => (Array.isArray(v) ? v : v == null ? [] : [v]);
const has = (v) => v != null && !(Array.isArray(v) && v.length === 0) && !(typeof v === "string" && v.trim() === "");
const humanize = (s) => String(s).replace(/_/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());

/* Reusable components */
function section(title, ...content) {
  return h("section", { class: "card" }, h("h3", { class: "section-title" }, title), ...content);
}
function tableWrap(node) {
  return h("div", { class: "table-wrap" }, node);
}
function bulletList(items) {
  return h(
    "ul",
    { class: "clean" },
    items.map((it) => (typeof it === "string" ? h("li", null, it) : it))
  );
}

/* ---------------- Field renderers ---------------- */
const STAT_ORDER = ["STR", "DEX", "CON", "INT", "WIS", "CHA"];

function renderStatblock(stats) {

    STAT_ORDER.map((k) =>
      h("div", { class: "stat" }, h("div", { class: "stat-k" }, k), h("div", { class: "stat-v" }, stats[k] != null ? stats[k] : "—"))

}

function renderFeats(feats) {

    feats.map((f) =>
      h(
        "li",

        h("span", { class: "li-strong" }, f.feat),

function renderTags(items) {

    "div",
    { class: "tag-list" },
    arr(items).map((t) => h("span", { class: "tag" }, t))

}

function renderLevelingTable(rows) {

      "table",
      null,
      h("thead", null, h("tr", null, h("th", { scope: "col" }, "Lvl"), h("th", { scope: "col" }, "Class"), h("th", { scope: "col" }, "Gains"))),
      h(
        "tbody",
        null,
        rows.map((r) =>
          h(

function renderItemization(it) {
  const cols = [];
  ["act1", "act2", "act3"].forEach((key, i) => {
    if (has(it[key])) {
      cols.push(h("div", { class: "act-col" }, h("h4", null, "Act " + (i + 1)), bulletList(arr(it[key]))));
    }
  });
  // include any unexpected extra keys gracefully
  Object.keys(it).forEach((key) => {
    if (!["act1", "act2", "act3"].includes(key) && has(it[key])) {
      cols.push(h("div", { class: "act-col" }, h("h4", null, humanize(key)), bulletList(arr(it[key]))));
    }
  });
  return h("div", { class: "acts" }, cols);
}

function renderScores(scores) {
  return h(
    "div",
    { class: "meters" },
    Object.keys(scores).map((k) => {
      const val = Number(scores[k]);
      const pct = Math.max(0, Math.min(100, (val / 5) * 100));
      return h(
        "div",
        { class: "meter" },
        h(
          "div",
          { class: "meter-head" },
          h("span", { class: "meter-k" }, k),
          h("span", { class: "meter-v" }, val + " / 5")

          h("div", { class: "meter-fill", style: "width:" + pct + "%" })

function renderLateGame(cfg) {

  if (dl.children.length) kids.push(dl);

function renderNova(nova) {

/* ---------------- Build renderer ---------------- */
function renderBuild(b) {
  const wrap = h("div", { class: "build" });

  // Header block
  const head = h("section", { class: "card" }, h("h3", { class: "section-title" }, "Overview"));
  if (has(b.role)) head.appendChild(h("p", { class: "view-sub", style: "font-size:1rem;margin-bottom:12px" }, b.role));

  const facts = h("dl", { class: "facts" });
  const addFact = (label, valNode) => facts.appendChild(h("div", { class: "fact" }, h("dt", null, label), h("dd", null, valNode)));
  if (has(b.class)) addFact("Class", b.class);
  if (has(b.race)) {
    addFact("Race", h("span", null, b.race, has(b.race_notes) ? h("span", { class: "note" }, b.race_notes) : null));
  }
  if (has(b.background)) addFact("Background", b.background);
  if (has(b.build_order)) addFact("Build order", b.build_order);
  if (has(b.ability_targets)) addFact("Ability targets", b.ability_targets);
  if (has(b.casting)) addFact("Casting", b.casting);
  if (has(b.weapon_plan)) addFact("Weapon plan", b.weapon_plan);
  if (facts.children.length) head.appendChild(facts);
  wrap.appendChild(head);

  // Stat block
  if (has(b.starting_stats)) {
    const s = section("Starting stats", renderStatblock(b.starting_stats));
    if (has(b.stats_note)) s.appendChild(h("p", { class: "prose muted", style: "margin-top:10px;font-size:.85rem" }, b.stats_note));
    wrap.appendChild(s);
  }

  // Two-column mini-sections group (feats / invocations / metamagic / fighting styles / key spells)
  const kit = [];
  if (has(b.feats)) kit.push(section("Feats", renderFeats(b.feats)));
  if (has(b.invocations)) kit.push(section("Invocations", renderTags(b.invocations)));
  if (has(b.metamagic)) kit.push(section("Metamagic", renderTags(b.metamagic)));
  if (has(b.fighting_styles)) kit.push(section("Fighting styles", renderTags(b.fighting_styles)));
  if (has(b.key_spells)) kit.push(section("Key spells", bulletList(arr(b.key_spells))));
  if (kit.length) wrap.appendChild(h("div", { class: "subgrid two" }, kit));

  // Leveling
  if (has(b.leveling)) wrap.appendChild(section("Leveling", renderLevelingTable(b.leveling)));

  // Itemization
  if (has(b.itemization)) wrap.appendChild(section("Itemization", renderItemization(b.itemization)));

  // Playstyle
  if (has(b.playstyle)) wrap.appendChild(section("Playstyle", h("p", { class: "prose" }, b.playstyle)));

  // Traps
  if (has(b.traps)) wrap.appendChild(section("Traps & caveats", bulletList(arr(b.traps))));

  // Scores
  if (has(b.scores)) wrap.appendChild(section("Scores", renderScores(b.scores)));

  // Late game config
  if (has(b.late_game_config)) wrap.appendChild(section("Late-game configuration", renderLateGame(b.late_game_config)));

  // Nova
  if (has(b.nova)) wrap.appendChild(section("Nova turn", renderNova(b.nova)));

  return wrap;
}

/* ---------------- Character view (with build tabs) ---------------- */
function renderCharacter(name, builds) {
  const container = h("div", null);
  const header = h(
    "div",
    { class: "card" },
    h("h2", { class: "view-title" }, name),
    builds.length === 1 && has(builds[0].name) ? h("p", { class: "view-sub" }, builds[0].name) : null
  );
  container.appendChild(header);

  if (builds.length === 1) {
    container.appendChild(renderBuild(builds[0]));
    return container;
  }

  // Multiple builds → ARIA tabs
  const baseId = "char-" + name.replace(/[^a-z0-9]+/gi, "-").toLowerCase();
  const tablist = h("div", { class: "tabs", role: "tablist", "aria-label": name + " builds" });
  const panels = h("div", null);
  const tabs = [];

  builds.forEach((b, i) => {
    const tabId = baseId + "-tab-" + i;
    const panelId = baseId + "-panel-" + i;
    const selected = i === 0;
    const tab = h(
      "button",
      {
        class: "tab",
        role: "tab",
        id: tabId,
        "aria-controls": panelId,
        "aria-selected": String(selected),
        tabindex: selected ? "0" : "-1",
        type: "button",
      },
      b.name || "Build " + (i + 1),
      b.is_primary ? h("span", { class: "badge" }, "Primary") : null
    );
    const panel = h(
      "div",
      { role: "tabpanel", id: panelId, "aria-labelledby": tabId, tabindex: "0", hidden: selected ? null : "hidden" },
      renderBuild(b)
    );
    if (!selected) panel.setAttribute("hidden", "hidden");

    const activate = (focus) => {
      tabs.forEach((t, j) => {
        const on = j === i;
        t.tab.setAttribute("aria-selected", String(on));
        t.tab.tabIndex = on ? 0 : -1;
        if (on) t.panel.removeAttribute("hidden");
        else t.panel.setAttribute("hidden", "hidden");
      });
      if (focus) tab.focus();
    };
    tab.addEventListener("click", () => activate(false));
    tabs.push({ tab, panel, activate });
    tablist.appendChild(tab);
    panels.appendChild(panel);
  });

  tablist.addEventListener("keydown", (ev) => {
    const cur = tabs.findIndex((t) => t.tab.getAttribute("aria-selected") === "true");
    let next = -1;
    if (ev.key === "ArrowRight" || ev.key === "ArrowDown") next = (cur + 1) % tabs.length;
    else if (ev.key === "ArrowLeft" || ev.key === "ArrowUp") next = (cur - 1 + tabs.length) % tabs.length;
    else if (ev.key === "Home") next = 0;
    else if (ev.key === "End") next = tabs.length - 1;
    if (next >= 0) {
      ev.preventDefault();
      tabs[next].activate(true);
    }
  });

  container.appendChild(tablist);
  container.appendChild(panels);
  return container;
}

/* ---------------- Theme ---------------- */
function storedTheme() {
  let stored = null;
  try {
    stored = localStorage.getItem("bg3-theme");
  } catch (e) {
    /* storage blocked (e.g. file:// opaque origin, privacy mode) — ignore */
  }
  return stored === "light" || stored === "dark" ? stored : null;
}
function currentTheme() {
  const stored = storedTheme();
  if (stored) return stored;
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
}
function buildThemeToggle() {
  const btn = h("button", { class: "theme-toggle", type: "button", title: "Switch between light and dark theme" });
  const paint = () => {
    const t = document.documentElement.getAttribute("data-theme");
    const dark = t === "dark";
    // Visible text becomes the accessible name (WCAG 2.5.3 Label in Name).
    btn.textContent = dark ? "☀  Light" : "☽  Dark";
    btn.setAttribute("aria-pressed", String(dark));
  };
  btn.addEventListener("click", () => {
    const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    try {
      localStorage.setItem("bg3-theme", next);
    } catch (e) {
      /* storage blocked — theme still applies for this session */
    }
    applyTheme(next);
    paint();
  });
  paint();

  // Follow OS theme changes while the page is open, unless the user made an explicit choice.
  if (window.matchMedia) {
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const onChange = (ev) => {
      if (storedTheme()) return;
      applyTheme(ev.matches ? "dark" : "light");
      paint();
    };
    if (mq.addEventListener) mq.addEventListener("change", onChange);
    else if (mq.addListener) mq.addListener(onChange);
  }

  return btn;
}

  frag.appendChild(h("p", { class: "view-sub" }, a.areas.length + " areas · ★ = core build item"));

function renderHeatmap(hm) {
  const frag = document.createDocumentFragment();
  frag.appendChild(h("h2", { class: "view-title", tabindex: "-1" }, "Strengths"));
  const dims = (hm && hm.dimensions) || [];
  const scores = (hm && hm.scores) || {};
  const chars = Object.keys(scores);
  const max = (hm && hm.scale_max) || 5;
  if (!dims.length || !chars.length) { frag.appendChild(h("p", { class: "muted" }, "No heatmap data.")); return frag; }
  if (hm.note) frag.appendChild(h("p", { class: "view-sub" }, hm.note));
  const head = h("tr", null, h("th", { scope: "col" }, "Dimension"), chars.map((c) => h("th", { scope: "col" }, c)));
  const body = dims.map((d, di) =>
    h("tr", null,
      h("th", { scope: "row" }, d),
      chars.map((c) => {
        const v = (scores[c] || [])[di];
        const pct = v == null ? 0 : Math.round((v / max) * 82);
        return h("td", {
          class: "hm-cell",
          style: "background: color-mix(in srgb, var(--accent) " + pct + "%, transparent);",
          title: c + " · " + d + ": " + (v == null ? "—" : v + "/" + max)
        }, v == null ? "—" : String(v));
      })
    )
  );
  frag.appendChild(section("Role heatmap (0–" + max + ")",
    tableWrap(h("table", { class: "heatmap-table" }, h("thead", null, head), h("tbody", null, body)))
  ));
  return frag;
}

function buildNav(data, onSelect) {
  const list = document.getElementById("nav-list");
  list.innerHTML = "";
  const entries = [{ key: "__overview__", label: "Party overview", sub: "Roster · synergies · loot" }];
  Object.keys(data.characters).forEach((name) => {
    const builds = data.characters[name];
    const primary = builds.find((b) => b.is_primary) || builds[0];
    entries.push({ key: name, label: name, sub: (primary && primary.class) || "" });
  });
  if (Array.isArray(data.loot_guide)) {
    data.loot_guide.forEach((a) => entries.push({ key: "__loot" + a.act + "__", label: "Loot — Act " + a.act, sub: a.areas.length + " areas" }));
  }
  if (data.heatmap && data.heatmap.scores) entries.push({ key: "__heatmap__", label: "Strengths", sub: "Role heatmap" });

  const buttons = [];
  entries.forEach((entry, i) => {
    const btn = h(
      "button",
      { class: "nav-item", type: "button", "data-key": entry.key, tabindex: i === 0 ? "0" : "-1" },
      h("span", { class: "nav-dot", "aria-hidden": "true" }),
      h(
        "span",
        { class: "nav-label" },
        h("span", { class: "nav-name" }, entry.label),
        entry.sub ? h("span", { class: "nav-sub" }, entry.sub) : null
      )
    );
    btn.addEventListener("click", () => onSelect(entry.key));
    buttons.push(btn);
    list.appendChild(h("li", null, btn));
  });

  list.addEventListener("keydown", (ev) => {
    const idx = buttons.indexOf(document.activeElement);
    if (idx < 0) return;
    let next = -1;
    if (ev.key === "ArrowDown" || ev.key === "ArrowRight") next = (idx + 1) % buttons.length;
    else if (ev.key === "ArrowUp" || ev.key === "ArrowLeft") next = (idx - 1 + buttons.length) % buttons.length;
    else if (ev.key === "Home") next = 0;
    else if (ev.key === "End") next = buttons.length - 1;
    // Enter/Space activation is left to the native <button> to avoid double-firing.
    if (next >= 0) {
      ev.preventDefault();
      buttons.forEach((b, j) => (b.tabIndex = j === next ? 0 : -1));
      buttons[next].focus();
    }
  });

  return {
    setActive(key) {
      buttons.forEach((b) => {
        const on = b.getAttribute("data-key") === key;
        if (on) b.setAttribute("aria-current", "page");
        else b.removeAttribute("aria-current");
        // Keep the roving tab stop on the selected item (mouse clicks included).
        b.tabIndex = on ? 0 : -1;
      });
    },
  };
}

/* ---------------- Boot ---------------- */
(async function init() {
  applyTheme(currentTheme());
  const data = await loadData();
  renderHeader(data.meta || {});

  // Keep the sticky-sidebar offset in sync with the real (wrapping) header height.
  const headerEl = document.querySelector("header.app");
  if (headerEl) {
    const syncHeaderH = () => {
      const hgt = Math.round(headerEl.getBoundingClientRect().height);
      if (hgt) document.documentElement.style.setProperty("--header-h", hgt + "px");
    };
    syncHeaderH();
    if (window.ResizeObserver) new ResizeObserver(syncHeaderH).observe(headerEl);
    else window.addEventListener("resize", syncHeaderH);
  }

  const content = document.getElementById("main-content");
  let nav;
  let booted = false;

  function select(key) {
    content.innerHTML = "";
    if (key === "__overview__") content.appendChild(renderOverview(data.party || {}));
    else if (key === "__heatmap__") content.appendChild(renderHeatmap(data.heatmap || {}));
    else if (key.indexOf("__loot") === 0) {
      const act = parseInt(key.replace(/[^0-9]/g, ""), 10);
      content.appendChild(renderLoot((data.loot_guide || []).find((x) => x.act === act)));
    }
    else content.appendChild(renderCharacter(key, data.characters[key]));
    if (nav) nav.setActive(key);
    window.scrollTo({ top: 0 });
    // Move focus into the freshly rendered view so keyboard/screen-reader users
    // land on (and hear) the new content. Skip on the initial render to avoid
    // stealing focus / forcing a focus ring on first load.
    if (booted) {
      const title = content.querySelector(".view-title") || content;
      title.setAttribute("tabindex", "-1");
      title.focus();
    }
    booted = true;
  }

  nav = buildNav(data, select);
  select("__overview__");
})();
</script>
