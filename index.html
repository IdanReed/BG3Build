<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BG3 Party Plan</title>
<script>
  /* Set theme before first paint to avoid a flash of the wrong theme. */
  (function () {
    try {
      var stored = null;
      try { stored = localStorage.getItem("bg3-theme"); } catch (e) {}
      var t = (stored === "light" || stored === "dark")
        ? stored
        : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
<style>
  :root {
    --bg: #f5f6fb;
    --surface: #ffffff;
    --surface-2: #eceef6;
    --surface-3: #e2e5f0;
    --text: #191b22;
    --text-muted: #565b6e;
    --border: #d5d9e6;
    --accent: #6a35e0;
    --accent-soft: #efe9ff;
    --accent-text: #ffffff;
    --good: #1f8a4c;
    --warn: #a04b00;
    --shadow: 0 1px 3px rgba(20,22,40,.08), 0 4px 16px rgba(20,22,40,.06);
    --radius: 12px;
    --header-h: 76px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1016;
      --surface: #171a22;
      --surface-2: #1e222d;
      --surface-3: #262b38;
      --text: #e8eaf1;
      --text-muted: #a5aaba;
      --border: #2c3242;
      --accent: #a488ff;
      --accent-soft: #241f3a;
      --accent-text: #14121f;
      --good: #57cd87;
      --warn: #f0a860;
      --shadow: 0 1px 3px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  html[data-theme="light"] {
    --bg: #f5f6fb; --surface: #ffffff; --surface-2: #eceef6; --surface-3: #e2e5f0;
    --text: #191b22; --text-muted: #565b6e; --border: #d5d9e6; --accent: #6a35e0;
    --accent-soft: #efe9ff; --accent-text: #ffffff; --good: #1f8a4c; --warn: #a04b00;
    --shadow: 0 1px 3px rgba(20,22,40,.08), 0 4px 16px rgba(20,22,40,.06);
  }
  html[data-theme="dark"] {
    --bg: #0e1016; --surface: #171a22; --surface-2: #1e222d; --surface-3: #262b38;
    --text: #e8eaf1; --text-muted: #a5aaba; --border: #2c3242; --accent: #a488ff;
    --accent-soft: #241f3a; --accent-text: #14121f; --good: #57cd87; --warn: #f0a860;
    --shadow: 0 1px 3px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); }

  /* ---- Header ---- */
  header.app {
    position: sticky; top: 0; z-index: 30;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow);
  }
  .header-inner {
    max-width: 1200px; margin: 0 auto; padding: 14px 20px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .header-titles { flex: 1 1 340px; min-width: 0; }
  .header-titles h1 {
    margin: 0 0 8px; font-size: 1.25rem; line-height: 1.25; font-weight: 700;
    letter-spacing: -.01em;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface-2); color: var(--text-muted);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 3px 10px; font-size: .78rem; font-weight: 600; white-space: nowrap;
  }
  .chip.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .chip .chip-k { color: var(--text-muted); font-weight: 500; opacity: .8; }
  a.chip { text-decoration: none; color: var(--text-muted); }
  a.chip:hover { border-color: var(--accent); color: var(--accent); }
  a.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a.chip .chip-doc-icon { opacity: .7; }
  details.assumptions { flex-basis: 100%; margin-top: 4px; }
  details.assumptions summary {
    cursor: pointer; font-size: .8rem; color: var(--accent); font-weight: 600;
    list-style: none; display: inline-block; padding: 2px 0;
  }
  details.assumptions summary::-webkit-details-marker { display: none; }
  details.assumptions summary::before { content: "\25B8  "; }
  details.assumptions[open] summary::before { content: "\25BE  "; }
  details.assumptions .assume-body { font-size: .85rem; color: var(--text-muted); margin-top: 6px; }
  details.assumptions .assume-body p { margin: 6px 0; }
  details.assumptions summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  [role="tabpanel"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

  .theme-toggle {
    flex: 0 0 auto;
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 8px 14px; font-size: .82rem; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- Top-level section tabs ---- */
  .toptabs-bar { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
  .toptabs { display: flex; gap: 4px; }
  .toptab {
    background: var(--surface-2); border: none; border-bottom: 2px solid transparent;
    padding: 10px 18px; font: inherit; font-size: .95rem; font-weight: 700; cursor: pointer;
    color: var(--text-muted); margin-bottom: -1px; border-radius: 8px 8px 0 0;
    letter-spacing: -.01em;
  }
  .toptab:hover { color: var(--text); background: var(--surface-3); }
  .toptab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); background: var(--surface); }
  .toptab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* ---- Sidebar sub-group heading ---- */
  .nav-group-h {
    font-size: .7rem; text-transform: uppercase; letter-spacing: .08em;
    color: var(--text-muted); margin: 12px 10px 4px; font-weight: 700;
    display: flex; align-items: center; gap: 8px;
  }
  .nav-group-h::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  /* Grafted from candidate B: indent the grouped Characters so Overview +
     Proficiencies read as the parent/top of the Party area. */
  .nav-item.nav-item-sub { padding-left: 20px; }

  /* ---- Layout ---- */
  .layout {
    max-width: 1200px; margin: 0 auto; padding: 20px;
    display: grid; grid-template-columns: 250px 1fr; gap: 20px; align-items: start;
  }
  .sidebar {
    position: sticky; top: calc(var(--header-h, 76px) + 8px);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 8px; box-shadow: var(--shadow);
  }
  .sidebar h2 {
    font-size: .7rem; text-transform: uppercase; letter-spacing: .08em;
    color: var(--text-muted); margin: 8px 10px; font-weight: 700;
  }
  .nav-list { list-style: none; margin: 0 0 6px; padding: 0; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    background: none; border: none; text-align: left; cursor: pointer;
    color: var(--text); font: inherit; font-size: .92rem; font-weight: 500;
    padding: 9px 12px; border-radius: 8px; margin-bottom: 2px;
  }
  .nav-item:hover { background: var(--surface-2); }
  .nav-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .nav-item[aria-current="page"] {
    background: var(--accent-soft); color: var(--accent); font-weight: 700;
  }
  .nav-item .nav-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--border); flex: 0 0 auto;
  }
  .nav-item[aria-current="page"] .nav-dot { background: var(--accent); }
  .nav-item .nav-sub { display: block; font-size: .72rem; color: var(--text-muted); font-weight: 500; }
  .nav-item[aria-current="page"] .nav-sub { color: var(--accent); opacity: .85; }
  .nav-item .nav-label { display: flex; flex-direction: column; min-width: 0; }
  .nav-item .nav-label .nav-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  main.content { min-width: 0; }

  /* ---- Cards / sections ---- */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 18px 20px; margin-bottom: 18px;
  }
  .view-title { margin: 0 0 4px; font-size: 1.5rem; font-weight: 700; letter-spacing: -.01em; }
  .view-sub { color: var(--text-muted); margin: 0 0 4px; font-size: .95rem; }

  .section-title {
    font-size: .74rem; text-transform: uppercase; letter-spacing: .08em;
    color: var(--accent); font-weight: 700; margin: 0 0 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  .prose { margin: 0; color: var(--text); }
  .muted { color: var(--text-muted); }

  /* ---- Tables ---- */
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 10px; border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; font-size: .88rem; min-width: 420px; }
  thead th {
    background: var(--surface-2); text-align: left; padding: 9px 12px;
    font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em;
    color: var(--text-muted); white-space: nowrap; border-bottom: 1px solid var(--border);
  }
  tbody td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--surface-2) 45%, transparent); }
  td .cell-strong { font-weight: 600; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ---- Definition grid ---- */
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 20px; margin: 0; }
  .fact { min-width: 0; }
  .fact dt { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); font-weight: 700; margin-bottom: 2px; }
  .fact dd { margin: 0; font-size: .92rem; }
  .fact dd .note { display: block; font-size: .8rem; color: var(--text-muted); margin-top: 2px; }

  /* ---- Stat block ---- */
  .statblock { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .stat {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 4px; text-align: center;
  }
  .stat .stat-k { font-size: .66rem; font-weight: 700; letter-spacing: .05em; color: var(--text-muted); }
  .stat .stat-v { font-size: 1.35rem; font-weight: 700; line-height: 1.1; }
  @media (max-width: 560px) { .statblock { grid-template-columns: repeat(3, 1fr); } }

  /* ---- Lists ---- */
  ul.clean { list-style: none; margin: 0; padding: 0; }
  ul.clean li { position: relative; padding: 5px 0 5px 20px; font-size: .9rem; border-bottom: 1px solid var(--border); }
  ul.clean li:last-child { border-bottom: none; }
  ul.clean li::before { content: ""; position: absolute; left: 4px; top: 13px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  ul.clean li .li-strong { font-weight: 600; }
  ul.clean li .li-meta { color: var(--text-muted); font-size: .82rem; }

  .tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 4px 10px; font-size: .84rem; font-weight: 500;
  }

  /* ---- Itemization columns ---- */
  .acts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  .act-col { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .act-col h4 { margin: 0 0 8px; font-size: .82rem; color: var(--accent); text-transform: uppercase; letter-spacing: .05em; }

  /* ---- Meters ---- */
  .meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
  .meter .meter-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
  .meter .meter-k { font-size: .8rem; font-weight: 700; text-transform: capitalize; }
  .meter .meter-v { font-size: .8rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .meter .meter-track { height: 8px; background: var(--surface-3); border-radius: 999px; overflow: hidden; }
  .meter .meter-fill { height: 100%; background: var(--accent); border-radius: 999px; }

  /* ---- Nova ---- */
  .nova-config { border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 14px; background: var(--surface-2); }
  .nova-config h4 { margin: 0 0 10px; font-size: 1rem; }
  tr.total-row td { background: var(--accent-soft) !important; font-weight: 700; color: var(--accent); border-top: 2px solid var(--accent); }

  .callout {
    background: var(--surface-2); border-left: 3px solid var(--accent);
    border-radius: 0 8px 8px 0; padding: 10px 14px; font-size: .86rem; color: var(--text-muted);
    margin-top: 12px;
  }
  .callout .callout-k { display: block; font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); font-weight: 700; margin-bottom: 3px; }
  .callout.warn { border-left-color: var(--warn); }
  .callout.warn .callout-k { color: var(--warn); }

  /* ---- Tabs ---- */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; flex-wrap: wrap; }
  .tab {
    background: none; border: none; border-bottom: 2px solid transparent;
    padding: 9px 14px; font: inherit; font-size: .9rem; font-weight: 600; cursor: pointer;
    color: var(--text-muted); margin-bottom: -1px; display: inline-flex; align-items: center; gap: 8px;
    border-radius: 8px 8px 0 0;
  }
  .tab:hover { color: var(--text); background: var(--surface-2); }
  .tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .badge {
    background: var(--accent); color: var(--accent-text); font-size: .62rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: .04em; padding: 2px 6px; border-radius: 999px;
  }

  .subgrid { display: grid; gap: 18px; }
  @media (min-width: 780px) { .subgrid.two { grid-template-columns: 1fr 1fr; align-items: start; } }

  /* ---- Mobile ---- */
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; padding: 14px; gap: 14px; }
    .sidebar { position: static; top: auto; }
    .nav-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .nav-item { width: auto; margin-bottom: 0; }
    .sidebar h2 { width: 100%; margin: 6px 6px 2px; }
    .nav-group-h { width: 100%; margin: 6px 6px 2px; }
    .nav-item.nav-item-sub { padding-left: 12px; }
    .nav-item .nav-sub { display: none; }
  }
  @media (max-width: 480px) {
    .header-inner { padding: 12px 14px; }
    .toptabs-bar { padding: 0 14px; }
    .card { padding: 14px; }
    .view-title { font-size: 1.25rem; }
  }
  .skip-link {
    position: absolute; left: -999px; top: 8px; background: var(--accent); color: var(--accent-text);
    padding: 8px 14px; border-radius: 8px; z-index: 100; font-weight: 600;
  }
  .skip-link:focus { left: 8px; }
</style>
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>
<header class="app">
  <div class="header-inner" id="app-header"></div>
  <div class="toptabs-bar">
    <div class="toptabs" role="tablist" aria-label="Party and Loot" id="top-tabs"></div>
  </div>
</header>

<div class="layout">
  <nav class="sidebar" aria-label="Section sub-navigation">
    <h2 id="nav-heading">Party</h2>
    <ul class="nav-list" id="nav-list" role="list" aria-labelledby="nav-heading"></ul>
  </nav>
  <main class="content" id="main-content" role="tabpanel" tabindex="-1"></main>
</div>


<script>
"use strict";

/* ---------------- Data loading ---------------- */
async function loadData() {
  // Served by the local bg3 server, which assembles the plan from content/*.md.
  const res = await fetch("/api/plan", { cache: "no-store" });
  if (!res.ok) throw new Error("GET /api/plan failed: " + res.status);
  return await res.json();
}

/* ---------------- DOM helper ---------------- */
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      const v = attrs[k];
      if (v == null) continue;
      if (k === "class") e.className = v;
      else if (k === "html") e.innerHTML = v;
      else if (k.slice(0, 2) === "on" && typeof v === "function") e.addEventListener(k.slice(2).toLowerCase(), v);
      else e.setAttribute(k, v);
    }
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    e.appendChild(typeof kid === "object" ? kid : document.createTextNode(String(kid)));
  }
  return e;
}

const arr = (v) => (Array.isArray(v) ? v : v == null ? [] : [v]);
const has = (v) => v != null && !(Array.isArray(v) && v.length === 0) && !(typeof v === "string" && v.trim() === "");
const humanize = (s) => String(s).replace(/_/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
const slug = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");

/* ---------------- Checkoff state (server-persisted) ----------------
   PROGRESS is a flat { key: true } map mirrored from the server's
   progress.json. Renderers read isChecked(key) at build time (the DOM is
   rebuilt on every nav switch, so state lives here, not in the DOM). Toggling
   updates the map and POSTs; if there's no server (file://) it stays in-memory. */
let PROGRESS = {};
async function loadProgress() {
  try {
    const res = await fetch("/api/progress", { cache: "no-store" });
    if (!res.ok) throw new Error("bad status " + res.status);
    const data = await res.json();
    PROGRESS = (data && data.checked) || {};
  } catch (e) {
    PROGRESS = {}; // no server → checkoffs are session-only
  }
}
function isChecked(key) { return !!PROGRESS[key]; }
async function setChecked(key, checked) {
  if (checked) PROGRESS[key] = true;
  else delete PROGRESS[key];
  try {
    await fetch("/api/progress", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key: key, checked: checked }),
    });
  } catch (e) {
    /* keep the in-memory toggle even if the server isn't reachable */
  }
}
/* A checkbox bound to a checkoff key. */
function checkbox(key) {
  const cb = h("input", { type: "checkbox", class: "ck", "aria-label": "Mark done" });
  cb.checked = isChecked(key);
  cb.addEventListener("change", () => setChecked(key, cb.checked));
  return cb;
}

/* Reusable components */
function section(title, ...content) {
  return h("section", { class: "card" }, h("h3", { class: "section-title" }, title), ...content);
}
function tableWrap(node) {
  return h("div", { class: "table-wrap" }, node);
}
function bulletList(items) {
  return h(
    "ul",
    { class: "clean" },
    items.map((it) => (typeof it === "string" ? h("li", null, it) : it))
  );
}

/* ---------------- Lightweight prose formatter ----------------
   Renders a small, safe Markdown subset from the content files into DOM nodes
   (content is never fed to innerHTML, so there's nothing to escape):
     • blank line       → new paragraph
     • lines "- "/"* "  → bullet list
     • **bold**         → <strong>
     • "Label: rest"    → bold lead-in on a bullet (auto, ≤18 chars)
   Used for the long prose fields so they scan at a glance. */
function inlineBold(text, target) {
  String(text).split(/\*\*(.+?)\*\*/g).forEach((part, i) => {
    if (part === "") return;
    if (i % 2 === 1) target.appendChild(h("strong", null, part));
    else target.appendChild(document.createTextNode(part));
  });
}
function bulletItem(text) {
  const li = h("li", null);
  const m = text.match(/^([^:*]{1,18}):\s+([\s\S]+)$/);
  if (m) {
    li.appendChild(h("strong", null, m[1]));
    li.appendChild(document.createTextNode(": "));
    inlineBold(m[2], li);
  } else {
    inlineBold(text, li);
  }
  return li;
}
function richText(str, pClass) {
  const frag = document.createDocumentFragment();
  const lines = String(str).replace(/\r\n/g, "\n").split("\n");
  let para = [];
  let list = null;
  const flushPara = () => {
    if (!para.length) return;
    const p = h("p", { class: "prose" + (pClass ? " " + pClass : "") });
    inlineBold(para.join(" "), p);
    frag.appendChild(p);
    para = [];
  };
  const flushList = () => {
    if (list) { frag.appendChild(list); list = null; }
  };
  lines.forEach((raw) => {
    const line = raw.trim();
    if (!line) { flushPara(); flushList(); return; }
    if (/^[-*]\s+/.test(line)) {
      flushPara();
      if (!list) list = h("ul", { class: "prose-list" });
      list.appendChild(bulletItem(line.replace(/^[-*]\s+/, "")));
    } else {
      flushList();
      para.push(line);
    }
  });
  flushPara();
  flushList();
  return frag;
}

/* ---------------- Field renderers ---------------- */
const STAT_ORDER = ["STR", "DEX", "CON", "INT", "WIS", "CHA"];

function renderStatblock(stats) {
  return h(
    "div",
    { class: "statblock" },
    STAT_ORDER.map((k) =>

/* Leveling can be a flat array (single table) or { respecs: [...] }. A respec
   rebuilds the character from level 1, so each respec segment is its own tab
   holding that segment's full leveling order. */
function renderLeveling(lv, idHint, keyRoot) {
  if (Array.isArray(lv)) return renderLevelingTable(lv, keyRoot ? "lvl:" + keyRoot + "/main" : null);
  if (lv && Array.isArray(lv.respecs)) {
    const idBase = "lvl-" + String(idHint || "build").replace(/[^a-z0-9]+/gi, "-").toLowerCase();
    return miniTabs(
      idBase,
      lv.respecs.map((seg) => ({
        label: seg.label || "Segment",
        content: h(
          "div",
          null,
          has(seg.note) ? h("p", { class: "prose muted", style: "margin-top:0;font-size:.85rem" }, seg.note) : null,
          renderLevelingTable(arr(seg.rows), keyRoot ? "lvl:" + keyRoot + "/" + slug(seg.label || "segment") : null)

  return h("div");
}

/* A checkable itemization list. Entries are either bare strings (pre-migration)
   or { id, item, note } objects (post-migration); both render the same and get
   a stable checkoff key. */
function itemChecklist(entries, act, keyRoot) {
  return h(
    "ul",
    { class: "clean checklist" },
    entries.map((entry, i) => {
      const isObj = entry && typeof entry === "object";
      const label = isObj ? entry.note || entry.item || "" : String(entry);
      const id = isObj && entry.id ? entry.id : (slug(label).slice(0, 60) || "i" + i);
      const key = keyRoot ? "item:" + keyRoot + "/" + act + "/" + id : null;
      return h("li", { class: "ck-li" }, key ? checkbox(key) : null, h("span", null, label));
    })
  );
}

function renderItemization(it, keyRoot) {
  const cols = [];

  Object.keys(it).forEach((key) => {

  });

}

function renderBuild(b, charName) {
  const wrap = h("div", { class: "build" });
  // Root for this build's checkoff keys, e.g. "durc/the-three-booms".
  const keyRoot = slug(charName || "char") + "/" + slug(b.name || "build");

  // Header block — the build overview. Identity (race/background/stats) lives in
  // Character Creation below; the level-1 class mechanics live in Leveling.
  const head = h("section", { class: "card" }, h("h3", { class: "section-title" }, "Overview"));
  if (has(b.role)) head.appendChild(h("p", { class: "view-sub", style: "font-size:1rem;margin-bottom:12px" }, b.role));

  const facts = h("dl", { class: "facts" });
  const addFact = (label, valNode) => facts.appendChild(h("div", { class: "fact" }, h("dt", null, label), h("dd", null, valNode)));
  if (has(b.class)) addFact("Class", b.class);
  if (has(b.build_order)) addFact("Build order", b.build_order);
  if (has(b.ability_targets)) addFact("Ability targets", b.ability_targets);
  if (has(b.casting)) addFact("Casting", b.casting);
  if (has(b.weapon_plan)) addFact("Weapon plan", b.weapon_plan);
  if (facts.children.length) head.appendChild(facts);
  wrap.appendChild(head);

  // Character Creation — the character-creation choices only: race, background,
  // and ability scores. The first-level class mechanics moved into Leveling.
  if (has(b.race) || has(b.background) || has(b.starting_stats)) {
    const cre = section("Character Creation");
    const idf = h("dl", { class: "facts" });
    if (has(b.race)) idf.appendChild(h("div", { class: "fact" }, h("dt", null, "Race"), h("dd", null, h("span", null, b.race, has(b.race_notes) ? h("span", { class: "note" }, b.race_notes) : null))));
    if (has(b.background)) idf.appendChild(h("div", { class: "fact" }, h("dt", null, "Background"), h("dd", null, b.background)));
    if (idf.children.length) cre.appendChild(idf);
    if (has(b.starting_stats)) {
      cre.appendChild(subhead("Ability scores"));
      cre.appendChild(renderStatblock(b.starting_stats));
      if (has(b.stats_note)) cre.appendChild(h("p", { class: "prose muted", style: "margin-top:10px;font-size:.85rem" }, b.stats_note));
    }
    wrap.appendChild(cre);
  }

  // Two-column mini-sections group (feats / invocations / metamagic / fighting styles / key spells)
  const kit = [];
  if (has(b.feats)) kit.push(section("Feats", renderFeats(b.feats)));
  if (has(b.invocations)) kit.push(section("Invocations", renderTags(b.invocations)));
  if (has(b.metamagic)) kit.push(section("Metamagic", renderTags(b.metamagic)));
  if (has(b.fighting_styles)) kit.push(section("Fighting styles", renderTags(b.fighting_styles)));
  if (has(b.key_spells)) kit.push(section("Key spells", bulletList(arr(b.key_spells))));
  if (kit.length) wrap.appendChild(h("div", { class: "subgrid two" }, kit));

  // Leveling — the level-1 creation / first-level detail (moved out of Character
  // Creation) followed by the per-level path. Flat array = single table;
  // { respecs } = one tab per respec (each a full level-1 rebuild).
  if (has(b.creation) || has(b.leveling)) {
    const tabbed = b.leveling && !Array.isArray(b.leveling) && b.leveling.respecs;
    const lvlKids = [];
    if (has(b.creation)) {
      lvlKids.push(subhead("Level 1 — starting class, proficiencies & spells"));
      lvlKids.push(renderCreation(b.creation));
    }
    if (has(b.leveling)) {
      if (has(b.creation)) lvlKids.push(subhead(tabbed ? "Level-up path (by respec)" : "Level-up path"));
      lvlKids.push(renderLeveling(b.leveling, b.name, keyRoot));
    }
    wrap.appendChild(section(tabbed ? "Leveling by respec" : "Leveling", ...lvlKids));
  }

  // Spell selection
  if (has(b.spells)) wrap.appendChild(section("Spell selection (mandatory / recommended)", renderSpells(b.spells)));

  // Itemization
  if (has(b.itemization)) wrap.appendChild(section("Itemization", renderItemization(b.itemization, keyRoot)));

  // Playstyle
  if (has(b.playstyle)) wrap.appendChild(section("Playstyle", richText(b.playstyle)));

  // Traps
  if (has(b.traps)) wrap.appendChild(section("Traps & caveats", bulletList(arr(b.traps))));

  // Pickpocketing
  if (has(b.pickpocket)) wrap.appendChild(section("Pickpocketing", renderPickpocket(b.pickpocket)));

  // Scores
  if (has(b.scores)) wrap.appendChild(section("Scores", renderScores(b.scores)));

  // Late game config
  if (has(b.late_game_config)) wrap.appendChild(section("Late-game configuration", renderLateGame(b.late_game_config)));

  // Nova
  if (has(b.nova)) wrap.appendChild(section("Nova turn", renderNova(b.nova)));

  return wrap;
}

/* ---------------- Character view (with build tabs) ---------------- */
function renderCharacter(name, builds) {
  const container = h("div", null);
  const header = h(
    "div",
    { class: "card" },
    h("h2", { class: "view-title" }, name),
    builds.length === 1 && has(builds[0].name) ? h("p", { class: "view-sub" }, builds[0].name) : null
  );
  container.appendChild(header);

  if (builds.length === 1) {
    container.appendChild(renderBuild(builds[0], name));
    return container;
  }

  // Multiple builds → ARIA tabs
  const baseId = "char-" + name.replace(/[^a-z0-9]+/gi, "-").toLowerCase();
  const tablist = h("div", { class: "tabs", role: "tablist", "aria-label": name + " builds" });
  const panels = h("div", null);
  const tabs = [];

  builds.forEach((b, i) => {
    const tabId = baseId + "-tab-" + i;
    const panelId = baseId + "-panel-" + i;
    const selected = i === 0;
    const tab = h(
      "button",
      {
        class: "tab",
        role: "tab",
        id: tabId,
        "aria-controls": panelId,
        "aria-selected": String(selected),
        tabindex: selected ? "0" : "-1",
        type: "button",
      },
      b.name || "Build " + (i + 1),
      b.is_primary ? h("span", { class: "badge" }, "Primary") : null
    );
    const panel = h(
      "div",
      { role: "tabpanel", id: panelId, "aria-labelledby": tabId, tabindex: "0", hidden: selected ? null : "hidden" },
      renderBuild(b, name)
    );
    if (!selected) panel.setAttribute("hidden", "hidden");

    const activate = (focus) => {
      tabs.forEach((t, j) => {
        const on = j === i;
        t.tab.setAttribute("aria-selected", String(on));
        t.tab.tabIndex = on ? 0 : -1;
        if (on) t.panel.removeAttribute("hidden");
        else t.panel.setAttribute("hidden", "hidden");
      });
      if (focus) tab.focus();
    };
    tab.addEventListener("click", () => activate(false));
    tabs.push({ tab, panel, activate });
    tablist.appendChild(tab);
    panels.appendChild(panel);
  });

  tablist.addEventListener("keydown", (ev) => {
    const cur = tabs.findIndex((t) => t.tab.getAttribute("aria-selected") === "true");
    let next = -1;
    if (ev.key === "ArrowRight" || ev.key === "ArrowDown") next = (cur + 1) % tabs.length;
    else if (ev.key === "ArrowLeft" || ev.key === "ArrowUp") next = (cur - 1 + tabs.length) % tabs.length;
    else if (ev.key === "Home") next = 0;
    else if (ev.key === "End") next = tabs.length - 1;
    if (next >= 0) {
      ev.preventDefault();
      tabs[next].activate(true);
    }
  });

  container.appendChild(tablist);
  container.appendChild(panels);
  return container;
}

/* ---------------- Theme ---------------- */
function storedTheme() {
  let stored = null;
  try {
    stored = localStorage.getItem("bg3-theme");
  } catch (e) {
    /* storage blocked (e.g. file:// opaque origin, privacy mode) — ignore */
  }
  return stored === "light" || stored === "dark" ? stored : null;
}
function currentTheme() {
  const stored = storedTheme();
  if (stored) return stored;
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
}
function buildThemeToggle() {
  const btn = h("button", { class: "theme-toggle", type: "button", title: "Switch between light and dark theme" });
  const paint = () => {
    const t = document.documentElement.getAttribute("data-theme");
    const dark = t === "dark";
    // Visible text becomes the accessible name (WCAG 2.5.3 Label in Name).
    btn.textContent = dark ? "☀  Light" : "☽  Dark";
    btn.setAttribute("aria-pressed", String(dark));
  };
  btn.addEventListener("click", () => {
    const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    try {
      localStorage.setItem("bg3-theme", next);
    } catch (e) {
      /* storage blocked — theme still applies for this session */
    }
    applyTheme(next);
    paint();
  });
  paint();

  // Follow OS theme changes while the page is open, unless the user made an explicit choice.
  if (window.matchMedia) {
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const onChange = (ev) => {
      if (storedTheme()) return;
      applyTheme(ev.matches ? "dark" : "light");
      paint();
    };
    if (mq.addEventListener) mq.addEventListener("change", onChange);
    else if (mq.addListener) mq.addListener(onChange);
  }

  return btn;
}

/* Reusable ARIA tab group (same behaviour as the build tabs). entries = [{label, count, content}]. */
function miniTabs(idBase, entries) {
  const wrap = h("div", null);
  const tablist = h("div", { class: "tabs", role: "tablist" });
  const panels = h("div", null);
  const tabs = [];
  entries.forEach((entry, i) => {
    const tabId = idBase + "-t-" + i;
    const panelId = idBase + "-p-" + i;
    const selected = i === 0;
    const tab = h("button", {
      class: "tab", role: "tab", id: tabId, "aria-controls": panelId,
      "aria-selected": String(selected), tabindex: selected ? "0" : "-1", type: "button",
    }, entry.label, entry.count != null ? h("span", { class: "badge" }, String(entry.count)) : null);
    const panel = h("div", { role: "tabpanel", id: panelId, "aria-labelledby": tabId, tabindex: "0" }, entry.content);
    if (!selected) panel.setAttribute("hidden", "hidden");
    const activate = (focus) => {
      tabs.forEach((t, j) => {
        const on = j === i;
        t.tab.setAttribute("aria-selected", String(on));
        t.tab.tabIndex = on ? 0 : -1;
        if (on) t.panel.removeAttribute("hidden"); else t.panel.setAttribute("hidden", "hidden");
      });
      if (focus) tab.focus();
    };
    tab.addEventListener("click", () => activate(false));
    tabs.push({ tab, panel, activate });
    tablist.appendChild(tab);
    panels.appendChild(panel);
  });
  tablist.addEventListener("keydown", (ev) => {
    const cur = tabs.findIndex((t) => t.tab.getAttribute("aria-selected") === "true");
    let next = -1;
    if (ev.key === "ArrowRight" || ev.key === "ArrowDown") next = (cur + 1) % tabs.length;
    else if (ev.key === "ArrowLeft" || ev.key === "ArrowUp") next = (cur - 1 + tabs.length) % tabs.length;
    else if (ev.key === "Home") next = 0;
    else if (ev.key === "End") next = tabs.length - 1;
    if (next >= 0) { ev.preventDefault(); tabs[next].activate(true); }
  });
  wrap.appendChild(tablist);
  wrap.appendChild(panels);
  return wrap;
}

function buildNav(onSelect) {
  const list = document.getElementById("nav-list");
  const heading = document.getElementById("nav-heading");
  let buttons = [];

  // The keydown handler is attached once; it operates on the live `buttons`
  // array, which is rebuilt each time the active top tab changes.
  list.addEventListener("keydown", (ev) => {
    const idx = buttons.indexOf(document.activeElement);
    if (idx < 0) return;
    let next = -1;
    if (ev.key === "ArrowDown" || ev.key === "ArrowRight") next = (idx + 1) % buttons.length;
    else if (ev.key === "ArrowUp" || ev.key === "ArrowLeft") next = (idx - 1 + buttons.length) % buttons.length;
    else if (ev.key === "Home") next = 0;
    else if (ev.key === "End") next = buttons.length - 1;
    // Enter/Space activation is left to the native <button> to avoid double-firing.
    if (next >= 0) {
      ev.preventDefault();
      buttons.forEach((b, j) => (b.tabIndex = j === next ? 0 : -1));
      buttons[next].focus();
    }
  });

  return {
    render(entries, tabLabel) {
      list.innerHTML = "";
      buttons = [];
      if (heading) heading.textContent = tabLabel;
      let lastGroup = null;
      entries.forEach((entry) => {
        if (entry.group && entry.group !== lastGroup) {
          lastGroup = entry.group;
          list.appendChild(h("li", { class: "nav-group-h", role: "presentation" }, entry.group));
        }
        const btn = h(
          "button",
          { class: "nav-item" + (entry.group ? " nav-item-sub" : ""), type: "button", "data-key": entry.key, tabindex: "-1" },
          h("span", { class: "nav-dot", "aria-hidden": "true" }),
          h(
            "span",
            { class: "nav-label" },
            h("span", { class: "nav-name" }, entry.label),
            entry.sub ? h("span", { class: "nav-sub" }, entry.sub) : null
          )
        );
        btn.addEventListener("click", () => onSelect(entry.key));
        buttons.push(btn);
        list.appendChild(h("li", null, btn));
      });
      // Ensure exactly one roving tab stop exists.
      if (buttons.length) buttons[0].tabIndex = 0;
    },
    setActive(key) {
      let found = false;
      buttons.forEach((b) => {
        const on = b.getAttribute("data-key") === key;
        if (on) { b.setAttribute("aria-current", "page"); found = true; }
        else b.removeAttribute("aria-current");
        // Keep the roving tab stop on the selected item (mouse clicks included).
        b.tabIndex = on ? 0 : -1;
      });
      // If the active key isn't in this list, keep the first item focusable.
      if (!found && buttons.length) buttons[0].tabIndex = 0;
    },
  };
}

/* ---------------- Top-level tabs (Party / Loot) ---------------- */
function buildTopTabs(onActivate) {
  const host = document.getElementById("top-tabs");
  const defs = [
    { id: "party", label: "Party" },
    { id: "tadpole", label: "Tadpole" },
    { id: "loot", label: "Loot" },
  ];
  const tabs = [];
  defs.forEach((d) => {
    const tab = h(
      "button",
      {
        class: "toptab",
        role: "tab",
        type: "button",
        id: "toptab-" + d.id,
        "data-tab": d.id,
        "aria-selected": "false",
        "aria-controls": "main-content",
        tabindex: "-1",
      },
      d.label
    );
    tab.addEventListener("click", () => onActivate(d.id, true));
    tabs.push(tab);
    host.appendChild(tab);
  });

  host.addEventListener("keydown", (ev) => {
    const cur = tabs.findIndex((t) => t.getAttribute("aria-selected") === "true");
    let next = -1;
    if (ev.key === "ArrowRight" || ev.key === "ArrowDown") next = (cur + 1) % tabs.length;
    else if (ev.key === "ArrowLeft" || ev.key === "ArrowUp") next = (cur - 1 + tabs.length) % tabs.length;
    else if (ev.key === "Home") next = 0;
    else if (ev.key === "End") next = tabs.length - 1;
    if (next >= 0) {
      ev.preventDefault();
      onActivate(defs[next].id, true);
    }
  });

  return {
    setActive(id) {
      tabs.forEach((t) => {
        const on = t.getAttribute("data-tab") === id;
        t.setAttribute("aria-selected", String(on));
        t.tabIndex = on ? 0 : -1;
      });
      // Point the shared tabpanel back at the active tab so the
      // tab/tabpanel relationship is complete for screen readers.
      const panel = document.getElementById("main-content");
      if (panel) panel.setAttribute("aria-labelledby", "toptab-" + id);
    },
  };
}

/* ---------------- Boot ---------------- */
(async function init() {
  applyTheme(currentTheme());
  let data;
  try {
    data = await loadData();
  } catch (e) {
    const c = document.getElementById("main-content");
    if (c)
      c.innerHTML =
        '<div class="card"><h3>Can’t reach the guide server</h3>' +
        "<p>This page is served by the local <code>bg3</code> server. Start it with " +
        '<code>cargo run</code>, then open <a href="/">http://127.0.0.1:8787</a>.</p></div>';
    return;
  }
  await loadProgress();
  renderHeader(data.meta || {});

  // Keep the sticky-sidebar offset in sync with the real (wrapping) header height.
  const headerEl = document.querySelector("header.app");
  if (headerEl) {
    const syncHeaderH = () => {
      const hgt = Math.round(headerEl.getBoundingClientRect().height);
      if (hgt) document.documentElement.style.setProperty("--header-h", hgt + "px");
    };
    syncHeaderH();
    if (window.ResizeObserver) new ResizeObserver(syncHeaderH).observe(headerEl);
    else window.addEventListener("resize", syncHeaderH);
  }

  const content = document.getElementById("main-content");
  let nav, topTabs;
  let booted = false;
  let activeTab = "party";
  // Remember the last sub-view visited within each top tab.
  const lastKey = { party: "__overview__", tadpole: "__tad__", loot: null };

  function renderContent(key, focusContent) {
    content.innerHTML = "";
    if (key === "__overview__") content.appendChild(renderOverview(data.party || {}));
    else if (key === "__proficiencies__") content.appendChild(renderProficiencies(data.proficiencies || {}));
    else if (key === "__tad__") content.appendChild(renderTadpoleOverview(data.tadpole || {}));
    else if (key.indexOf("__tad__") === 0) content.appendChild(renderTadpoleCharacter(data.tadpole || {}, key.slice("__tad__".length)));
    else if (key.indexOf("__loot") === 0) {
      const act = parseInt(key.replace(/[^0-9]/g, ""), 10);
      content.appendChild(renderLoot((data.loot_guide || []).find((x) => x.act === act)));
    }
    else content.appendChild(renderCharacter(key, data.characters[key]));
    window.scrollTo({ top: 0 });
    // Move focus into the freshly rendered view so keyboard/screen-reader users
    // land on (and hear) the new content. Skipped on initial render and when the
    // caller will move focus elsewhere (e.g. onto the just-activated top tab).
    if (booted && focusContent) {
      const title = content.querySelector(".view-title") || content;
      title.setAttribute("tabindex", "-1");
      title.focus();
    }
    booted = true;
  }

  // Select a sub-nav item within the current top tab.
  function select(key, focusContent) {
    if (focusContent === undefined) focusContent = true;
    lastKey[activeTab] = key;
    renderContent(key, focusContent);
    nav.setActive(key);
  }

  // Activate a top tab: swap the sidebar sub-nav and show the remembered
  // (or default) sub-view for that tab.
  function activateTab(tab, focusTab) {
    activeTab = tab;
    topTabs.setActive(tab);
    const entries = navEntries(data, tab);
    nav.render(entries, tab === "loot" ? "Loot" : tab === "tadpole" ? "Tadpole" : "Party");
    let key = lastKey[tab];
    if (!key || !entries.some((e) => e.key === key)) key = entries.length ? entries[0].key : null;
    if (key) select(key, !focusTab);
    // For keyboard/click tab activation, keep focus on the tab itself.
    if (focusTab) {
      const el = document.getElementById("toptab-" + tab);
      if (el) el.focus();
    }
  }

  nav = buildNav(select);
  topTabs = buildTopTabs(activateTab);
  activateTab("party", false);
})();
</script>
