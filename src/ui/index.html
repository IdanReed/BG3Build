<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BG3 Party Plan</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%8E%B2%3C/text%3E%3C/svg%3E">
<script>
  /* Set theme before first paint to avoid a flash of the wrong theme. */
  (function () {
    try {
      var stored = null;
      try { stored = localStorage.getItem("bg3-theme"); } catch (e) {}
      var t = (stored === "light" || stored === "dark")
        ? stored
        : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
<style>
  :root {
    --bg: #f5f6fb;
    --surface: #ffffff;
    --surface-2: #eceef6;
    --surface-3: #e2e5f0;
    --text: #191b22;
    --text-muted: #565b6e;
    --border: #d5d9e6;
    --accent: #6a35e0;
    --accent-soft: #efe9ff;
    --accent-text: #ffffff;
    --good: #1f8a4c;
    --warn: #a04b00;
    --shadow: 0 1px 3px rgba(20,22,40,.08), 0 4px 16px rgba(20,22,40,.06);
    --radius: 12px;
    --header-h: 76px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1016;
      --surface: #171a22;
      --surface-2: #1e222d;
      --surface-3: #262b38;
      --text: #e8eaf1;
      --text-muted: #a5aaba;
      --border: #2c3242;
      --accent: #a488ff;
      --accent-soft: #241f3a;
      --accent-text: #14121f;
      --good: #57cd87;
      --warn: #f0a860;
      --shadow: 0 1px 3px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  html[data-theme="light"] {
    --bg: #f5f6fb; --surface: #ffffff; --surface-2: #eceef6; --surface-3: #e2e5f0;
    --text: #191b22; --text-muted: #565b6e; --border: #d5d9e6; --accent: #6a35e0;
    --accent-soft: #efe9ff; --accent-text: #ffffff; --good: #1f8a4c; --warn: #a04b00;
    --shadow: 0 1px 3px rgba(20,22,40,.08), 0 4px 16px rgba(20,22,40,.06);
  }
  html[data-theme="dark"] {
    --bg: #0e1016; --surface: #171a22; --surface-2: #1e222d; --surface-3: #262b38;
    --text: #e8eaf1; --text-muted: #a5aaba; --border: #2c3242; --accent: #a488ff;
    --accent-soft: #241f3a; --accent-text: #14121f; --good: #57cd87; --warn: #f0a860;
    --shadow: 0 1px 3px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); }
  a.wiki-item {
    color: inherit; text-decoration-color: color-mix(in srgb, var(--accent) 65%, transparent);
    text-decoration-thickness: 1px; text-underline-offset: 2px;
  }
  a.wiki-item:hover { color: var(--accent); text-decoration-color: currentColor; }
  a.wiki-item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
  a.wiki-item::after { content: "\2197"; margin-left: .22em; color: var(--accent); font-size: .72em; }
  .wiki-item-group { display: inline; }

  /* ---- Header ---- */
  header.app {
    position: sticky; top: 0; z-index: 30;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow);
  }
  .header-inner {
    max-width: 1800px; margin: 0 auto; padding: 14px 20px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .header-titles { flex: 1 1 340px; min-width: 0; }
  .header-titles h1 {
    margin: 0 0 8px; font-size: 1.25rem; line-height: 1.25; font-weight: 700;
    letter-spacing: -.01em;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface-2); color: var(--text-muted);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 3px 10px; font-size: .78rem; font-weight: 600;
    white-space: normal; overflow-wrap: anywhere; max-width: 100%;
  }
  .chip.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .chip .chip-k { color: var(--text-muted); font-weight: 500; opacity: .8; }
  .chips.glance { margin: 0 0 14px; }
  .chips.glance .chip { font-size: .82rem; }
  a.chip { text-decoration: none; color: var(--text-muted); }
  a.chip:hover { border-color: var(--accent); color: var(--accent); }
  a.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a.chip .chip-doc-icon { opacity: .7; }
  details.assumptions { flex-basis: 100%; margin-top: 4px; }
  details.assumptions summary {
    cursor: pointer; font-size: .8rem; color: var(--accent); font-weight: 600;
    list-style: none; display: inline-block; padding: 2px 0;
  }
  details.assumptions summary::-webkit-details-marker { display: none; }
  details.assumptions summary::before { content: "\25B8  "; }
  details.assumptions[open] summary::before { content: "\25BE  "; }
  details.assumptions .assume-body { font-size: .85rem; color: var(--text-muted); margin-top: 6px; }
  details.assumptions .assume-body p { margin: 6px 0; }
  details.assumptions summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  [role="tabpanel"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

  .theme-toggle {
    flex: 0 0 auto;
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 8px 14px; font-size: .82rem; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- Top-level section tabs ---- */
  .toptabs-bar { max-width: 1800px; margin: 0 auto; padding: 0 20px; }
  .toptabs { display: flex; gap: 4px; }
  .toptab {
    background: var(--surface-2); border: none; border-bottom: 2px solid transparent;
    padding: 10px 18px; font: inherit; font-size: .95rem; font-weight: 700; cursor: pointer;
    color: var(--text-muted); margin-bottom: -1px; border-radius: 8px 8px 0 0;
    letter-spacing: -.01em;
  }
  .toptab:hover { color: var(--text); background: var(--surface-3); }
  .toptab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); background: var(--surface); }
  .toptab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* ---- Sidebar sub-group heading ---- */
  .nav-group-h {
    font-size: .7rem; text-transform: uppercase; letter-spacing: .08em;
    color: var(--text-muted); margin: 12px 10px 4px; font-weight: 700;
    display: flex; align-items: center; gap: 8px;
  }
  .nav-group-h::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  /* Grafted from candidate B: indent the grouped Characters so Overview +
     Proficiencies read as the parent/top of the Party area. */
  .nav-item.nav-item-sub { padding-left: 20px; }

  /* ---- Layout ---- */
  .layout {
    max-width: 1800px; margin: 0 auto; padding: 20px;
    display: grid; grid-template-columns: 250px 1fr; gap: 20px; align-items: start;
  }
  .sidebar {
    position: sticky; top: calc(var(--header-h, 76px) + 8px);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 8px; box-shadow: var(--shadow);
  }
  .sidebar h2 {
    font-size: .7rem; text-transform: uppercase; letter-spacing: .08em;
    color: var(--text-muted); margin: 8px 10px; font-weight: 700;
  }
  .nav-list { list-style: none; margin: 0 0 6px; padding: 0; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    background: none; border: none; text-align: left; cursor: pointer;
    color: var(--text); font: inherit; font-size: .92rem; font-weight: 500;
    padding: 9px 12px; border-radius: 8px; margin-bottom: 2px;
  }
  .nav-item:hover { background: var(--surface-2); }
  .nav-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .nav-item[aria-current="page"] {
    background: var(--accent-soft); color: var(--accent); font-weight: 700;
  }
  .nav-item .nav-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--border); flex: 0 0 auto;
  }
  .nav-item[aria-current="page"] .nav-dot { background: var(--accent); }
  .nav-item .nav-sub { display: block; font-size: .72rem; color: var(--text-muted); font-weight: 500; }
  .nav-item[aria-current="page"] .nav-sub { color: var(--accent); opacity: .85; }
  .nav-item .nav-label { display: flex; flex-direction: column; min-width: 0; }
  .nav-item .nav-label .nav-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  main.content { min-width: 0; }

  /* ---- In-page outline ---- */
  .page-outline {
    position: sticky; top: calc(var(--header-h, 76px) + 8px); z-index: 20;
    display: flex; align-items: center; gap: 10px; min-width: 0;
    margin: 0 0 18px; padding: 8px 10px;
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    border: 1px solid var(--border); border-radius: 11px; box-shadow: var(--shadow);
    backdrop-filter: blur(10px);
  }
  .page-outline-label {
    flex: 0 0 auto; padding: 0 4px; color: var(--text-muted);
    font-size: .66rem; font-weight: 800; text-transform: uppercase; letter-spacing: .07em;
  }
  .page-outline-links {
    display: flex; gap: 4px; min-width: 0; overflow-x: auto;
    scrollbar-width: thin; overscroll-behavior-inline: contain;
  }
  .page-outline-link {
    flex: 0 0 auto; padding: 5px 9px; border: 1px solid transparent;
    border-radius: 7px; color: var(--text-muted); font-size: .76rem;
    font-weight: 650; line-height: 1.25; text-decoration: none; white-space: nowrap;
    transition: color .12s ease, background-color .12s ease, border-color .12s ease;
  }
  .page-outline-link:hover { color: var(--text); background: var(--surface-2); }
  .page-outline-link:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
  .page-outline-link[aria-current="location"] {
    color: var(--accent); background: var(--accent-soft);
    border-color: color-mix(in srgb, var(--accent) 28%, var(--border));
  }
  .page-section { scroll-margin-top: calc(var(--header-h, 76px) + 64px); }

  /* ---- Cards / sections ---- */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 18px 20px; margin-bottom: 18px;
  }
  .view-title { margin: 0 0 4px; font-size: 1.5rem; font-weight: 700; letter-spacing: -.01em; }
  .view-title:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 3px; }
  .view-sub { color: var(--text-muted); margin: 0 0 4px; font-size: .95rem; }

  .section-title {
    font-size: .74rem; text-transform: uppercase; letter-spacing: .08em;
    color: var(--accent); font-weight: 700; margin: 0 0 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  .prose { margin: 0; color: var(--text); }
  .muted { color: var(--text-muted); }

  /* ---- Tables ---- */
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 10px; border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; font-size: .88rem; min-width: 420px; }
  thead th {
    background: var(--surface-2); text-align: left; padding: 9px 12px;
    font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em;
    color: var(--text-muted); white-space: nowrap; border-bottom: 1px solid var(--border);
  }
  tbody td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--surface-2) 45%, transparent); }
  td .cell-strong { font-weight: 600; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ---- Leveling guide ---- */
  .level-table { min-width: 900px; }
  .level-table thead th { position: sticky; top: 0; z-index: 2; }
  .level-table tbody tr { transition: background-color .14s ease; }
  .level-table tbody tr:hover td {
    background: color-mix(in srgb, var(--accent-soft) 40%, var(--surface));
  }
  .level-number {
    display: inline-grid; place-items: center; width: 28px; height: 28px;
    border-radius: 999px; background: var(--accent); color: var(--accent-text);
    font-size: .76rem; line-height: 1; font-weight: 800;
  }
  .level-gain-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
  .level-gain-list li { position: relative; margin: 0; padding-left: 14px; line-height: 1.35; }
  .level-gain-list li::before {
    content: ""; position: absolute; left: 1px; top: .52em; width: 5px; height: 5px;
    border-radius: 50%; background: var(--text-muted);
  }
  .level-class {
    display: flex; align-items: center; gap: 7px; min-width: 118px;
  }
  .level-choice-list {
    display: grid; gap: 6px; min-width: 300px;
  }
  .level-choice {
    position: relative; display: grid;
    grid-template-columns: minmax(112px, 134px) minmax(0, 1fr) 24px;
    min-height: 38px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); transition: border-color .14s ease, box-shadow .14s ease;
  }
  .level-choice:hover, .level-choice:focus-visible, .level-choice:focus-within {
    border-color: color-mix(in srgb, var(--accent) 55%, var(--border));
    box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 12%, transparent);
  }
  .level-choice:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .level-choice:not(.has-detail) {
    grid-template-columns: minmax(112px, 134px) minmax(0, 1fr);
  }
  .level-choice-category {
    display: flex; align-items: center; gap: 6px;
    border-radius: 7px 0 0 7px;
    padding: 6px 8px; background: var(--surface-2); color: var(--accent);
    font-size: .66rem; line-height: 1.3; font-weight: 700;
    text-transform: uppercase; letter-spacing: .05em;
  }
  .level-choice-body { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; min-width: 0; padding: 5px 8px; }
  .level-choice-recommendation { font-weight: 600; overflow-wrap: anywhere; }
  /* A level's picks and its free class grants read differently, so they are
     badged differently: the pick badge counts the selections the level opens,
     including any the guide has not filled yet; the grant badge marks what the
     class or subclass hands over for free. */
  .pick-badge {
    display: inline-flex; align-items: center; gap: 4px; flex: 0 0 auto;
    padding: 1px 7px; border-radius: 999px; white-space: nowrap;
    border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--border));
    background: var(--accent-soft); color: var(--accent);
    font-size: .62rem; line-height: 1.5; font-weight: 800;
    text-transform: uppercase; letter-spacing: .04em;
  }
  .pick-badge.is-grant {
    border-color: color-mix(in srgb, var(--good) 45%, var(--border));
    background: color-mix(in srgb, var(--good) 15%, var(--surface));
    color: color-mix(in srgb, var(--good) 78%, var(--text));
  }
  .open-pick {
    display: inline-flex; align-items: center; padding: 1px 7px; border-radius: 999px;
    border: 1px dashed color-mix(in srgb, var(--accent) 50%, var(--border));
    color: var(--text-muted); font-size: .7rem; font-weight: 700; white-space: nowrap;
  }
  .level-choice.is-grant { background: color-mix(in srgb, var(--good) 8%, var(--surface)); }
  .level-choice.is-grant .level-choice-category { color: color-mix(in srgb, var(--good) 78%, var(--text)); }
  .level-legend {
    display: flex; align-items: center; flex-wrap: wrap; gap: 7px 14px;
    margin: -4px 0 13px; color: var(--text-muted); font-size: .78rem;
  }
  .level-legend-item { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
  .detail-cue {
    align-self: center; display: inline-grid; place-items: center; width: 18px; height: 18px;
    border: 1px solid var(--border); border-radius: 999px; color: var(--accent);
    background: var(--accent-soft); font-size: .68rem; line-height: 1; font-weight: 800;
  }
  .level-choice > .detail-cue { margin-right: 6px; }
  .section-hint {
    margin: -3px 0 12px; color: var(--text-muted); font-size: .8rem; line-height: 1.4;
  }

  /* ---- Definition grid ---- */
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 20px; margin: 0; }
  .fact { min-width: 0; }
  .fact dt { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); font-weight: 700; margin-bottom: 2px; }
  .fact dd { margin: 0; font-size: .92rem; }
  .fact dd .note { display: block; font-size: .8rem; color: var(--text-muted); margin-top: 2px; }

  /* ---- Stat block ---- */
  .statblock { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .stat {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 4px; text-align: center;
  }
  .stat .stat-k { font-size: .66rem; font-weight: 700; letter-spacing: .05em; color: var(--text-muted); }
  .stat .stat-v { font-size: 1.35rem; font-weight: 700; line-height: 1.1; }
  @media (max-width: 560px) { .statblock { grid-template-columns: repeat(3, 1fr); } }

  /* ---- Lists ---- */
  ul.clean { list-style: none; margin: 0; padding: 0; }
  ul.clean li { position: relative; padding: 5px 0 5px 20px; font-size: .9rem; border-bottom: 1px solid var(--border); }
  ul.clean li:last-child { border-bottom: none; }
  ul.clean li::before { content: ""; position: absolute; left: 4px; top: 13px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  ul.clean li .li-strong { font-weight: 600; }
  ul.clean li .li-meta { color: var(--text-muted); font-size: .82rem; }

  .tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 4px 10px; font-size: .84rem; font-weight: 500;
  }

  /* ---- Itemization guide ---- */
  .itemization-tabs > .tabs { margin-bottom: 14px; }
  .itemization-note { margin: -2px 0 12px; font-size: .8rem; }
  .item-slot-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px; align-items: start;
  }
  /* Three side-by-side columns; each column stacks its slot cards vertically. */
  .item-rows {
    display: grid; gap: 18px;
    grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start;
  }
  .item-row .item-slot-grid { grid-template-columns: minmax(0, 1fr); }
  .item-row-label {
    display: flex; align-items: center; gap: 10px; margin: 0 0 9px;
    color: var(--text-muted); font-size: .68rem; font-weight: 800;
    text-transform: uppercase; letter-spacing: .08em;
  }
  .item-row-label::after {
    content: ""; flex: 1; height: 1px; background: var(--border);
  }
  .item-slot {
    min-width: 0; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px;
    transition: border-color .14s ease, box-shadow .14s ease;
  }
  /* An item name row plus its badges. */
  /* Six abilities is a known, fixed count, so pin the columns instead of letting
     auto-fit drop the last card onto a row of its own. */
  .ability-grid {
    display: grid; grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 10px; align-items: start;
  }
  @media (max-width: 1180px) { .ability-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 620px) { .ability-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .ability-card {
    min-width: 0; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 11px;
  }
  .ability-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 8px; margin-bottom: 5px;
  }
  .ability-k {
    font-size: .68rem; font-weight: 800; letter-spacing: .09em;
    text-transform: uppercase; color: var(--text-muted);
  }
  .ability-final { font-size: .95rem; font-weight: 800; color: var(--accent); }
  ul.ability-steps { list-style: none; padding-left: 0; margin: 0; }
  .ability-step {
    display: flex; align-items: baseline; gap: 6px;
    font-variant-numeric: tabular-nums; font-size: .8rem;
    color: var(--text-muted); margin: 2px 0;
  }
  .ability-step.ability-latest { color: var(--text); font-weight: 700; }
  .ability-mod { min-width: 2.1em; text-align: right; font-weight: 700; }
  .ability-arrow { opacity: .55; }
  .ability-score { min-width: 1.6em; }
  .ability-src { font-size: .72rem; opacity: .85; }

<a class="skip-link" href="#main-content">Skip to content</a>
<header class="app">
  <div class="header-inner" id="app-header"></div>

    <div class="toptabs" role="tablist" aria-label="Guide sections" id="top-tabs"></div>
  </div>

  <nav class="sidebar" aria-label="Section sub-navigation">
    <h2 id="nav-heading">Party</h2>
    <ul class="nav-list" id="nav-list" role="list" aria-labelledby="nav-heading"></ul>
  </nav>

<script>
"use strict";

/* ---------------- Data loading ---------------- */
async function loadData() {
  // Served by the local bg3 server, which assembles the plan from content/*.md.
  const res = await fetch("/api/plan", { cache: "no-store" });
  if (!res.ok) throw new Error("GET /api/plan failed: " + res.status);
  return await res.json();
}

/* ---------------- DOM helper ---------------- */
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      const v = attrs[k];
      if (v == null) continue;
      if (k === "class") e.className = v;
      else if (k === "html") e.innerHTML = v;
      else if (k.slice(0, 2) === "on" && typeof v === "function") e.addEventListener(k.slice(2).toLowerCase(), v);
      else e.setAttribute(k, v);
    }
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    e.appendChild(typeof kid === "object" ? kid : document.createTextNode(String(kid)));
  }
  return e;
}

const arr = (v) => (Array.isArray(v) ? v : v == null ? [] : [v]);
const has = (v) => v != null && !(Array.isArray(v) && v.length === 0) && !(typeof v === "string" && v.trim() === "");
const humanize = (s) => String(s).replace(/_/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
const slug = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");

/* ---------------- Linked items (character page ↔ Loot tab) ----------------
   The same piece of gear is listed twice: once on its owner's Itemization tab
   and once in the Loot tab's area table. Both tick boxes mean the same thing —
   "this is in the party's hands" — so they share one state.

   Checkoff keys stay exactly as they were (progress.json needs no migration):
   instead, every key that names the same item joins a link group, and toggling
   any member writes all of them. Items are matched by name, normalised to shrug
   off the guide's annotations: "Corellon's Grace (levels 2–4 only)" on the
   character page and "Corellon's Grace" in the loot table are one item, as are
   "Hellrider Longbow" / "Hellrider's Longbow" and the first entry of a combined
   loot row like "Caustic Band + Club of Hill Giant Strength". A group is only
   linked if it bridges the two views; a name that appears on one side alone
   keeps its own independent state. */
const ITEM_NAME_SPLIT = /\s\+\s|[\/;,:]|[—–]|→|->|\s-\s|\bor\b|\bthen\b/;
function canonicalItem(label) {
  let s = String(label == null ? "" : label).toLowerCase().replace(/’/g, "'");
  s = s.replace(/\([^)]*\)/g, " ");                                  // "(daily)", "(held over)"
  s = s.split(ITEM_NAME_SPLIT)[0];                                   // combined rows → first item
  s = s.replace(/'s\b/g, "").trim();                                 // "Crusher's Ring" ≡ "Crusher Ring"
  s = s.replace(/^(?:the|a|an)\s+/, "");                             // "The Spellsparkler" ≡ "Spellsparkler"
  s = s.replace(/^(elixirs|arrows|potions|scrolls)\b/, (w) => w.slice(0, -1));
  return s.replace(/[^a-z0-9+]+/g, "-").replace(/^-+|-+$/g, "");
}

/* Key shapes, shared by the renderers and the link builder so the two can't drift. */
function buildKeyRoot(charName, build) {
  return slug(charName || "char") + "/" + slug((build && build.name) || "build");
}
function itemLabel(entry) {
  const isObj = entry && typeof entry === "object";
  return isObj ? entry.item || entry.note || "" : String(entry);
}
function itemEntryId(entry, i) {
  if (entry && typeof entry === "object" && entry.id) return entry.id;
  return slug(itemLabel(entry)).slice(0, 60) || "i" + i;
}
function charItemKey(keyRoot, act, entry, i) {
  return keyRoot ? "item:" + keyRoot + "/" + act + "/" + itemEntryId(entry, i) : null;
}
function lootAreaKey(act, areaName) {
  return "loot:" + act + "/" + slug(areaName);
}
function lootItemKey(areaKey, itemName) {
  return areaKey ? areaKey + "/" + slug(itemName) : null;
}

let ITEM_LINK_OF = Object.create(null);     // checkoff key → canonical item name
let ITEM_LINK_GROUPS = Object.create(null); // canonical item name → [{ key, where, kind }]

function buildItemLinks(data) {
  ITEM_LINK_OF = Object.create(null);
  ITEM_LINK_GROUPS = Object.create(null);
  const add = (canon, key, where, kind) => {
    if (!canon || !key) return;
    const group = ITEM_LINK_GROUPS[canon] || (ITEM_LINK_GROUPS[canon] = []);
    if (group.some((m) => m.key === key)) return;
    group.push({ key: key, where: where, kind: kind });
  };

  const characters = (data && data.characters) || {};
  Object.keys(characters).forEach((name) => {
    arr(characters[name]).forEach((build) => {
      const keyRoot = buildKeyRoot(name, build);
      const it = build.itemization || {};
      Object.keys(it).forEach((act) => {
        arr(it[act]).forEach((entry, i) => {
          add(canonicalItem(itemLabel(entry)), charItemKey(keyRoot, act, entry, i), name, "char");
        });
      });
    });
  });

  arr(data && data.loot_guide).forEach((a) => {
    arr(a.areas).forEach((area) => {
      const areaKey = lootAreaKey(a.act, area.area);
      arr(area.items).forEach((item) => {
        add(canonicalItem(item.name), lootItemKey(areaKey, item.name), "Loot — Act " + a.act, "loot");
      });
    });
  });

  Object.keys(ITEM_LINK_GROUPS).forEach((canon) => {
    const group = ITEM_LINK_GROUPS[canon];
    const bridges = group.some((m) => m.kind === "char") && group.some((m) => m.kind === "loot");
    if (!bridges) { delete ITEM_LINK_GROUPS[canon]; return; }
    group.forEach((m) => { ITEM_LINK_OF[m.key] = canon; });
  });
}

/* Every key that moves together with `key` — itself when it isn't linked. */
function linkedKeys(key) {
  const canon = ITEM_LINK_OF[key];
  const group = canon ? ITEM_LINK_GROUPS[canon] : null;
  return group ? group.map((m) => m.key) : [key];
}
/* Where else this checkoff shows up, for the tick box's tooltip. */
function linkedPlaces(key) {
  const canon = ITEM_LINK_OF[key];
  const group = canon ? ITEM_LINK_GROUPS[canon] : null;
  if (!group) return [];
  const places = [];
  group.forEach((m) => {
    if (m.key === key) return;
    if (places.indexOf(m.where) < 0) places.push(m.where);
  });
  return places;
}

/* ---------------- Checkoff state (server-persisted) ----------------
   PROGRESS is a flat { key: true } map mirrored from the server's
   progress.json. Renderers read isChecked(key) at build time (the DOM is
   rebuilt on every nav switch, so state lives here, not in the DOM). Toggling
   updates the map and POSTs; if there's no server (file://) it stays in-memory. */
let PROGRESS = {};
async function loadProgress() {
  try {
    const res = await fetch("/api/progress", { cache: "no-store" });
    if (!res.ok) throw new Error("bad status " + res.status);
    const data = await res.json();
    PROGRESS = (data && data.checked) || {};
  } catch (e) {
    PROGRESS = {}; // no server → checkoffs are session-only
  }
}
function isChecked(key) { return !!PROGRESS[key]; }
/* One key, one request — the server's POST body carries a single key. */
async function postProgress(key, checked) {
  try {
    const res = await fetch("/api/progress", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key: key, checked: checked }),
    });
    if (!res.ok) throw new Error("bad status " + res.status);
    return true;
  } catch (e) {
    return false;
  }
}
/* Toggling a linked item writes every key in its group, so the character page
   and the Loot tab never disagree. Writes are applied optimistically and each
   one is rolled back on its own if the server rejects it, so PROGRESS stays in
   step with what the server actually accepted even on a partial failure. */
async function setChecked(key, checked) {
  const keys = linkedKeys(key);
  const previous = keys.map((k) => !!PROGRESS[k]);
  keys.forEach((k) => { if (checked) PROGRESS[k] = true; else delete PROGRESS[k]; });
  syncCheckboxNodes(keys);
  const results = await Promise.all(keys.map((k) => postProgress(k, checked)));
  const failed = results.some((ok) => !ok);
  if (failed) {
    keys.forEach((k, i) => {
      if (results[i]) return;
      if (previous[i]) PROGRESS[k] = true;
      else delete PROGRESS[k];
    });
    syncCheckboxNodes(keys);
  }
  return !failed;
}

/* progress.json predates linking, so a group can arrive with some keys ticked
   and some not — an item collected before the two views shared a state. Fill the
   rest of the group in so both views agree from the first paint. This is done in
   memory only and never written back: a boot has no business rewriting the
   playthrough file, and the next real toggle of that item persists the whole
   group anyway. Only ever adds, so nothing already recorded is lost. */
function reconcileLinkedProgress() {
  let added = 0;
  Object.keys(ITEM_LINK_GROUPS).forEach((canon) => {
    const keys = ITEM_LINK_GROUPS[canon].map((m) => m.key);
    if (!keys.some(isChecked)) return;
    keys.forEach((k) => {
      if (isChecked(k)) return;
      PROGRESS[k] = true;
      added++;
    });
  });
  return added;
}

/* Live tick boxes, so linked items update in place instead of waiting for the
   next rebuild. Nodes are dropped once their view is torn out of the document. */
const CHECKBOX_NODES = new Map();
function registerCheckbox(key, node) {
  let nodes = CHECKBOX_NODES.get(key);
  if (!nodes) { nodes = new Set(); CHECKBOX_NODES.set(key, nodes); }
  nodes.add(node);
}
function syncCheckboxNodes(keys) {
  keys.forEach((k) => {
    const nodes = CHECKBOX_NODES.get(k);
    if (!nodes) return;
    nodes.forEach((node) => {
      if (node.isConnected) node.checked = isChecked(k);
      else nodes.delete(node);
    });
    if (!nodes.size) CHECKBOX_NODES.delete(k);
  });
}

/* A checkbox bound to a checkoff key. */
function checkbox(key, label) {
  const places = linkedPlaces(key);
  const cb = h("input", {
    type: "checkbox",
    class: "ck",
    "aria-label": label || "Mark item complete",
    title: places.length ? "Shared checkoff — also ticks " + places.join(", ") : null,
  });
  cb.checked = isChecked(key);
  cb.addEventListener("change", async () => {
    const ok = await setChecked(key, cb.checked);
    if (!ok) cb.checked = isChecked(key);
  });
  registerCheckbox(key, cb);
  return cb;
}

/* ---------------- Per-view UI state (scroll offset + open tabs) ----------------
   Switching sub-views rebuilds the whole page, which would otherwise dump you
   back at the top of a long character page every time. Each view key remembers
   how far it was scrolled and which tab was open inside each of its tab groups,
   so coming back to a character lands on the section you left. Held in
   sessionStorage — it survives a reload of the same browser tab and is gone on
   a fresh one; any storage failure quietly degrades to in-memory only. */
const VIEW_STATE_STORE = "bg3-view-state-v1";
const VIEW_STATE = { scroll: {}, tabs: {} };
(function loadViewState() {
  try {
    const raw = window.sessionStorage.getItem(VIEW_STATE_STORE);
    const saved = raw ? JSON.parse(raw) : null;
    if (saved && typeof saved === "object") {
      if (saved.scroll && typeof saved.scroll === "object") VIEW_STATE.scroll = saved.scroll;
      if (saved.tabs && typeof saved.tabs === "object") VIEW_STATE.tabs = saved.tabs;
    }
  } catch (e) { /* private mode, file://, corrupt value — start empty */ }
})();
let viewStateWrite = null;
function saveViewState() {
  if (viewStateWrite) return;
  viewStateWrite = setTimeout(() => {
    viewStateWrite = null;
    try { window.sessionStorage.setItem(VIEW_STATE_STORE, JSON.stringify(VIEW_STATE)); } catch (e) { /* ignore */ }
  }, 300);
}

/* The view currently on screen, or null while one is being swapped in — the
   scroll churn of a rebuild must not overwrite a remembered offset. */
let CURRENT_VIEW = null;
function viewScrollTop(key) {
  const y = VIEW_STATE.scroll[key];
  return typeof y === "number" && y > 0 ? y : 0;
}
let scrollFrame = false;
window.addEventListener("scroll", () => {
  if (scrollFrame || !CURRENT_VIEW) return;
  scrollFrame = true;
  window.requestAnimationFrame(() => {
    scrollFrame = false;
    if (!CURRENT_VIEW) return;
    VIEW_STATE.scroll[CURRENT_VIEW] = Math.round(window.scrollY || window.pageYOffset || 0);
    saveViewState();
  });
}, { passive: true });

/* Tab groups restore by index. idBase is stable per view (it is derived from the
   character/build or the loot act and area), so the stored index outlives the
   rebuild that discards the DOM. */
function rememberedTab(idBase, count) {
  const i = VIEW_STATE.tabs[idBase];
  return typeof i === "number" && i >= 0 && i < count ? i : 0;
}
function rememberTab(idBase, index) {
  VIEW_STATE.tabs[idBase] = index;
  saveViewState();
}

/* Reusable components */
function section(title, ...content) {
  return h("section", { class: "card" }, h("h3", { class: "section-title" }, title), ...content);
}
function tableWrap(node) {
  return h("div", { class: "table-wrap" }, node);
}
function bulletList(items) {
  return h(
    "ul",
    { class: "clean" },
    items.map((it) => (typeof it === "string" ? h("li", null, it) : it))
  );
}

/* ---------------- Lightweight prose formatter ----------------
   Renders a small, safe Markdown subset from the content files into DOM nodes
   (content is never fed to innerHTML, so there's nothing to escape):
     • blank line       → new paragraph
     • lines "- "/"* "  → bullet list
     • **bold**         → <strong>
     • "Label: rest"    → bold lead-in on a bullet (auto, ≤18 chars)
   Used for the long prose fields so they scan at a glance. */
function inlineBold(text, target) {
  String(text).split(/\*\*(.+?)\*\*/g).forEach((part, i) => {
    if (part === "") return;
    if (i % 2 === 1) target.appendChild(h("strong", null, part));
    else target.appendChild(document.createTextNode(part));
  });
}
function bulletItem(text) {
  const li = h("li", null);
  const m = text.match(/^([^:*]{1,18}):\s+([\s\S]+)$/);
  if (m) {
    li.appendChild(h("strong", null, m[1]));
    li.appendChild(document.createTextNode(": "));
    inlineBold(m[2], li);
  } else {
    inlineBold(text, li);
  }
  return li;
}
function richText(str, pClass) {
  const frag = document.createDocumentFragment();
  const lines = String(str).replace(/\r\n/g, "\n").split("\n");
  let para = [];
  let list = null;
  const flushPara = () => {
    if (!para.length) return;
    const p = h("p", { class: "prose" + (pClass ? " " + pClass : "") });
    inlineBold(para.join(" "), p);
    frag.appendChild(p);
    para = [];
  };
  const flushList = () => {
    if (list) { frag.appendChild(list); list = null; }
  };
  lines.forEach((raw) => {
    const line = raw.trim();
    if (!line) { flushPara(); flushList(); return; }
    if (/^[-*]\s+/.test(line)) {
      flushPara();
      if (!list) list = h("ul", { class: "prose-list" });
      list.appendChild(bulletItem(line.replace(/^[-*]\s+/, "")));
    } else {
      flushList();
      para.push(line);
    }
  });
  flushPara();
  flushList();
  return frag;
}

/* ---------------- Field renderers ---------------- */
const STAT_ORDER = ["STR", "DEX", "CON", "INT", "WIS", "CHA"];

/* An ability's growth as a chain. Each row reads "modifier <- score (what moved it)",
   base at the top and the final value at the bottom, so the number you actually play
   with is the last thing you read. */
function abilityMod(score) {
  return Math.floor((Number(score) - 10) / 2);
}
function signedMod(n) {
  return (n >= 0 ? "+" : "\u2212") + Math.abs(n);
}
function renderAbilityChains(chains) {
  return h(
    "div",
    { class: "ability-grid" },
    arr(chains).map((ch) => {
      const steps = arr(ch.steps);
      const last = steps.length ? steps[steps.length - 1] : null;
      return h(
        "section",
        { class: "ability-card" },
        h("div", { class: "ability-head" },
          h("span", { class: "ability-k" }, ch.ability),
          last ? h("span", { class: "ability-final" }, signedMod(abilityMod(last.score))) : null
        ),
        h("ul", { class: "clean ability-steps" }, steps.map((st, i) =>
          h("li", { class: "ability-step" + (i === steps.length - 1 && steps.length > 1 ? " ability-latest" : "") },
            h("span", { class: "ability-mod" }, signedMod(abilityMod(st.score))),
            h("span", { class: "ability-arrow", "aria-hidden": "true" }, "\u2190"),
            h("span", { class: "ability-score" }, String(st.score)),
            has(st.source) ? h("span", { class: "ability-src" }, "(" + st.source + ")") : null
          )
        ))
      );
    })
  );
}

function renderStatblock(stats) {
  return h(
    "div",
    { class: "statblock" },
    STAT_ORDER.map((k) => {
      const v = stats[k];
      let valNode;
      if (v && typeof v === "object") {
        // Item-fixed score: base struck through, final value with the source on hover.
        valNode = h("div", { class: "stat-v" },
          h("span", { class: "stat-base" }, String(v.base != null ? v.base : "")),
          h("span", { class: "stat-final has-hover", title: v.via || null }, String(v.final != null ? v.final : "")));
      } else {
        valNode = h("div", { class: "stat-v" }, v != null ? v : "—");
      }
      return h("div", { class: "stat" }, h("div", { class: "stat-k" }, k), valNode);
    })
  );
}

function renderFeats(feats) {
  return bulletList(
    feats.map((f) =>
      h(
        "li",
        null,
        h("span", { class: "li-strong" }, f.feat),
        f.at ? h("span", { class: "li-meta" }, "  —  " + f.at) : null,

function renderTags(items) {

function cardIcon(symbol) {

}

function cardHeading(label, symbol, count) {

function levelCategoryIcon(category) {
  const value = String(category).toLowerCase();
  if (value.includes("cantrip")) return "✧";
  if (value.includes("feat")) return "★";
  if (value.includes("spell") || value.includes("magical secrets")) return "✦";
  if (value.includes("subclass") || value.includes("patron") || value.includes("pact")) return "◆";
  if (value.includes("metamagic")) return "↻";
  if (value.includes("expertise")) return "◎";
  if (value.includes("invocation")) return "◇";
  if (value.includes("fighting style")) return "⚔";
  if (value.includes("multiclass")) return "⇄";
  return "•";
}

function classIcon(className) {
  const value = String(className).toLowerCase();
  if (value.includes("bard")) return "♫";
  if (value.includes("cleric")) return "✚";
  if (value.includes("fighter")) return "⚔";
  if (value.includes("monk")) return "✊";
  if (value.includes("paladin")) return "🛡";
  if (value.includes("rogue")) return "🗡";
  if (value.includes("sorcerer")) return "✦";
  if (value.includes("warlock")) return "◉";
  if (value.includes("wizard")) return "⌁";
  return "◆";
}

function renderClass(className) {
  return h("span", { class: "level-class" },
    cardIcon(classIcon(className)),
    h("span", null, className)
  );
}

function renderLevelGains(gains) {
  const entries = arr(gains).filter(has);
  if (!entries.length) return h("span", { class: "muted" }, "—");
  return h("ul", { class: "level-gain-list" },
    entries.map((gain) => h("li", null, gain))
  );
}

/* `granted: true` marks an entry the class, subclass or race supplies for free
   -- it spends no pick and no prepared slot. `picks: N` is how many selections
   the level opens for that category; when the guide names fewer than N, the
   remainder render as explicit "open pick" placeholders so an unspent choice is
   never invisible. `optional: true` is the level-up replacement swap. */
function pickBadge(rec, namedCount) {
  const granted = rec.granted === true || /^(granted|grant|class|free|fixed)$/i.test(String(rec.source || ""));
  if (granted) {
    const fixed = /^fixed$/i.test(String(rec.source || "")) || rec.fixed === true;
    return {
      granted: true,
      open: 0,
      node: h("span", {
        class: "pick-badge is-grant",
        title: fixed
          ? "Fixed by the class, subclass or race — not a selection you make"
          : "Granted by the class, subclass or race — costs no pick and no prepared slot",
      }, h("span", { "aria-hidden": "true" }, "✦"), fixed ? "Fixed" : "Free · no pick"),
    };
  }
  const raw = Number(rec.picks);
  if (!has(rec.picks) || !isFinite(raw) || raw <= 0) return { granted: false, open: 0, node: null };
  const picks = Math.trunc(raw);
  const open = Math.max(0, picks - namedCount);
  const parts = [picks === 1 ? "1 pick" : picks + " picks"];
  if (rec.optional === true) parts.push("optional");
  if (namedCount > picks) parts.push(namedCount + " listed");
  else if (open) parts.push(open + " open");
  return {
    granted: false,
    open,
    node: h("span", {
      class: "pick-badge",
      title: picks === 1
        ? "This level grants one selection in this category"
        : "This level grants " + picks + " selections in this category",
    }, parts.join(" · ")),
  };
}

function renderLevelRecommendation(rec) {
  const category = String(rec.category || "Choice");
  const values = arr(rec.recommendation).filter(has).map(String);
  /* `wiki: false` opts a row out of linking, same as an itemization entry --
     a row whose recommendation is prose rather than a spell name would
     otherwise auto-link to a page that does not exist. */
  const noWiki = rec.wiki === false;
  const wikiTitles = noWiki ? [] : arr(rec.wiki).filter(has).map(String);
  const spellRecommendations = !noWiki && /spell|cantrip|magical secrets/i.test(category);
  const recommendation = [];
  values.forEach((value, index) => {
    if (index) recommendation.push(" · ");
    const wikiTitle = wikiTitles[index] || (wikiTitles.length === 1 ? wikiTitles[0] : value);
    recommendation.push(
      wikiTitles.length
        ? wikiPageLink(wikiTitle, null, value)
        : spellRecommendations
          ? wikiSpellNode(value)
          : value
    );
  });
  const badge = pickBadge(rec, values.length);
  for (let i = 0; i < badge.open; i++) {
    /* One separator between the named picks and the placeholders, then plain
       spaces -- a chain of dot-separated chips reads as a wrapped orphan. */
    if (recommendation.length) recommendation.push(i === 0 ? " · " : " ");
    recommendation.push(h("span", {
      class: "open-pick",
      title: "A selection this level grants that the guide has not assigned — pick it in play",
    }, "open pick"));
  }
  const hasNote = has(rec.note);
  const tipId = hasNote ? "level-tip-" + (++LEVEL_TIP_SERIAL) : null;
  const tipNode = hasNote ? h("span", { class: "item-tip", id: tipId, role: "tooltip" },
    h("span", { class: "item-tip-k" }, badge.granted ? "Why it matters" : "Why this pick"),
    h("span", { class: "tip-content" }, h("span", { class: "tip-summary" }, rec.note))
  ) : null;
  const choice = h("div", {
    class: "level-choice" + (hasNote ? " has-detail" : "") + (badge.granted ? " is-grant" : ""),
    tabindex: hasNote ? "0" : null,
    "aria-describedby": tipId,
  },
    h("div", { class: "level-choice-category" },
      cardIcon(levelCategoryIcon(category)),
      h("span", null, category)
    ),
    h("div", { class: "level-choice-body" },
      badge.node,
      h("div", { class: "level-choice-recommendation" }, recommendation.length ? recommendation : "—")
    ),
    hasNote ? h("span", { class: "detail-cue", "aria-hidden": "true" }, "i") : null,
    tipNode
  );
  if (tipNode) attachHoverTip(choice, choice, tipNode);
  return choice;
}

let LEVEL_TIP_SERIAL = 0;

function renderLevelRecommendations(recommendations) {
  const entries = arr(recommendations).filter((rec) => rec && typeof rec === "object");
  if (!entries.length) return h("span", { class: "muted" }, "No selection required");
  return h("div", { class: "level-choice-list" }, entries.map(renderLevelRecommendation));
}

function renderLeveling(lv, idHint, keyRoot) {

/* Three vertical columns that mirror how the gear actually reads: what he swings,

/* Content writes slots freely ("feet", "off-hand", "consumables", …); map the
   spellings that exist onto the card names above. */
const ITEM_SLOT_ALIASES = {
  head: "Head", helmet: "Head", helm: "Head", circlet: "Head", hat: "Head",
  armour: "Armour", armor: "Armour", chest: "Armour", body: "Armour", robes: "Armour",

  rings: "Rings", ring: "Rings",
  "ring 1": "Ring 1", ring1: "Ring 1", "ring one": "Ring 1", "first ring": "Ring 1",
  "ring 2": "Ring 2", ring2: "Ring 2", "ring two": "Ring 2", "second ring": "Ring 2",
  feet: "Boots", boots: "Boots", shoes: "Boots",
  amulets: "Amulets", amulet: "Amulets", neck: "Amulets", necklace: "Amulets",
  cloaks: "Cloaks", cloak: "Cloaks", back: "Cloaks",
  weapons: "Melee Weapons", weapon: "Melee Weapons", melee: "Melee Weapons",
  "melee weapons": "Melee Weapons", "main hand": "Melee Weapons",
  "ranged weapons": "Ranged Weapons", ranged: "Ranged Weapons", "ranged weapon": "Ranged Weapons",
  "off-hand": "Off-hand & Shields", "off hand": "Off-hand & Shields", offhand: "Off-hand & Shields",
  shields: "Off-hand & Shields", shield: "Off-hand & Shields",
  elixirs: "Elixirs", elixir: "Elixirs",
  consumables: "Potions & Oils", consumable: "Potions & Oils", potions: "Potions & Oils",
  potion: "Potions & Oils", oils: "Potions & Oils", coatings: "Potions & Oils", arrows: "Potions & Oils",
  other: "Other", misc: "Other", "party aura": "Other",
};

const RANGED_WEAPON_WORDS = ["bow", "crossbow", "sling", "dart", "javelin", "ranged"];

function itemSlotIcon(slot) {
  return ITEM_SLOT_ICONS[slot] || ITEM_SLOT_ICONS.Other;
}

/* Keyword fallback for entries whose slot is missing or unrecognised. */
function classifyItemText(text) {
  const hasAny = (words) => words.some((word) => text.includes(word));
  if (hasAny(RANGED_WEAPON_WORDS)) return "Ranged Weapons";
  if (hasAny(["shield", "warboard", "off-hand", "off hand"])) return "Off-hand & Shields";
  if (hasAny(["blade", "pike", "sword", "staff", "markoheshkir", "phalar", "weapon"])) return "Melee Weapons";
  if (hasAny(["armour", "armor", "robe", "cloth", "mail"])) return "Armour";
  if (hasAny(["helmet", "helm", "head", "cowl", "mask", "diadem", "birthright", "hat"])) return "Head";
  if (hasAny(["glove", "bracer", "gauntlet"])) return "Hands";
  if (hasAny(["boot", "night walker", "shoes"])) return "Boots";
  if (hasAny(["cloak", "mantle", "cape"])) return "Cloaks";
  if (hasAny(["amulet", "neck", "periapt"])) return "Amulets";
  if (hasAny(["ring", "band"])) return "Rings";
  if (hasAny(["elixir"])) return "Elixirs";
  if (hasAny(["potion", "oil", "coating", "arrow", "hair"])) return "Potions & Oils";
  return "Other";
}

/* Prefer an explicit content slot, but classify legacy entries so older content
   remains useful. This is intentionally presentation-only; checklist keys still
   derive from the content IDs. */
function itemSlot(entry) {
  const isObj = entry && typeof entry === "object";
  const text = String(isObj ? entry.item || entry.id || "" : entry).toLowerCase();
  const declared = isObj && has(entry.slot) ? String(entry.slot).trim().toLowerCase() : "";
  const slot = declared
    ? ITEM_SLOT_ALIASES[declared] || classifyItemText(declared + " " + text)
    : classifyItemText(text);
  // Content files file bows and crossbows under the generic "weapons" slot, and
  // elixirs under "consumables"; split both so the narrower cards stay accurate.
  if (slot === "Melee Weapons" && RANGED_WEAPON_WORDS.some((word) => text.includes(word))) return "Ranged Weapons";
  if (slot === "Potions & Oils" && text.includes("elixir")) return "Elixirs";
  return slot;
}

function tooltipContent(summary, facts) {
  const rows = arr(facts).filter((fact) => fact && has(fact[1]));
  return h("span", { class: "tip-content" },
    has(summary) ? h("span", { class: "tip-summary" }, summary) : null,
    rows.length ? h("span", { class: "tip-facts" },
      rows.map((fact) => h("span", { class: "tip-fact" },
        h("span", { class: "tip-fact-k" }, fact[0]),
        h("span", { class: "tip-fact-v" }, fact[1])
      ))
    ) : null
  );
}

function itemTip(entry) {
  if (!entry || typeof entry !== "object") return null;
  const effect = has(entry.effect) ? String(entry.effect) : null;
  const why = has(entry.why) ? String(entry.why) : null;
  const note = has(entry.note) ? String(entry.note) : null;
  const tier = itemTier(entry);
  const rank = itemRank(entry);
  const summary = why || (!effect ? note : null);
  const facts = [
    ["Tier", tier ? tier.text : null],
    ["Ranked", rank ? rank.text : null],
    ["Effect", effect],
    ["Note", note && note !== summary && note !== effect ? note : null],
  ];
  return summary || effect || tier || rank ? tooltipContent(summary, facts) : null;
}

/* Published ratings carried on the content entry, from the guide corpus. They are
   independent, and an item often holds both: `tier` is a letter from that slot's tier
   list, `rank` is a placing such as "#12" in that act's top-20 countdown. The matching
   `_note` field names the source video, its timestamp, and the verdict. */
const ITEM_TIER_CLASS = { S: "tier-s", A: "tier-a", B: "tier-b", C: "tier-c", D: "tier-d", F: "tier-d" };
/* A handful of lists define an "S+" above their S, so colour by the base letter. */
function itemTierClass(letter) {
  return ITEM_TIER_CLASS[String(letter || "").charAt(0).toUpperCase()] || "tier-rank";
}
function itemTier(entry) {
  if (!entry || typeof entry !== "object" || !has(entry.tier)) return null;
  const raw = String(entry.tier).trim();
  const letter = /^[SABCDF]\+?$/i.test(raw) ? raw.toUpperCase() : null;
  /* A rank used to live in `tier`; tolerate that shape so old content still renders. */
  const label = letter || (/^#?\d+$/.test(raw) ? raw.replace(/^#?/, "#") : raw.toUpperCase());
  const note = has(entry.tier_note) ? String(entry.tier_note) : null;
  const named = letter ? "Tier " + letter : label;
  /* A rank note already names its list and repeats the rank, so it stands alone; a
     letter tier needs the letter spelled out in front of it. */
  return {
    label: label,
    cls: "item-tier " + (letter ? itemTierClass(letter) : "tier-rank"),
    text: note ? (letter ? named + " — " + note : note) : named + " (guide rating)",
  };
}
function itemRank(entry) {
  if (!entry || typeof entry !== "object" || !has(entry.rank)) return null;
  const raw = String(entry.rank).trim();
  const label = /^#?\d+$/.test(raw) ? raw.replace(/^#?/, "#") : raw.toUpperCase();
  const note = has(entry.rank_note) ? String(entry.rank_note) : null;
  return {
    label: label,
    cls: "item-tier tier-rank",
    text: note || (label + " on a best-items list"),
  };
}
/* The letter first, then the placing: the letter says how good the item is in its own
   slot, the placing how it stacks up against every item in the act. */
function itemBadges(entry) {
  return [itemTier(entry), itemRank(entry)]
    .filter(Boolean)
    .map((badge) => h("span", { class: badge.cls, title: badge.text }, badge.label));
}

const BG3_WIKI_ROOT = "https://bg3.wiki/wiki/";

function bg3WikiUrl(title) {
  return BG3_WIKI_ROOT + encodeURIComponent(title).replace(/%20/g, "_");
}

function wikiPageLink(title, attrs, label) {
  const linkAttrs = Object.assign({
    href: bg3WikiUrl(title),
    target: "_blank",
    rel: "noopener noreferrer",
    title: "Open " + title + " on bg3.wiki",
  }, attrs || {});
  linkAttrs.class = ["wiki-item", attrs && attrs.class].filter(Boolean).join(" ");
  delete linkAttrs.type;
  if (linkAttrs["aria-describedby"]) delete linkAttrs.title;
  return h("a", linkAttrs, label || title);
}

/* Content may provide `wiki: false`, one page title, or a list of page titles. */
function wikiItemNode(entry, attrs, linkByDefault = true) {
  const isObj = entry && typeof entry === "object";
  const label = String(isObj ? entry.item || entry.name || "" : entry);
  const configured = isObj ? entry.wiki : undefined;
  if (configured === false || (!linkByDefault && configured == null)) return null;
  const titles = configured == null ? [label] : arr(configured).filter(has).map(String);
  if (!titles.length) return null;
  if (titles.length > 1) {
    const groupAttrs = Object.assign({}, attrs || {});
    groupAttrs.class = ["wiki-item-group", attrs && attrs.class].filter(Boolean).join(" ");
    delete groupAttrs.type;
    const linkAttrs = groupAttrs["aria-describedby"]
      ? { "aria-describedby": groupAttrs["aria-describedby"] }
      : null;
    const links = [];
    titles.forEach((title, i) => {
      if (i) links.push(" + ");
      links.push(wikiPageLink(title, linkAttrs));
    });
    return h("span", groupAttrs, links);
  }
  return wikiPageLink(titles[0], attrs, label);
}

function positionItemTip(button, tip) {
  if (!button || !tip) return;
  const gap = 9;
  const edge = 16;
  const header = document.querySelector("header.app");
  const headerBottom = header ? header.getBoundingClientRect().bottom : 0;
  const buttonRect = button.getBoundingClientRect();
  const width = Math.min(390, Math.max(180, window.innerWidth - edge * 2));
  tip.style.width = width + "px";
  // visibility:hidden still has layout, so the real wrapped height is available.
  const height = tip.offsetHeight;
  const centered = buttonRect.left + buttonRect.width / 2 - width / 2;
  const left = Math.max(edge, Math.min(centered, window.innerWidth - width - edge));
  const above = buttonRect.top - height - gap;
  const below = buttonRect.bottom + gap;
  const minTop = Math.max(edge, headerBottom + 8);
  const maxTop = Math.max(minTop, window.innerHeight - height - edge);
  let top = above >= minTop ? above : below;
  if (top + height > window.innerHeight - edge && above >= minTop) top = above;
  tip.style.left = left + "px";
  tip.style.top = Math.max(minTop, Math.min(top, maxTop)) + "px";
}

let ACTIVE_HOVER_TIP = null;
let HOVER_TIP_FRAME = 0;

function scheduleHoverTipPosition() {
  if (!ACTIVE_HOVER_TIP || HOVER_TIP_FRAME) return;
  HOVER_TIP_FRAME = window.requestAnimationFrame(() => {
    HOVER_TIP_FRAME = 0;
    if (!ACTIVE_HOVER_TIP) return;
    const { anchor, tipNode } = ACTIVE_HOVER_TIP;
    if (!anchor.isConnected || !tipNode.isConnected) {
      ACTIVE_HOVER_TIP = null;
      return;
    }
    positionItemTip(anchor, tipNode);
  });
}

window.addEventListener("scroll", scheduleHoverTipPosition, true);
window.addEventListener("resize", scheduleHoverTipPosition);

function attachHoverTip(host, anchor, tipNode) {
  if (!host || !anchor || !tipNode) return;
  const reveal = () => {
    host.classList.remove("tip-dismissed");
    ACTIVE_HOVER_TIP = { host, anchor, tipNode };
    positionItemTip(anchor, tipNode);
  };
  const release = () => {
    window.requestAnimationFrame(() => {
      if (!ACTIVE_HOVER_TIP || ACTIVE_HOVER_TIP.host !== host) return;
      if (host.classList.contains("tip-pinned")) return;
      if (!host.matches(":hover") && !host.contains(document.activeElement)) ACTIVE_HOVER_TIP = null;
    });
  };
  host.addEventListener("mouseenter", reveal);
  host.addEventListener("focusin", reveal);
  host.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") {
      ev.preventDefault();
      host.classList.remove("tip-pinned");
      const details = host.querySelector(".item-details");
      if (details) details.setAttribute("aria-expanded", "false");
      host.classList.add("tip-dismissed");
      if (ACTIVE_HOVER_TIP && ACTIVE_HOVER_TIP.host === host) ACTIVE_HOVER_TIP = null;
    }
  });
  host.addEventListener("mouseleave", () => {
    host.classList.remove("tip-dismissed");
    release();
  });
  host.addEventListener("focusout", () => {
    host.classList.remove("tip-dismissed");
    release();
  });
}

/* Shared linked-name tooltip used by both item and spell checklists. */
function linkedNameTip(label, linkedNode, tip, tipId, heading) {
  const tipNode = tip ? h("span", { class: "item-tip", id: tipId, role: "tooltip" },
    h("span", { class: "item-tip-k" }, heading),
    tip
  ) : null;
  const nameControl = linkedNode || h("button", {
    class: "item-name", type: "button",
    "aria-describedby": tip ? tipId : null,
    title: tip ? null : "No details provided",
  }, label);
  const detailsControl = tipNode ? h("button", {
    class: "item-details", type: "button",
    "aria-label": "Show details for " + label,
    "aria-describedby": tipId,
    "aria-expanded": "false",
  }, "i") : null;
  const tipWrap = h("span", { class: "item-tip-wrap" + (tipNode ? " has-tip" : "") },
    nameControl, detailsControl, tipNode);
  if (tipNode) {
    attachHoverTip(tipWrap, detailsControl, tipNode);
    detailsControl.addEventListener("click", () => {
      const pinned = tipWrap.classList.toggle("tip-pinned");
      detailsControl.setAttribute("aria-expanded", String(pinned));
      if (pinned) {
        document.querySelectorAll(".item-tip-wrap.tip-pinned").forEach((other) => {
          if (other === tipWrap) return;
          other.classList.remove("tip-pinned");
          const otherButton = other.querySelector(".item-details");
          if (otherButton) otherButton.setAttribute("aria-expanded", "false");
        });
        ACTIVE_HOVER_TIP = { host: tipWrap, anchor: detailsControl, tipNode };
        positionItemTip(detailsControl, tipNode);
      } else if (ACTIVE_HOVER_TIP && ACTIVE_HOVER_TIP.host === tipWrap) {
        ACTIVE_HOVER_TIP = null;
      }
    });
  }
  return tipWrap;
}

/* A checkable, slot-grouped item list. The visible row is deliberately only the
   item name; effect and build rationale live in an accessible hover/focus bubble. */
/* Carrying gear over from an earlier act is presentation, not part of the item's name:
   it renders as an act chip beside the name. Content states it as `held: 1|2|3`, or
   `held: true` when the act is not worth naming. The older "(held over from Act 1)"
   parenthetical is still read out of the name so legacy content keeps its chip. */
const ITEM_HELD_RE = /\s*\(\s*(?:held|carried)\s+over(?:\s+from\s+act\s*([123]))?\s*\)\s*/i;
function itemHeldChip(entry) {
  const held = entry && typeof entry === "object" ? entry.held : null;
  if (has(held) && held !== false) return /^[123]$/.test(String(held)) ? "Act " + held : "Held";
  const m = itemLabel(entry).match(ITEM_HELD_RE);
  if (!m) return null;
  return m[1] ? "Act " + m[1] : "Held";
}
/* A shallow clone whose visible name has the held-over parenthetical removed. The
   `wiki` field is untouched, so wiki linking is unaffected. */
function itemDisplayEntry(entry) {
  if (!entry || typeof entry !== "object") return entry;
  const stripped = String(entry.item || "").replace(ITEM_HELD_RE, " ").replace(/\s{2,}/g, " ").trim();
  if (!stripped || stripped === entry.item) return entry;
  return Object.assign({}, entry, { item: stripped });
}
/* Build-defining gear. Explicit `bis: true` wins; otherwise the existing prose
   conventions (LOCKED / best-in-slot / BIS) are honoured so old content still pops. */
function itemIsBis(entry) {
  if (!entry || typeof entry !== "object") return false;
  if (entry.bis === true) return true;
  if (entry.bis === false) return false;
  return /\bLOCKED\b|\bBIS\b|best[- ]in[- ]slot/i.test(String(entry.item || "") + " " + String(entry.note || ""));
}
/* Slots that hold exactly one thing at a time, so several entries in one act read as
   a progression. Weapons and consumables can hold parallel picks, so they are excluded. */
const SEQUENTIAL_SLOTS = new Set(["Head", "Armour", "Hands", "Boots", "Amulets", "Cloaks", "Ring 1", "Ring 2", "Ranged Weapons"]);
/* "No cloak exists yet" is a deliberate empty state in the content, not an item. */
function itemIsEmpty(entry) {
  if (entry && typeof entry === "object" && entry.empty === true) return true;
  return /^\s*(?:no\b[^.]*\b(?:exists|available|option)|none\b|nothing\b|empty\b)/i.test(itemLabel(entry));
}
/* A flex slot: no checkbox of its own, just small checkable candidates. */
function itemFlexOptions(entry) {
  if (!entry || typeof entry !== "object") return null;
  const opts = arr(entry.options);
  if (!opts.length) return null;
  return opts;
}
/* "Head: Haste Helm -> Covert Cowl -> Helm of Balduran" becomes a vertical list with
   the latest pick on top, which is the one you actually want to read first. */
function progressionParts(entry) {
  const raw = itemLabel(entry);
  const colon = raw.indexOf(":");
  const prefix = colon > 0 ? raw.slice(0, colon).trim() : "";
  const body = colon > 0 ? raw.slice(colon + 1) : raw;
  const steps = body.split(/\u2192|->/).map((s) => s.trim()).filter(Boolean);
  return { prefix: prefix, steps: steps };
}
/* Canonical name -> the rated entry, gathered from every act tab including flex
   options. The progression tab names the same items in prose, so it can borrow their
   badges rather than carrying its own copy of the ratings. */
function itemRatingIndex(it) {
  const index = Object.create(null);
  Object.keys(it || {}).forEach((key) => {
    if (key === "progression") return;
    arr(it[key]).forEach((entry) => {
      if (!entry || typeof entry !== "object") return;
      [entry].concat(arr(entry.options)).forEach((row) => {
        if (!row || typeof row !== "object") return;
        if (!has(row.tier) && !has(row.rank)) return;
        const canon = canonicalItem(row.item);
        if (canon && !index[canon]) index[canon] = row;
      });
    });
  });
  return index;
}

function progressionSteps(steps, rated) {
  const out = [];
  steps.forEach((s, i) => {
    if (i) out.push(h("div", { class: "prog-arrow", "aria-hidden": "true" }, "\u2193"));
    /* A step is prose, not an entry, so "none available" or "all three acts" simply
       finds nothing and renders bare. */
    const match = rated ? rated[canonicalItem(s)] : null;
    out.push(h("div", { class: "prog-step" + (i === steps.length - 1 ? " prog-latest" : "") },
      h("span", { class: "prog-step-name" }, s),
      match ? itemBadges(match) : null));
  });
  return h("div", { class: "prog-steps" }, out);
}

function itemChecklist(entries, act, keyRoot, slotName, rated) {
  const isProgression = act === "progression";
  /* Several entries in a one-at-a-time slot are a progression: arrow each one down to
     the next thing acquired, so the best pick ends up at the bottom. */
  const sequential = !isProgression && entries.length > 1 && SEQUENTIAL_SLOTS.has(slotName);
  const rows = [];
  const out = entries.map((entry, i) => {
      const label = itemLabel(entry);
      const shown = itemDisplayEntry(entry);
      const chip = itemHeldChip(entry);
      const bis = itemIsBis(entry);
      const badges = itemBadges(entry);
      const flex = itemFlexOptions(entry);
      const empty = itemIsEmpty(entry);
      const tip = itemTip(entry);
      const id = itemEntryId(entry, i);
      const key = charItemKey(keyRoot, act, entry, i);
      const tipId = "item-tip-" + slug(keyRoot || "build") + "-" + slug(act) + "-" + slug(id) + "-" + i;
      const cls = ["ck-li", bis ? "item-bis" : null, flex ? "flex-parent" : null,
        empty ? "item-empty" : null].filter(Boolean).join(" ");

      if (isProgression) {
        const parts = progressionParts(entry);
        const heading = parts.prefix || label;
        const plain = h("span", { class: "item-name", tabindex: tip ? "0" : null, "aria-describedby": tip ? tipId : null }, heading);
        return h("li", { class: cls },
          key ? checkbox(key, "Mark " + label + " acquired") : null,
          h("div", { class: "item-body" },
            h("div", { class: "item-head" },
              linkedNameTip(heading, plain, tip, tipId, "How the slot progresses"),
              badges,
              bis ? h("span", { class: "item-bis-star", title: "Build-defining" }, "\u2605") : null
            ),
            parts.steps.length > 1 ? progressionSteps(parts.steps, rated) : null
          )
        );
      }

      if (flex) {
        const flexLabel = h("span", {
          class: "flex-label", tabindex: tip ? "0" : null,
          "aria-describedby": tip ? tipId : null,
        }, "flex");
        return h("li", { class: cls },
          h("span", { class: "ck-spacer", "aria-hidden": "true" }),
          h("div", { class: "item-body" },
            h("div", { class: "item-head flex-head" },
              linkedNameTip("flex", flexLabel, tip, tipId, "How to pick this slot"),
              badges,
              chip ? h("span", { class: "item-chip" }, chip) : null
            ),
            h("ul", { class: "clean flex-options" }, flex.map((opt, j) => {
              const oLabel = itemLabel(opt);
              const oTip = itemTip(opt);
              const oTipId = tipId + "-opt-" + j;
              /* Flat key, deliberately NOT nested under the parent id: an option is often a
                 slot's former top-level entry, and nesting would orphan its saved checkoff. */
              const oKey = charItemKey(keyRoot, act, opt, j);
              const oName = wikiItemNode(itemDisplayEntry(opt), {
                class: "item-name", type: "button",
                "aria-describedby": oTip ? oTipId : null,
              });
              return h("li", { class: "ck-li flex-option" },
                oKey ? checkbox(oKey, "Mark " + oLabel + " acquired") : null,
                linkedNameTip(oLabel, oName, oTip, oTipId, "What it does & why it fits"),
                itemBadges(opt)
              );
            }))
          )
        );
      }

      if (empty) {
        const emptyName = h("span", {
          class: "item-name", tabindex: tip ? "0" : null,
          "aria-describedby": tip ? tipId : null,
        }, itemLabel(shown));
        return h("li", { class: cls },
          h("span", { class: "item-empty-icon", "aria-hidden": "true" }, "\u2298"),
          h("div", { class: "item-body" },
            h("div", { class: "item-head" },
              linkedNameTip(itemLabel(shown), emptyName, tip, tipId, "Why this slot is empty")
            )
          )
        );
      }

      const nameLink = wikiItemNode(shown, {
        class: "item-name", type: "button",
        "aria-describedby": tip ? tipId : null,
      });
      return h("li", { class: cls },
        key ? checkbox(key, "Mark " + label + " acquired") : null,
        h("div", { class: "item-body" },
          h("div", { class: "item-head" },
            linkedNameTip(itemLabel(shown), nameLink, tip, tipId, "What it does & why it fits"),
            badges,
            bis ? h("span", { class: "item-bis-star", title: "Build-defining" }, "\u2605") : null,
            chip ? h("span", { class: "item-chip" }, chip) : null
          )
        )
      );
    });
  out.forEach((node, i) => {
    if (sequential && i) rows.push(h("li", { class: "slot-arrow", "aria-hidden": "true" }, "\u2193"));
    rows.push(node);
  });
  return h("ul", { class: "clean checklist" }, rows);
}

function itemActPanel(entries, act, keyRoot, rated) {
  const groups = new Map();
  arr(entries).forEach((entry) => {
    const slot = itemSlot(entry);
    if (!groups.has(slot)) groups.set(slot, []);
    groups.get(slot).push(entry);
  });
  const placed = new Set();
  const rows = ITEM_SLOT_ROWS.map((row) => {
    const slots = row.slots.filter((slot) => groups.has(slot));
    slots.forEach((slot) => placed.add(slot));
    return { label: row.label, slots };
  });
  // A slot name the rows don't know about still has to render, so it trails the
  // last row rather than disappearing.
  const extra = Array.from(groups.keys()).filter((slot) => !placed.has(slot)).sort();
  rows[rows.length - 1].slots = rows[rows.length - 1].slots.concat(extra);
  return h(
    "div",
    { class: "item-rows" },
    rows.filter((row) => row.slots.length).map((row) => h("section", { class: "item-row" },
      h("h4", { class: "item-row-label" }, row.label),
      h("div", { class: "item-slot-grid" },
        row.slots.map((slot) => h("section", { class: "item-slot" },
          cardHeading(slot, itemSlotIcon(slot), groups.get(slot).length),
          itemChecklist(groups.get(slot), act, keyRoot, slot, rated)
        ))
      )
    ))
  );

/* ---------------- Spell selection (mandatory / recommended) ---------------- */
function wikiSpellNode(spell, attrs) {
  const isObj = spell && typeof spell === "object";
  const label = String(isObj ? spell.spell : spell);
  const title = isObj && has(spell.wiki) ? String(spell.wiki) : label;
  return wikiPageLink(title, attrs, label);
}

/* Itemization-style spell lists. Class features with non-numeric levels stay
   out of this view because they already appear in Leveling. */
/* `source: granted` means the class, subclass or race supplies the spell for
   free -- it spends no spell-known pick and no prepared slot. Everything else is
   a pick, which the "Lv N" badge already places in the leveling order. */
function isGrantedSpell(s) {
  return /^(granted|grant|class|free|fixed)$/i.test(String((s && s.source) || ""));
}

function spellTip(s) {
  const tier = itemTier(s);
  return tooltipContent(has(s.why) ? String(s.why) : null, [
    ["Tier", tier ? tier.text : null],
    ["School", has(s.school) ? String(s.school) : null],
    ["Save / roll", has(s.save) ? String(s.save) : null],
    ["Available", has(s.when) ? String(s.when) : null],
    ["Costs a pick", isGrantedSpell(s) ? "No — free class grant" : null],
  ]);
}

function isChoosableSpell(s) {
  const level = String(s && s.level != null ? s.level : "").trim();
  return /cantrip/i.test(level) || /^[1-6]$/.test(level);
}

function spellChecklist(entries) {
  return h(
    "ul",
    { class: "clean checklist spell-checklist" },
    entries.map((s, i) => {
      const label = String(s.spell);
      const id = slug(label).slice(0, 60) || "s" + i;
      const tip = spellTip(s);
      const tipId = "spell-tip-" + id + "-" + i;
      const nameLink = wikiSpellNode(s, {
        class: "item-name spell-name",
        "aria-describedby": tip ? tipId : null,
      });
      const planLevel = s.guide_level;
      return h("li", { class: "ck-li " + (planLevel != null ? "spell-planned" : "spell-alternative") },
        h("span", { class: "spell-entry-main" },
          linkedNameTip(label, nameLink, tip, tipId, "Spell details & build use"),
          itemBadges(s),
          planLevel != null
            ? h("span", {
                class: "spell-plan-badge",
                title: "Included in the leveling guide at character level " + planLevel,
                "aria-label": "Leveling-guide pick at character level " + planLevel,
              }, h("span", { "aria-hidden": "true" }, "◆"), "Lv " + planLevel)
            : null,
          isGrantedSpell(s)
            ? h("span", {
                class: "spell-plan-badge is-grant",
                title: "Granted by the class, subclass or race — costs no spell pick and no prepared slot",
                "aria-label": "Free class grant, costs no pick",
              }, h("span", { "aria-hidden": "true" }, "✦"), "Free")
            : null
        )
      );
    })
  );
}

function spellLevelPanel(entries) {
  const lvlOf = (s) => String(s.level == null ? "" : s.level).trim();
  const groups = [];
  const cantrips = entries.filter((s) => /cantrip/i.test(lvlOf(s)));
  if (cantrips.length) groups.push(["Cantrips", cantrips]);
  for (let level = 1; level <= 6; level++) {
    const matches = entries.filter((s) => lvlOf(s) === String(level));
    if (matches.length) groups.push(["Level " + level, matches]);
  }
  return h("div", { class: "item-slot-grid spell-level-grid" },
    groups.map(([label, levelEntries]) =>
      h("section", { class: "item-slot spell-level" },
        cardHeading(label, label === "Cantrips" ? "✧" : "✦", levelEntries.length),
        spellChecklist(levelEntries)
      )
    )
  );
}

function combinedSpellEntries(sp) {
  const seen = new Set();
  const entries = [];
  ["mandatory", "recommended", "alternatives"].forEach((listName) => {
    arr(sp[listName]).filter(isChoosableSpell).forEach((spell) => {
      const key = String(spell.spell || "").toLowerCase();
      if (!key || seen.has(key)) return;
      seen.add(key);
      entries.push(spell);
    });
  });
  return entries;
}

function renderSpellsByLevel(sp) {
  const entries = combinedSpellEntries(sp);
  if (!entries.length) return null;
  return h("div", { class: "spell-list-ui" },
    has(sp.note) ? h("p", { class: "muted spell-list-note" }, sp.note) : null,
    h("div", { class: "spell-plan-legend" },
      h("span", { class: "spell-plan-badge", "aria-hidden": "true" }, "◆", "Lv N"),
      h("span", null, "Included in the leveling guide at that character level; unmarked entries are other good choices. Use the info button for details.")
    ),
    /* Only builds that actually own a free grant get its legend line. */
    entries.some(isGrantedSpell)
      ? h("div", { class: "spell-plan-legend" },
          h("span", { class: "spell-plan-badge is-grant", "aria-hidden": "true" }, "✦", "Free"),
          h("span", null, "Handed over by the class, subclass or race — it spends no spell pick and no prepared slot.")
        )
      : null,
    /* Class-feature entries carry no rating, so a build made only of those says nothing
       about tiers rather than advertising a legend for badges it never shows. */
    entries.some(itemTier)
      ? h("div", { class: "spell-plan-legend" },
          h("span", { class: "item-tier tier-s", "aria-hidden": "true" }, "S"),
          h("span", null, "The guide videos' tier for the spell inside its own spell-level list. Hover the badge, or the info button, for the source and verdict.")
        )
      : null,
    spellLevelPanel(entries)
  );
}
