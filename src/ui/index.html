                isDefault ? h("span", { class: "item-chip flex-chip", title: "The usual pick; the rows below are its alternates" }, "(default)") : null,
                oChip ? h("span", { class: "item-chip" }, oChip) : null
              );
            }))
          )
        );
      }

      if (empty) {
        const emptyName = h("span", {
          class: "item-name", tabindex: tip ? "0" : null,
          "aria-describedby": tip ? tipId : null,
        }, itemLabel(shown));
        return h("li", { class: cls },
          h("span", { class: "item-empty-icon", "aria-hidden": "true" }, "[-]"),
          h("div", { class: "item-body" },
            h("div", { class: "item-head" },
              linkedNameTip(itemLabel(shown), emptyName, tip, tipId, "Why this slot is empty")
            )
          )
        );
      }

      const nameLink = wikiItemNode(shown, {
        class: "item-name", type: "button",
        "aria-describedby": tip ? tipId : null,
      });
      return h("li", { class: cls },
        key ? checkbox(key, "Mark " + label + " acquired") : null,
        h("div", { class: "item-body" },
          h("div", { class: "item-head" },
            bis ? h("span", { class: "item-bis-star", title: "Build-defining" }, "*") : null,
            linkedNameTip(itemLabel(shown), nameLink, tip, tipId, "What it does & why it fits"),
            badges,
            chip ? h("span", { class: "item-chip" }, chip) : null
          )
        )
      );
    });
  out.forEach((node, i) => {
    if (sequential && i) rows.push(h("li", { class: "slot-arrow", "aria-hidden": "true" }, "\u2193"));
    rows.push(node);
  });
  return h("ul", { class: "clean checklist" }, rows);
}

/* One card, one or more slots inside it. A card that holds two slots (main hand and
   off-hand) lists them in ITEM_SLOT_CARDS order, each as its own checklist so the
   sequential arrows never run from a weapon into a shield. */
function itemSlotCardBody(card, parts, act, keyRoot, rated) {
  const order = ITEM_SLOT_CARDS[card] || [];
  const slots = Array.from(parts.keys()).sort((a, b) => order.indexOf(a) - order.indexOf(b));
  return slots.map((slot, i) => h("div", { class: "slot-part" },
    i ? h("div", { class: "slot-part-label" }, ITEM_SLOT_PART_LABELS[slot] || slot) : null,
    itemChecklist(parts.get(slot), act, keyRoot, slot, rated)
  ));
}

function itemActPanel(entries, act, keyRoot, rated) {
  // card -> Map(slot -> entries)
  const groups = new Map();
  arr(entries).forEach((entry) => {
    const slot = itemSlot(entry);
    const card = itemSlotCard(slot);
    if (!groups.has(card)) groups.set(card, new Map());
    const parts = groups.get(card);
    if (!parts.has(slot)) parts.set(slot, []);
    parts.get(slot).push(entry);
  });
  const placed = new Set();
  const rows = ITEM_SLOT_ROWS.map((row) => {
    const slots = row.slots.filter((card) => groups.has(card));
    slots.forEach((card) => placed.add(card));
    return { label: row.label, slots };
  });
  // A card name the rows don't know about still has to render, so it trails the
  // last row rather than disappearing.
  const extra = Array.from(groups.keys()).filter((card) => !placed.has(card)).sort();
  rows[rows.length - 1].slots = rows[rows.length - 1].slots.concat(extra);
  return h(
    "div",
    { class: "item-rows" },
    rows.filter((row) => row.slots.length).map((row) => h("section", { class: "item-row" },
      h("h4", { class: "item-row-label" }, row.label),
      h("div", { class: "item-slot-grid" },
        row.slots.map((card) => {
          const parts = groups.get(card);
          const count = Array.from(parts.values()).reduce((n, list) => n + list.length, 0);
          return h("section", { class: "item-slot" },
            cardHeading(card, count),
            itemSlotCardBody(card, parts, act, keyRoot, rated)
          );
        })
      )
    ))
  );
}

function renderItemization(it, keyRoot) {
  const standard = ["act1", "act2", "act3"];
  const keys = standard.filter((key) => has(it[key])).concat(
    Object.keys(it).filter((key) => !standard.includes(key) && has(it[key]))
  );
  const rated = itemRatingIndex(it);
  const entries = keys.map((key) => ({
    label: /^act([123])$/.test(key) ? "Act " + key.slice(-1) : humanize(key),
    count: arr(it[key]).length,
    content: itemActPanel(it[key], key, keyRoot, rated),
  }));
  return h(
    "div",
    { class: "itemization-tabs" },
    h("p", { class: "muted itemization-note" }, "Each tab shows gear added or changed in that act. Keep earlier items until explicitly replaced; hover or focus a name for its effect and build rationale. Badges are the guide videos' ratings: a letter is the item's tier within its own slot, and a #number is its place on that act's top-20 list. An item can carry both."),
    miniTabs("items-" + slug(keyRoot || "build"), entries, "Itemization by act")
  );
}

/* A score out of five as a text bar of block characters, so it prints as drawn. */
function renderScores(scores) {
  const cells = 10;
  return h(
    "div",
    { class: "meters" },
    Object.keys(scores).map((k) => {
      const val = Number(scores[k]);
      const filled = Math.max(0, Math.min(cells, Math.round((val / 5) * cells)));
      return h(
        "div",
        { class: "meter" },
        h("span", { class: "meter-k" }, k),
        h(
          "span",
          { class: "meter-bar", role: "meter", "aria-valuenow": val, "aria-valuemin": 0, "aria-valuemax": 5, "aria-label": k + " score " + val + " of 5" },
          h("span", { class: "meter-fill" }, "█".repeat(filled)),
          h("span", { class: "meter-rest" }, "░".repeat(cells - filled))
        ),
        h("span", { class: "meter-v" }, val + " / 5")
      );
    })
  );
}

function renderNova(nova) {
  const kids = [];
  if (has(nova.assumptions)) {
    kids.push(h("div", { class: "callout" }, h("span", { class: "callout-k" }, "Assumptions"), richText(nova.assumptions)));
  }
  arr(nova.configs).forEach((cfg) => {
    const body = [h("h4", null, cfg.name)];
    body.push(
      tableWrap(
        h(
          "table",
          null,
          h(
            "thead",
            null,
            h("tr", null, h("th", { scope: "col" }, "Line"), h("th", { class: "num", scope: "col" }, "Count"), h("th", { class: "num", scope: "col" }, "Each"), h("th", { class: "num", scope: "col" }, "Total"))
          ),
          h(
            "tbody",
            null,
            arr(cfg.lines).map((ln) =>
              h(
                "tr",
                null,
                h("td", null, ln.line),
                h("td", { class: "num" }, ln.count),
                h("td", { class: "num" }, ln.each),
                h("td", { class: "num" }, ln.total)
              )
            ),
            cfg.turn_total != null
              ? h(
                  "tr",
                  { class: "total-row" },
                  h("td", null, "Turn total"),
                  h("td", { class: "num" }, ""),
                  h("td", { class: "num" }, ""),
                  h("td", { class: "num" }, cfg.turn_total)
                )
              : null
          )
        )
      )
    );
    kids.push(h("div", { class: "nova-config" }, body));
  });
  if (has(nova.caveats)) {
    kids.push(h("div", { class: "callout warn" }, h("span", { class: "callout-k" }, "Caveats"), richText(nova.caveats)));
  }
  return h("div", null, kids);
}

/* ---------------- Build renderer ---------------- */
/* small sub-heading used inside multi-part sections */
function subhead(text) {
  return h("h4", { class: "subhead" }, text);
}

/* ---------------- Character creation (Level 1) ---------------- */
function renderCreation(c) {
  const dl = h("dl", { class: "facts" });
  // Concise: names inline, the "why"/detail on hover (native title tooltip).
  const add = (label, val, tip) => {
    if (has(val)) dl.appendChild(h("div", { class: "fact" }, h("dt", null, label), h("dd", tip ? { class: "has-hover", title: tip } : null, val)));
  };
  add("Level 1", c.level1_class, c.level1_gains);
  add("Subclass", c.subclass_choice);
  if (c.proficiencies) {
    add("Saves", c.proficiencies.saving_throws);
    add("Armour & weapons", c.proficiencies.armor_weapons);
    add("Skills", c.proficiencies.skills);
  }
  add("Cantrips", c.starting_cantrips);
  add("Spells", c.starting_spells);
  add("Notes", c.notes);
  return dl;
}

/* ---------------- Spell selection (mandatory / recommended) ---------------- */
function wikiSpellNode(spell, attrs) {
  const isObj = spell && typeof spell === "object";
  const label = String(isObj ? spell.spell : spell);
  const title = isObj && has(spell.wiki) ? String(spell.wiki) : label;
  return wikiPageLink(title, attrs, label);
}

/* Itemization-style spell lists. Class features with non-numeric levels stay
   out of this view because they already appear in Leveling. */
/* `source: granted` means the class, subclass or race supplies the spell for
   free -- it spends no spell-known pick and no prepared slot. Everything else is
   a pick, which the "Lv N" badge already places in the leveling order. */
function isGrantedSpell(s) {
  return /^(granted|grant|class|free|fixed)$/i.test(String((s && s.source) || ""));
}

function spellTip(s) {
  const tier = itemTier(s);
  return tooltipContent(has(s.why) ? String(s.why) : null, [
    ["Tier", tier ? tier.text : null],
    ["School", has(s.school) ? String(s.school) : null],
    ["Save / roll", has(s.save) ? String(s.save) : null],
    ["Available", has(s.when) ? String(s.when) : null],
    ["Costs a pick", isGrantedSpell(s) ? "No — free class grant" : null],
  ]);
}

function isChoosableSpell(s) {
  const level = String(s && s.level != null ? s.level : "").trim();
  return /cantrip/i.test(level) || /^[1-6]$/.test(level);
}

function spellChecklist(entries) {
  return h(
    "ul",
    { class: "clean checklist spell-checklist" },
    entries.map((s, i) => {
      const label = String(s.spell);

        h("span", { class: "spell-entry-main" },

function spellLevelPanel(entries) {
  const lvlOf = (s) => String(s.level == null ? "" : s.level).trim();
  const groups = [];
  const cantrips = entries.filter((s) => /cantrip/i.test(lvlOf(s)));
  if (cantrips.length) groups.push(["Cantrips", cantrips]);
  for (let level = 1; level <= 6; level++) {
    const matches = entries.filter((s) => lvlOf(s) === String(level));
    if (matches.length) groups.push(["Level " + level, matches]);
  }
  return h("div", { class: "item-slot-grid spell-level-grid" },
    groups.map(([label, levelEntries]) =>
      h("section", { class: "item-slot spell-level" },
        cardHeading(label, levelEntries.length),
        spellChecklist(levelEntries)
      )
    )
  );
}

function combinedSpellEntries(sp) {
  const seen = new Set();
  const entries = [];
  ["mandatory", "recommended", "alternatives"].forEach((listName) => {
    arr(sp[listName]).filter(isChoosableSpell).forEach((spell) => {
      const key = String(spell.spell || "").toLowerCase();
      if (!key || seen.has(key)) return;
      seen.add(key);
      entries.push(spell);
    });
  });
  return entries;
}

function renderSpellsByLevel(sp) {
  const entries = combinedSpellEntries(sp);
  if (!entries.length) return null;
  return h("div", { class: "spell-list-ui" },
    has(sp.note) ? h("p", { class: "muted spell-list-note" }, sp.note) : null,
    h("div", { class: "spell-plan-legend" },
      h("span", { class: "spell-plan-badge", "aria-hidden": "true" }, "[Lv N]"),
      h("span", null, "Included in the leveling guide at that character level; unmarked entries are other good choices. Use the info button for details.")
    ),
    /* Only builds that actually own a free grant get its legend line. */
    entries.some(isGrantedSpell)
      ? h("div", { class: "spell-plan-legend" },
          h("span", { class: "spell-plan-badge is-grant", "aria-hidden": "true" }, "[free]"),
          h("span", null, "Handed over by the class, subclass or race — it spends no spell pick and no prepared slot.")
        )
      : null,
    /* Class-feature entries carry no rating, so a build made only of those says nothing
       about tiers rather than advertising a legend for badges it never shows. */
    entries.some(itemTier)
      ? h("div", { class: "spell-plan-legend" },

          h("span", null, "The guide videos' tier for the spell inside its own spell-level list. Hover the badge, or the info button, for the source and verdict.")

    spellLevelPanel(entries)
  );
}

/* A static "Contents:" line at the top of a long page, one anchor per section. It
   stands in for the sticky outline bar the guide used to have, so the page reads the
   same printed as on screen. */
function addContentsLine(wrap, keyRoot) {
  const sections = Array.from(wrap.children).filter((node) =>
    node.matches && node.matches("section.sec") && node.querySelector(".sec-h")
  );
  if (sections.length < 2) return;
  const links = [];
  sections.forEach((node, index) => {
    const label = node.querySelector(".sec-h").textContent.trim();
    node.id = "section-" + slug(keyRoot) + "-" + slug(label) + "-" + index;
    if (index) links.push(" · ");
    const link = h("a", { href: "#" + node.id }, label);
    link.addEventListener("click", (ev) => {
      ev.preventDefault();
      node.scrollIntoView({ block: "start", behavior: "auto" });
      if (window.history && window.history.replaceState) {
        window.history.replaceState(null, "", "#" + node.id);
      }
    });
    links.push(link);
  });
  wrap.insertBefore(h("p", { class: "contents" }, "Contents: ", links), wrap.firstChild);
}

function renderBuild(b, charName) {
  const wrap = h("div", { class: "build" });
  const keyRoot = buildKeyRoot(charName, b);

  // At-a-glance badges — the three table-side facts a player needs before
  // anything else: what armour the build can wear, which elixir it drinks every
  // long rest, and what its concentration is spent on.
  if (has(b.at_a_glance)) {
    const g = b.at_a_glance;
    const row = h("div", { class: "glance", role: "list", "aria-label": "At a glance" });
    const add = (label, value) => {
      if (!has(value)) return;
      row.appendChild(h("span", { class: "glance-item", role: "listitem" }, h("span", { class: "glance-k" }, label), h("span", null, String(value))));
    };
    add("Armour", g.armour);
    add("Elixir", g.elixir);
    add("Concentration", g.concentration);
    if (row.children.length) wrap.appendChild(row);
  }

  // Put the at-a-glance combat loop first so a character page opens with the
  // decisions the player needs at the table.
  if (has(b.playstyle)) wrap.appendChild(section("Playstyle", richText(b.playstyle)));

  // Overview — role + a couple of identity facts (no build_order / ability_targets;
  // ability boosts moved under Ability scores, level order into Leveling).
  const head = h("section", { class: "sec" }, h("h3", { class: "sec-h" }, "Overview"));
  if (has(b.role)) head.appendChild(h("p", { class: "prose muted" }, b.role));
  const facts = h("dl", { class: "facts" });
  const addFact = (label, valNode) => facts.appendChild(h("div", { class: "fact" }, h("dt", null, label), h("dd", null, valNode)));
  if (has(b.class)) addFact("Class", b.class);
  if (has(b.casting)) addFact("Casting", b.casting);
  if (has(b.combat_style)) addFact("Combat style", b.combat_style);
  if (has(b.weapon_plan)) addFact("Weapon plan", b.weapon_plan);
  if (facts.children.length) head.appendChild(facts);
  wrap.appendChild(head);

  // Character Creation — identity only. Race and background don't change between
  // respecs, and ability scores are involved enough to deserve their own card.
  if (has(b.race) || has(b.background)) {
    const cre = section("Character Creation");
    const idf = h("dl", { class: "facts" });
    if (has(b.race)) idf.appendChild(h("div", { class: "fact" }, h("dt", null, "Race"), h("dd", null, h("span", null, b.race, has(b.race_notes) ? h("span", { class: "note" }, b.race_notes) : null))));
    if (has(b.background)) idf.appendChild(h("div", { class: "fact" }, h("dt", null, "Background"), h("dd", null, b.background)));
    if (idf.children.length) cre.appendChild(idf);
    wrap.appendChild(cre);
  }

  // Ability scores — the growth chain is the point, so it gets its own card.
  // renderStatblock stays as the fallback for content without a chain.
  if (has(b.ability_scores) || has(b.starting_stats)) {
    const sc = section("Ability scores");
    if (has(b.ability_scores)) sc.appendChild(renderAbilityChains(b.ability_scores));
    else sc.appendChild(renderStatblock(b.starting_stats));
    if (has(b.ability_targets)) sc.appendChild(h("p", { class: "note" }, h("span", { class: "li-strong" }, "Boosts: "), b.ability_targets));
    if (has(b.stats_note)) sc.appendChild(h("p", { class: "note" }, b.stats_note));
    wrap.appendChild(sc);
  }

  // Build-defining tags not already folded into the Leveling gains.
  const kit = [];
  if (has(b.metamagic)) kit.push(section("Metamagic", renderTags(b.metamagic)));
  if (has(b.fighting_styles)) kit.push(section("Fighting styles", renderTags(b.fighting_styles)));
  if (has(b.key_abilities)) kit.push(section("Signature abilities", renderTags(b.key_abilities)));
  if (kit.length) wrap.appendChild(h("div", { class: "subgrid two" }, kit));

  // Level 1 is an explicit row in the structured guide. The legacy prepend keeps
  // older content usable, while migrated builds separate automatic gains from
  // recommendations directly in every row.
  const levelMain = h("div", { class: "lvl-main" },
    h("h3", { class: "sec-h" }, "Leveling"),
    h("p", { class: "section-hint" }, "Automatic gains are fixed; the third column is what you actually choose. Hover or focus a row to see why it fits."),
    h("div", { class: "level-legend" },
      h("span", { class: "level-legend-item" },
        h("span", { class: "pick-badge" }, "[2 picks]"),
        h("span", null, "selections this level opens")),
      h("span", { class: "level-legend-item" },
        h("span", { class: "open-pick" }, "[ open ]"),
        h("span", null, "granted but not yet assigned")),
      h("span", { class: "level-legend-item" },
        h("span", { class: "pick-badge is-grant" }, "[free]"),
        h("span", null, "handed over by the class or subclass"))
    )
  );
  if (has(b.leveling)) {
    let lv = b.leveling;
    if (Array.isArray(lv) && has(b.creation) && has(b.creation.level1_class) && (!lv[0] || lv[0].char_level !== 1)) {
      lv = [{ char_level: 1, class: b.creation.level1_class, gains: b.creation.level1_gains }].concat(lv);
    }
    levelMain.appendChild(renderLeveling(lv, b.name, keyRoot));
  }
  wrap.appendChild(h("section", { class: "sec" }, levelMain));

  if (has(b.spells)) {
    const spells = renderSpellsByLevel(b.spells);
    if (spells) wrap.appendChild(section("Spells", spells));
  }
  if (has(b.itemization)) wrap.appendChild(section("Itemization", renderItemization(b.itemization, keyRoot)));
  if (has(b.traps)) wrap.appendChild(section("Traps & caveats", bulletList(arr(b.traps))));
  if (has(b.pickpocket)) wrap.appendChild(section("Pickpocketing", renderPickpocket(b.pickpocket)));
  if (has(b.nova)) wrap.appendChild(section("Nova turn", renderNova(b.nova)));

  addContentsLine(wrap, keyRoot);
  return wrap;
}

/* ---------------- Character view (with build tabs) ---------------- */
function renderCharacter(name, builds) {
  const container = h("div", null);
  container.appendChild(h("div", { class: "page-head" }, h("h2", { class: "view-title" }, name)));

  if (builds.length === 1) {
    container.appendChild(renderBuild(builds[0], name));
    return container;
  }

  // Multiple builds → ARIA tabs
  const baseId = "char-" + name.replace(/[^a-z0-9]+/gi, "-").toLowerCase();
  const tablist = h("div", { class: "tabs", role: "tablist", "aria-label": name + " builds" });
  const panels = h("div", null);
  const tabs = [];
  const startIndex = rememberedTab(baseId, builds.length);

  builds.forEach((b, i) => {
    const tabId = baseId + "-tab-" + i;
    const panelId = baseId + "-panel-" + i;
    const selected = i === startIndex;
    const tab = h(
      "button",
      {
        class: "tab",
        role: "tab",
        id: tabId,
        "aria-controls": panelId,
        "aria-selected": String(selected),
        tabindex: selected ? "0" : "-1",
        type: "button",
      },
      b.name || "Build " + (i + 1),
      b.is_primary ? h("span", { class: "badge" }, "(primary)") : null
    );
    const panel = h(
      "div",
      {
        role: "tabpanel", id: panelId, "aria-labelledby": tabId, tabindex: "0",
        hidden: selected ? null : "hidden", "data-tab-label": b.name || "Build " + (i + 1),
      },
      renderBuild(b, name)
    );
    if (!selected) panel.setAttribute("hidden", "hidden");

    const activate = (focus) => {
      tabs.forEach((t, j) => {
        const on = j === i;
        t.tab.setAttribute("aria-selected", String(on));
        t.tab.tabIndex = on ? 0 : -1;
        if (on) t.panel.removeAttribute("hidden");
        else t.panel.setAttribute("hidden", "hidden");
      });
      rememberTab(baseId, i);
      if (focus) tab.focus();
    };
    tab.addEventListener("click", () => activate(false));
    tabs.push({ tab, panel, activate });
    tablist.appendChild(tab);
    panels.appendChild(panel);
  });

  tablist.addEventListener("keydown", (ev) => {
    const cur = tabs.findIndex((t) => t.tab.getAttribute("aria-selected") === "true");
    let next = -1;
    if (ev.key === "ArrowRight" || ev.key === "ArrowDown") next = (cur + 1) % tabs.length;
    else if (ev.key === "ArrowLeft" || ev.key === "ArrowUp") next = (cur - 1 + tabs.length) % tabs.length;
    else if (ev.key === "Home") next = 0;
    else if (ev.key === "End") next = tabs.length - 1;
    if (next >= 0) {
      ev.preventDefault();
      tabs[next].activate(true);
    }
  });

  container.appendChild(tablist);
  container.appendChild(panels);
  return container;
}

/* ---------------- Header ---------------- */
function renderHeader(meta) {
  const host = document.getElementById("app-header");
  host.innerHTML = "";

  // One masthead line: title, version, then mode / patch / companion docs as a
  // dot-separated run, then the theme toggle at the right edge.
  const run = [];
  const addRun = (node) => { if (run.length) run.push(" · "); run.push(node); };
  if (has(meta.mode)) addRun("Mode: " + meta.mode);
  if (has(meta.patch)) addRun(String(meta.patch));
  arr(meta.companion_docs).forEach((d) => {
    // Friendly label: strip directory + trailing extension so a raw path like
    // "resources/reddit/research.md" reads as "research", and link to the document.
    const label = String(d).split(/[\\/]/).pop().replace(/\.[^.]+$/, "");
    addRun(h("a", { href: d }, label));
  });
  host.appendChild(h("div", { class: "masthead" },
    h("h1", null, meta.title || "BG3 Party Plan"),
    has(meta.version) ? h("span", { class: "app-version", title: "Plan version" }, "v" + meta.version) : null,
    run.length ? h("span", { class: "meta-run" }, run) : null,
    buildThemeToggle()
  ));

  if (has(meta.stat_assumption) || has(meta.mode_note)) {
    const det = h("details", { class: "assumptions" });
    det.appendChild(h("summary", null, "Assumptions & mode notes"));
    const body = h("div", { class: "assume-body" });
    if (has(meta.stat_assumption)) body.appendChild(h("p", null, h("strong", null, "Stats: "), meta.stat_assumption));
    if (has(meta.mode_note)) body.appendChild(h("p", null, h("strong", null, "Mode: "), meta.mode_note));
    det.appendChild(body);
    host.appendChild(det);
  }
}

/* ---------------- Theme ---------------- */
function storedTheme() {
  let stored = null;
  try {
    stored = localStorage.getItem("bg3-theme");
  } catch (e) {
    /* storage blocked (e.g. file:// opaque origin, privacy mode) — ignore */
  }
  return stored === "light" || stored === "dark" ? stored : null;
}
function currentTheme() {
  const stored = storedTheme();
  if (stored) return stored;
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
}
function buildThemeToggle() {
  const btn = h("button", { class: "theme-toggle", type: "button", title: "Switch between light and dark theme" });
  const paint = () => {
    const t = document.documentElement.getAttribute("data-theme");
    const dark = t === "dark";
    // Visible text becomes the accessible name (WCAG 2.5.3 Label in Name).
    btn.textContent = dark ? "[light]" : "[dark]";
    btn.setAttribute("aria-pressed", String(dark));
  };
  btn.addEventListener("click", () => {
    const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    try {
      localStorage.setItem("bg3-theme", next);
    } catch (e) {
      /* storage blocked — theme still applies for this session */
    }
    applyTheme(next);
    paint();
  });
  paint();

  // Follow OS theme changes while the page is open, unless the user made an explicit choice.
  if (window.matchMedia) {
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const onChange = (ev) => {
      if (storedTheme()) return;
      applyTheme(ev.matches ? "dark" : "light");
      paint();
    };
    if (mq.addEventListener) mq.addEventListener("change", onChange);
    else if (mq.addListener) mq.addListener(onChange);
  }

  return btn;
}

/* Reusable ARIA tab group (same behaviour as the build tabs). entries = [{label, count, content}]. */
function miniTabs(idBase, entries, ariaLabel) {
  const wrap = h("div", null);
  const tablist = h("div", { class: "tabs", role: "tablist", "aria-label": ariaLabel || null });
  const panels = h("div", null);
  const tabs = [];
  const startIndex = rememberedTab(idBase, entries.length);
  entries.forEach((entry, i) => {
    const tabId = idBase + "-t-" + i;
    const panelId = idBase + "-p-" + i;
    const selected = i === startIndex;
    const tab = h("button", {
      class: "tab", role: "tab", id: tabId, "aria-controls": panelId,
      "aria-selected": String(selected), tabindex: selected ? "0" : "-1", type: "button",
    }, entry.label, entry.count != null ? h("span", { class: "badge" }, "(" + entry.count + ")") : null);
    const panel = h("div", { role: "tabpanel", id: panelId, "aria-labelledby": tabId, tabindex: "0", "data-tab-label": entry.label }, entry.content);
    if (!selected) panel.setAttribute("hidden", "hidden");
    const activate = (focus) => {
      tabs.forEach((t, j) => {
        const on = j === i;
        t.tab.setAttribute("aria-selected", String(on));
        t.tab.tabIndex = on ? 0 : -1;
        if (on) t.panel.removeAttribute("hidden"); else t.panel.setAttribute("hidden", "hidden");
      });
      rememberTab(idBase, i);
      if (focus) tab.focus();
    };
    tab.addEventListener("click", () => activate(false));
    tabs.push({ tab, panel, activate });
    tablist.appendChild(tab);
    panels.appendChild(panel);
  });
  tablist.addEventListener("keydown", (ev) => {
    const cur = tabs.findIndex((t) => t.tab.getAttribute("aria-selected") === "true");
    let next = -1;
    if (ev.key === "ArrowRight" || ev.key === "ArrowDown") next = (cur + 1) % tabs.length;
    else if (ev.key === "ArrowLeft" || ev.key === "ArrowUp") next = (cur - 1 + tabs.length) % tabs.length;
    else if (ev.key === "Home") next = 0;
    else if (ev.key === "End") next = tabs.length - 1;
    if (next >= 0) { ev.preventDefault(); tabs[next].activate(true); }
  });
  wrap.appendChild(tablist);
  wrap.appendChild(panels);
  return wrap;
}

function renderLoot(a) {
  const frag = document.createDocumentFragment();
  frag.appendChild(h("h2", { class: "view-title", tabindex: "-1" }, a ? "Loot — Act " + a.act : "Loot"));
  if (!a) { frag.appendChild(h("p", { class: "muted" }, "No data for this act.")); return frag; }
  const total = a.areas.reduce((s, ar) => s + arr(ar.items).length, 0);
  frag.appendChild(h("p", { class: "view-sub" }, a.areas.length + " areas · " + total + " items · * = core build item · Mandatory = plan-critical, FYI = good but off-plan"));
  a.areas.forEach((area, ai) => {
    const kids = [];
    const items = arr(area.items);
    const mandatory = items.filter((it) => it.core);
    const fyi = items.filter((it) => !it.core);
    if (items.length) {
      const lootKey = lootAreaKey(a.act, area.area);
      kids.push(miniTabs("loot-a" + a.act + "-" + ai, [
        { label: "Mandatory", count: mandatory.length, content: mandatory.length ? lootTable(mandatory, lootKey) : h("p", { class: "muted" }, "No plan-critical items here.") },
        { label: "FYI", count: fyi.length, content: fyi.length ? lootTable(fyi, lootKey) : h("p", { class: "muted" }, "Nothing extra flagged here.") },
      ]));

    if (has(area.events)) {
      kids.push(h("h4", { class: "loot-events-h" }, "Don't miss"));

        h("li", null, h("span", { class: "li-strong" }, e.name), e.note ? h("div", { class: "li-meta" }, e.note) : null)

    }
    frag.appendChild(section(area.area, ...kids));
  });
  return frag;
}

/* ---------------- Ratings (the guide corpus' own tier lists) ----------------
   `data.ratings` is generated by tools/build_ratings_page.py out of
   resources/tiers/item_tiers.json: every item any read list rated, not just the party's,
   grouped by item type and then by the act whose list rated it. The generator has
   already sorted each act best-first (letter, then top-20 placing, then name), so
   the renderer only has to break the run into groups where the letter changes. */
const RATE_PREFIX = "__rate__";

/* "7:16" / "1:02:33" → seconds, so a verdict can link to the moment it was spoken. */
function ratingSeconds(at) {
  const parts = String(at == null ? "" : at).trim().split(":");
  if (!parts.length || parts.some((p) => !/^\d+$/.test(p))) return null;
  return parts.reduce((total, p) => total * 60 + parseInt(p, 10), 0);
}
function ratingSourceUrl(id, at) {
  if (!has(id)) return null;
  const secs = ratingSeconds(at);
  return "https://www.youtube.com/watch?v=" + encodeURIComponent(id) + (secs == null ? "" : "&t=" + secs + "s");
}
function ratingSourceIndex(r) {
  const byId = Object.create(null);
  arr(r && r.sources).forEach((s) => { if (s && has(s.id)) byId[s.id] = s; });
  return byId;
}
/* Canonical item name → the characters whose plan names it, so the corpus' verdict
   sits next to "and we're actually using this". Built from the same normalisation
   the checkoff link groups use, so the two agree on what counts as one item. */
function ratingPartyIndex(data) {
  const index = Object.create(null);
  Object.keys((data && data.characters) || {}).forEach((name) => {
    arr(data.characters[name]).forEach((build) => {
      const it = (build && build.itemization) || {};
      Object.keys(it).forEach((act) => {
        if (act === "progression") return;
        arr(it[act]).forEach((entry) => {
          [entry].concat(arr(entry && entry.options)).forEach((row) => {
            const canon = canonicalItem(itemLabel(row));
            if (!canon) return;
            if (!index[canon]) index[canon] = [];
            if (index[canon].indexOf(name) < 0) index[canon].push(name);
          });
        });
      });
    });
  });
  return index;
}

/* A dataset row rendered through the same badge/tooltip helpers the character
   pages use, so a rating looks identical wherever it shows up. */
function ratingEntry(row, sources) {
  const tierSrc = sources[row.source];
  const rankSrc = sources[row.rank_source];
  const entry = {
    item: row.item,
    /* The extraction disambiguates same-named drops by rarity; the wiki does not. */
    wiki: String(row.item).replace(/\s*\((?:common|uncommon|rare|very rare|legendary)\)\s*$/i, ""),
  };
  if (has(row.tier)) {
    entry.tier = row.tier;
    entry.tier_note = [
      (tierSrc ? tierSrc.title : row.source) + (has(row.at) ? " (" + row.at + ")" : ""),
      row.verdict,
    ].filter(has).join(" — ");
  }
  if (has(row.rank)) {
    entry.rank = row.rank;
    const place = String(row.rank).toUpperCase() === "HM"
      ? "honourable mention"
      : row.rank + " of " + (row.of || 20);
    entry.rank_note = [(rankSrc ? rankSrc.title : row.rank_source), place].filter(has).join(", ");
  }
  return entry;
}

function ratingRow(row, sources, party) {
  const entry = ratingEntry(row, sources);
  const src = sources[row.source];
  const who = party[canonicalItem(row.item)];
  const url = ratingSourceUrl(row.source, row.at);
  return h("li", { class: "rate-row" },
    h("div", { class: "rate-head" },
      h("span", { class: "rate-name" }, wikiItemNode(entry) || row.item),
      itemBadges(entry),
      who && who.length
        ? h("span", { class: "item-chip rate-party", title: "In the plan for " + who.join(", ") }, "(" + who.join(" · ") + ")")
        : null),
    has(row.verdict) || url
      ? h("div", { class: "rate-verdict" },
          has(row.verdict) ? row.verdict : null,
          url ? h("a", {
            class: "rate-at", href: url, target: "_blank", rel: "noopener noreferrer",
            title: (src ? src.title : row.source) + " — open at " + row.at,
            "aria-label": "Watch the verdict on " + row.item + " at " + row.at,
          }, row.at) : null)
      : null);
}

/* One block per letter, in the order the generator sorted them. */
function ratingTierGroups(rows, scale, sources, party) {
  const out = [];
  let group = null;
  rows.forEach((row) => {
    const letter = has(row.tier) ? String(row.tier).toUpperCase() : "";
    if (!group || group.letter !== letter) {
      group = { letter: letter, rows: [] };
      out.push(group);
    }
    group.rows.push(row);
  });
  return out.map((g) => h("div", { class: "rate-tier" },
    h("div", { class: "rate-tier-h" },
      h("span", { class: "item-tier " + (g.letter ? itemTierClass(g.letter) : "tier-rank") },
        g.letter ? "[" + g.letter + "]" : "no letter"),
      h("span", { class: "rate-tier-what" },
        g.letter
          ? (scale[g.letter] || scale[g.letter.charAt(0)] || "")
          : "on a top-20 countdown, but its own slot's list has not been read yet"),
      h("span", { class: "badge" }, "(" + g.rows.length + ")")),
    h("ul", { class: "rate-list" }, g.rows.map((row) => ratingRow(row, sources, party)))));
}

function ratingListLinks(ids, sources) {
  const links = [];
  arr(ids).forEach((id, i) => {
    const src = sources[id];
    if (i) links.push(" · ");
    links.push(h("a", {
      href: ratingSourceUrl(id, null), target: "_blank", rel: "noopener noreferrer",
    }, src ? src.title : id));
  });
  return links.length ? h("p", { class: "rate-lists" }, h("span", { class: "li-strong" }, "Rated by: "), links) : null;
}

function renderRatingsSlot(r, slotName, data) {
  const frag = document.createDocumentFragment();
  const slot = arr(r.slots).find((s) => s.slot === slotName);
  frag.appendChild(h("h2", { class: "view-title", tabindex: "-1" }, slotName + " — ratings"));
  if (!slot) {
    frag.appendChild(h("p", { class: "muted" }, "Nothing rated in this slot yet."));
    return frag;
  }
  const sources = ratingSourceIndex(r);
  const party = ratingPartyIndex(data);
  const scale = Object.create(null);
  arr(r.tier_scale).forEach((row) => { if (row && has(row.tier)) scale[String(row.tier).toUpperCase()] = row.what; });
  const lists = {};
  arr(slot.acts).forEach((act) => arr(act.lists).forEach((id) => { lists[id] = true; }));
  const listCount = Object.keys(lists).length;
  frag.appendChild(h("p", { class: "view-sub" },
    slot.count + " ratings from " + listCount + (listCount === 1 ? " list" : " lists") +
    " · best first inside each letter · a chip marks gear the party already plans"));
  frag.appendChild(section("By act",
    miniTabs("rate-" + slug(slotName), slot.acts.map((act) => ({
      label: act.label,
      count: act.count,
      content: h("div", null,
        ratingListLinks(act.lists, sources),
        ratingTierGroups(arr(act.items), scale, sources, party)),
    })), slotName + " ratings by act")));
  return frag;
}

function renderRatingsOverview(r) {
  const frag = document.createDocumentFragment();
  frag.appendChild(h("h2", { class: "view-title", tabindex: "-1" }, "Ratings"));
  const totals = r.totals || {};
  frag.appendChild(h("p", { class: "view-sub" },
    (totals.entries || 0) + " ratings on " + (totals.items || 0) + " items, read out of " +

  if (has(r.about)) frag.appendChild(section("What this is", h("p", { class: "prose" }, r.about)));
  if (has(r.note_on_acts)) {

function ratingActLabel(act) {
  if (act === "all" || !has(act)) return "every act";

/* Sub-nav entries for a given top-level tab. */
/* ---------------- Locations & route ----------------
   content/locations/*.md is one page per place; content/route.md is the order the
   party visits them. A location page lists every visit the route makes to it, so
   a place the route leaves and comes back to reads as two stops, not one. */
const LOC_PREFIX = "__loc__";
let NAVIGATE = null; // (tab, key) => void, assigned at boot

function locationBySlug(data, slugName) {
  return arr(data && data.locations).find((loc) => loc && loc.slug === slugName) || null;
}
/* Checkoff key for an item on a location page: place:<slug>/<item-id>. */
function placeItemKey(locSlug, entry, i) {
  const isObj = entry && typeof entry === "object";
  const id = isObj && has(entry.id) ? String(entry.id) : String((isObj && entry.name) || entry || i);
  return "place:" + locSlug + "/" + slug(id);
}
/* Every route step, flattened across acts, in list order. */
function routeSteps(data) {
  const out = [];
  arr(data && data.route).forEach((block) => {
    arr(block && block.steps).forEach((step) => { if (step) out.push({ act: block.act, step: step }); });
  });
  return out;
}
function stepLabel(step, fallback) {
  return has(step.step) ? String(step.step) : String(fallback);
}
/* A button that opens another location page, or plain text when the slug is unknown. */
function locationLink(data, slugName, label) {
  const loc = locationBySlug(data, slugName);
  const text = label || (loc ? loc.name : slugName);
  if (!loc) return h("span", { class: "li-strong" }, text);
  const btn = h("button", { class: "loc-link", type: "button", title: "Open " + loc.name }, text);
  btn.addEventListener("click", () => { if (NAVIGATE) NAVIGATE("locations", LOC_PREFIX + loc.slug); });
  return btn;
}
function curseChip(level) {
  if (!has(level)) return null;
  const v = String(level).toLowerCase();
  const text = v === "none" ? "(no curse)" : v === "deep" ? "(deep curse)" : v === "light" ? "(curse: torchlight is enough)" : "(" + String(level) + ")";
  return h("span", { class: "curse-chip curse-" + v }, text);
}

/* One stop. `entry` is { act, step } from routeSteps(); `index` is its position. */
function routeStepNode(data, entry, index, opts) {
  const step = entry.step;
  const showLocation = !(opts && opts.hideLocation);
  return h("li", { class: "route-step" + (has(step.location) ? "" : " route-step-plain") },
    h("div", { class: "route-step-head" },
      h("span", { class: "route-step-n" }, stepLabel(step, index + 1)),
      showLocation && has(step.location) ? locationLink(data, step.location) : null,
      has(step.title) ? h("span", { class: "route-step-title" }, step.title) : null
    ),
    has(step.do) ? h("div", { class: "route-step-do" }, richText(step.do)) : null,
    has(step.warn) ? h("div", { class: "route-warn" }, h("span", { class: "route-warn-k" }, "Warn"), " " + step.warn) : null,
    has(step.leave) ? h("div", { class: "route-leave" }, h("span", { class: "route-leave-k" }, "Then"), " " + step.leave) : null
  );
}

function routeCutoffs(rows) {
  return h("div", { class: "route-cutoffs" }, arr(rows).map((c) => h("div", { class: "callout warn" },
    h("span", { class: "callout-k" }, c.name || c.what || "Cutoff"),

      h("div", null, has(q.wiki) ? wikiPageLink(String(q.wiki), { class: "li-strong" }, q.name) : h("span", { class: "li-strong" }, q.name)),
      has(q.steps) ? h("div", { class: "li-meta" }, richText(q.steps)) : null,
      has(q.outcome) ? h("div", { class: "li-meta" }, h("span", { class: "li-strong" }, "Outcome: "), q.outcome) : null,

function navEntries(data, tab) {
  if (tab === "loot") {
    return (Array.isArray(data.loot_guide) ? data.loot_guide : []).map((a) => ({
      key: "__loot" + a.act + "__",
      label: "Act " + a.act,
      sub: a.areas.length + " areas",
    }));
  }
  if (tab === "ratings") {
    const r = data.ratings || {};
    const entries = [{ key: RATE_PREFIX, label: "Overview", sub: "Scale · coverage · lists read" }];
    arr(r.slots).forEach((slot) => entries.push({
      key: RATE_PREFIX + slot.slot,
      label: slot.slot,
      sub: slot.count + " rated",
      group: "By item type",
    }));
    return entries;
  }
  if (tab === "locations") {
    const entries = [];
    if (arr(data.route).length) entries.push({ key: LOC_PREFIX, label: "Route", sub: "Every stop in order · cutoffs · gold" });
    const steps = routeSteps(data);
    arr(data.locations).forEach((loc) => {
      const stops = [];
      steps.forEach((entry, i) => { if (entry.step.location === loc.slug) stops.push(stepLabel(entry.step, i + 1)); });
      entries.push({
        key: LOC_PREFIX + loc.slug,
        label: loc.name,
        sub: stops.length ? "Stop " + stops.join(" · ") : (loc.region || ""),
        group: has(loc.act) ? "Act " + loc.act : "Locations",
      });
    });
    return entries;
  }
  if (tab === "tadpole") {
    const t = data.tadpole || {};
    const entries = [{ key: "__tad__", label: "Overview & order", sub: "Mechanics · carrier · order" }];
    arr(t.characters).forEach((c) => entries.push({ key: "__tad__" + c.name, label: c.name, sub: c.short || "", group: "By character" }));
    return entries;
  }
  // Party: Overview + Proficiencies are the top of the party area, then the
  // four characters grouped beneath a "Characters" sub-heading.
  const entries = [{ key: "__overview__", label: "Overview", sub: "Roster · synergies · progression" }];
  if (data.proficiencies && data.proficiencies.characters) entries.push({ key: "__proficiencies__", label: "Proficiencies", sub: "Skill coverage" });
  Object.keys(data.characters || {}).forEach((name) => {
    const builds = data.characters[name];
    const primary = builds.find((b) => b.is_primary) || builds[0];
    entries.push({ key: name, label: name, sub: (primary && primary.class) || "", group: "Characters" });
  });
  return entries;
}

function buildNav(onSelect) {
  const list = document.getElementById("nav-list");
  const heading = document.getElementById("nav-heading");
  let buttons = [];

  // The keydown handler is attached once; it operates on the live `buttons`
  // array, which is rebuilt each time the active top tab changes.
  list.addEventListener("keydown", (ev) => {
    const idx = buttons.indexOf(document.activeElement);
    if (idx < 0) return;
    let next = -1;
    if (ev.key === "ArrowDown" || ev.key === "ArrowRight") next = (idx + 1) % buttons.length;
    else if (ev.key === "ArrowUp" || ev.key === "ArrowLeft") next = (idx - 1 + buttons.length) % buttons.length;
    else if (ev.key === "Home") next = 0;
    else if (ev.key === "End") next = buttons.length - 1;
    // Enter/Space activation is left to the native <button> to avoid double-firing.
    if (next >= 0) {
      ev.preventDefault();
      buttons.forEach((b, j) => (b.tabIndex = j === next ? 0 : -1));
      buttons[next].focus();
    }
  });

  return {
    render(entries, tabLabel) {
      list.innerHTML = "";
      buttons = [];
      if (heading) heading.textContent = tabLabel;
      let lastGroup = null;
      entries.forEach((entry) => {
        if (entry.group && entry.group !== lastGroup) {
          lastGroup = entry.group;
          list.appendChild(h("li", { class: "nav-group-h", role: "presentation" }, entry.group));
        }
        const btn = h(
          "button",
          { class: "nav-item" + (entry.group ? " nav-item-sub" : ""), type: "button", "data-key": entry.key, tabindex: "-1" },
          h(
            "span",
            { class: "nav-label" },
            h("span", { class: "nav-name" }, entry.label),
            entry.sub ? h("span", { class: "nav-sub" }, entry.sub) : null
          )
        );
        btn.addEventListener("click", () => onSelect(entry.key));
        buttons.push(btn);
        list.appendChild(h("li", null, btn));
      });
      // Ensure exactly one roving tab stop exists.
      if (buttons.length) buttons[0].tabIndex = 0;
    },
    setActive(key) {
      let found = false;
      buttons.forEach((b) => {
        const on = b.getAttribute("data-key") === key;
        if (on) { b.setAttribute("aria-current", "page"); found = true; }
        else b.removeAttribute("aria-current");
        // Keep the roving tab stop on the selected item (mouse clicks included).
        b.tabIndex = on ? 0 : -1;
      });
      // If the active key isn't in this list, keep the first item focusable.
      if (!found && buttons.length) buttons[0].tabIndex = 0;
    },
  };
}

/* ---------------- Top-level tabs (Party / Tadpole / Loot / Ratings) ----------------
   `defs` comes from the caller because Ratings only exists once
   tools/build_ratings_page.py has written content/ratings.md. */
const TAB_LABELS = { party: "Party", tadpole: "Tadpole", loot: "Loot", locations: "Locations", ratings: "Ratings" };
function buildTopTabs(onActivate, defs) {
  const host = document.getElementById("top-tabs");
  const tabs = [];
  defs.forEach((d) => {
    const tab = h(
      "button",
      {
        class: "toptab",
        role: "tab",
        type: "button",
        id: "toptab-" + d.id,
        "data-tab": d.id,
        "aria-selected": "false",
        "aria-controls": "main-content",
        tabindex: "-1",
      },
      d.label
    );
    tab.addEventListener("click", () => onActivate(d.id, true));
    tabs.push(tab);
    host.appendChild(tab);
  });

  host.addEventListener("keydown", (ev) => {
    const cur = tabs.findIndex((t) => t.getAttribute("aria-selected") === "true");
    let next = -1;
    if (ev.key === "ArrowRight" || ev.key === "ArrowDown") next = (cur + 1) % tabs.length;
    else if (ev.key === "ArrowLeft" || ev.key === "ArrowUp") next = (cur - 1 + tabs.length) % tabs.length;
    else if (ev.key === "Home") next = 0;
    else if (ev.key === "End") next = tabs.length - 1;
    if (next >= 0) {
      ev.preventDefault();
      onActivate(defs[next].id, true);
    }
  });

  return {
    setActive(id) {
      tabs.forEach((t) => {
        const on = t.getAttribute("data-tab") === id;
        t.setAttribute("aria-selected", String(on));
        t.tabIndex = on ? 0 : -1;
      });
      // Point the shared tabpanel back at the active tab so the
      // tab/tabpanel relationship is complete for screen readers.
      const panel = document.getElementById("main-content");
      if (panel) panel.setAttribute("aria-labelledby", "toptab-" + id);
    },
  };
}

/* ---------------- Boot ---------------- */
(async function init() {
  applyTheme(currentTheme());
  let data;
  try {
    data = await loadData();
  } catch (e) {
    const c = document.getElementById("main-content");
    if (c)
      c.innerHTML =
        '<div class="sec"><h3 class="sec-h">Can’t reach the guide server</h3>' +
        "<p>This page is served by the local <code>bg3</code> server. Start it with " +
        '<code>cargo run</code>, then open <a href="/">http://127.0.0.1:8787</a>.</p></div>';
    return;
  }
  await loadProgress();
  buildItemLinks(data);
  reconcileLinkedProgress();
  renderHeader(data.meta || {});

  const content = document.getElementById("main-content");
  let nav, topTabs;
  let booted = false;
  let activeTab = "party";
  // Remember the last sub-view visited within each top tab.
  const lastKey = { party: "__overview__", tadpole: "__tad__", loot: null, locations: LOC_PREFIX, ratings: RATE_PREFIX };

  function renderContent(key, focusContent) {
    // The teardown and rebuild below scroll the window around on their own; park
    // the recorder until the new view is in place so it can't clobber an offset.
    CURRENT_VIEW = null;
    content.innerHTML = "";
    if (key === "__overview__") content.appendChild(renderOverview(data.party || {}));
    else if (key === "__proficiencies__") content.appendChild(renderProficiencies(data.proficiencies || {}));
    else if (key === "__tad__") content.appendChild(renderTadpoleOverview(data.tadpole || {}));
    else if (key.indexOf("__tad__") === 0) content.appendChild(renderTadpoleCharacter(data.tadpole || {}, key.slice("__tad__".length)));
    else if (key.indexOf("__loot") === 0) {
      const act = parseInt(key.replace(/[^0-9]/g, ""), 10);
      content.appendChild(renderLoot((data.loot_guide || []).find((x) => x.act === act)));
    }
    else if (key === LOC_PREFIX) content.appendChild(renderRoute(data));
    else if (key.indexOf(LOC_PREFIX) === 0) content.appendChild(renderLocation(data, key.slice(LOC_PREFIX.length)));
    else if (key === RATE_PREFIX) content.appendChild(renderRatingsOverview(data.ratings || {}));
    else if (key.indexOf(RATE_PREFIX) === 0) content.appendChild(renderRatingsSlot(data.ratings || {}, key.slice(RATE_PREFIX.length), data));
    else content.appendChild(renderCharacter(key, data.characters[key]));
    // Move focus into the freshly rendered view so keyboard/screen-reader users
    // land on (and hear) the new content. Skipped on initial render and when the
    // caller will move focus elsewhere (e.g. onto the just-activated top tab).
    if (booted && focusContent) {
      const title = content.querySelector(".view-title") || content;
      title.setAttribute("tabindex", "-1");
      title.focus({ preventScroll: true });
    }
    // Land back where this view was left (0 the first time). Recording resumes
    // here, so the scroll event this fires re-records the offset the browser
    // actually settled on if the new page is too short for the old one.
    CURRENT_VIEW = key;
    window.scrollTo(0, viewScrollTop(key));
    booted = true;
  }

  // Select a sub-nav item within the current top tab.
  function select(key, focusContent) {
    if (focusContent === undefined) focusContent = true;
    lastKey[activeTab] = key;
    renderContent(key, focusContent);
    nav.setActive(key);
  }

  // In-page links between views (a route stop to its location page) land here.
  // Swapping the top tab by hand avoids activateTab's render of the remembered
  // sub-view, which select() would immediately replace.
  NAVIGATE = (tab, key) => {
    if (activeTab !== tab) {
      activeTab = tab;
      topTabs.setActive(tab);
      nav.render(navEntries(data, tab), TAB_LABELS[tab] || "Party");
    }
    select(key, true);
  };

  // Activate a top tab: swap the sidebar sub-nav and show the remembered
  // (or default) sub-view for that tab.
  function activateTab(tab, focusTab) {
    activeTab = tab;
    topTabs.setActive(tab);
    const entries = navEntries(data, tab);
    nav.render(entries, TAB_LABELS[tab] || "Party");
    let key = lastKey[tab];
    if (!key || !entries.some((e) => e.key === key)) key = entries.length ? entries[0].key : null;
    if (key) select(key, !focusTab);
    // For keyboard/click tab activation, keep focus on the tab itself.
    if (focusTab) {
      const el = document.getElementById("toptab-" + tab);
      if (el) el.focus();
    }
  }

  const tabDefs = [
    { id: "party", label: TAB_LABELS.party },
    { id: "tadpole", label: TAB_LABELS.tadpole },
    { id: "loot", label: TAB_LABELS.loot },
  ];
  // No location files, no Locations tab; likewise no generated ratings file, no
  // Ratings tab — the rest of the guide is unaffected either way.
  if (arr(data.locations).length) tabDefs.push({ id: "locations", label: TAB_LABELS.locations });
  if (data.ratings && arr(data.ratings.slots).length) tabDefs.push({ id: "ratings", label: TAB_LABELS.ratings });

  nav = buildNav(select);
  topTabs = buildTopTabs(activateTab, tabDefs);
  activateTab("party", false);
})();
</script>
</body>
</html>
