<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BG3 Party Plan</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231a1a1a'/%3E%3Ctext x='8' y='46' font-family='monospace' font-size='34' font-weight='700' fill='%23f7f6f2'%3Eb3%3C/text%3E%3C/svg%3E">
<script>
  /* Set theme before first paint to avoid a flash of the wrong theme. */
  (function () {
    try {
      var stored = null;
      try { stored = localStorage.getItem("bg3-theme"); } catch (e) {}
      var t = (stored === "light" || stored === "dark")
        ? stored
        : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
<style>
  /* See docs/ui-style-guide.md. Every colour, size and space below is a token from
     section 1; a literal value anywhere else is a defect. */

  /* ---- Tokens ---- */
  :root {
    --font: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    --fs: 16px;
    --fs-sm: 13px;
    --fs-lg: 20px;
    --lh: 1.5rem;
    --lh-half: .75rem;
    --measure: 110ch;
    --prose: 80ch;
    --nav-w: 26ch;
    --gutter: 4ch;
    --page-w: calc(var(--nav-w) + var(--gutter) * 2 + var(--measure) + 1px);

    --bg: #f7f6f2;
    --ink: #1a1a1a;
    --muted: #5c5c5c;
    --rule: #c8c6c0;
    --accent: #1f4e9c;
    --warn: #a04b00;
    --tier-s: #8a6400;
    --tier-a: #1f7a3c;
    --tier-b: #2f5fb3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --ink: #e8e6e0; --muted: #9c9a93; --rule: #3b3a37;
      --accent: #8ab0ea; --warn: #f0a860; --tier-s: #e0b04a; --tier-a: #6cc48a; --tier-b: #86aaf0;
    }
  }
  html[data-theme="light"] {
    --bg: #f7f6f2; --ink: #1a1a1a; --muted: #5c5c5c; --rule: #c8c6c0;
    --accent: #1f4e9c; --warn: #a04b00; --tier-s: #8a6400; --tier-a: #1f7a3c; --tier-b: #2f5fb3;
  }
  html[data-theme="dark"] {
    --bg: #151514; --ink: #e8e6e0; --muted: #9c9a93; --rule: #3b3a37;
    --accent: #8ab0ea; --warn: #f0a860; --tier-s: #e0b04a; --tier-a: #6cc48a; --tier-b: #86aaf0;
  }

  /* ---- Font ---- */
  @font-face {
    font-family: "JetBrains Mono";
    src: url("fonts/JetBrainsMono-Regular.woff2") format("woff2");
    font-weight: 400; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: "JetBrains Mono";
    src: url("fonts/JetBrainsMono-Bold.woff2") format("woff2");
    font-weight: 700; font-style: normal; font-display: swap;
  }

  /* ---- Base ---- */
  * { box-sizing: border-box; }
  html { font-size: var(--fs); }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font); font-size: var(--fs); line-height: var(--lh);
    background: var(--bg); color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  a { color: var(--accent); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; }
  a:hover { color: var(--ink); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: left; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  h1, h2, h3, h4 { margin: 0; font-size: inherit; font-weight: 700; line-height: inherit; }
  em { font-style: normal; font-weight: 700; }
  code { font: inherit; }
  p { margin: 0 0 var(--lh-half); max-width: var(--prose); }
  .muted { color: var(--muted); }
  .note { font-size: var(--fs-sm); line-height: 1.5; color: var(--muted); margin: 0 0 var(--lh-half); max-width: var(--prose); }
  .pre { white-space: pre-wrap; }
  a.wiki-item, a.rate-at { color: inherit; text-decoration-color: var(--rule); }
  a.wiki-item:hover, a.rate-at:hover { color: var(--accent); text-decoration-color: currentColor; }
  a.wiki-item::after, a.rate-at::after { content: "\2197"; margin-left: .25ch; color: var(--accent); }
  .wiki-item-group { display: inline; }
  .skip-link {
    position: absolute; left: -999px; top: 0; z-index: 100;
    background: var(--bg); color: var(--accent); border: 1px solid var(--ink); padding: 0 1ch;
  }
  .skip-link:focus { left: 1ch; }

  /* ---- Header and top tabs ---- */
  header.app { border-bottom: 1px solid var(--rule); }
  .header-inner, .toptabs-bar { max-width: var(--page-w); margin: 0 auto; padding: 0 var(--gutter); }
  .header-inner { padding-top: var(--lh); }
  .masthead { display: flex; align-items: baseline; gap: 0 2ch; flex-wrap: wrap; }
  .masthead h1 { font-size: var(--fs-lg); }
  .app-version { color: var(--muted); }
  .meta-run { color: var(--muted); font-size: var(--fs-sm); flex: 1 1 auto; }
  .meta-run a { color: var(--accent); }
  .meta-run a:hover { color: var(--ink); }
  .theme-toggle { color: var(--muted); margin-left: auto; }
  .theme-toggle:hover { color: var(--ink); }
  details.assumptions { font-size: var(--fs-sm); line-height: 1.5; color: var(--muted); margin-top: .25rem; }
  details.assumptions summary { cursor: pointer; list-style: none; display: inline-block; }
  details.assumptions summary::-webkit-details-marker { display: none; }
  details.assumptions summary::before { content: "+ "; }
  details.assumptions[open] summary::before { content: "- "; }
  details.assumptions summary:hover { color: var(--ink); }
  details.assumptions .assume-body { max-width: var(--prose); }
  details.assumptions .assume-body p { margin: .25rem 0 0; max-width: none; }
  .toptabs { display: flex; gap: 0 3ch; flex-wrap: wrap; margin-top: var(--lh-half); }
  .toptab { color: var(--muted); font-weight: 700; padding-bottom: calc(var(--lh-half) - 2px); border-bottom: 2px solid transparent; }
  .toptab:hover { color: var(--ink); }
  .toptab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }

  /* ---- Layout ---- */
  .layout {
    max-width: var(--page-w); margin: 0 auto; padding: 0 var(--gutter);
    display: grid; grid-template-columns: var(--nav-w) minmax(0, 1fr); align-items: start;
  }
  .sidebar {
    position: sticky; top: 0; max-height: 100vh; overflow-y: auto;
    padding: var(--lh) var(--gutter) var(--lh) 0;
  }
  .sidebar h2 { font-size: var(--fs-sm); line-height: var(--lh); text-transform: uppercase; color: var(--muted); }
  .nav-list { list-style: none; margin: 0; padding: 0; }
  .nav-group-h {
    font-size: var(--fs-sm); line-height: var(--lh); text-transform: uppercase;
    color: var(--muted); font-weight: 700; margin-top: var(--lh-half);
  }
  .nav-item { display: block; width: 100%; position: relative; padding-left: 2ch; color: var(--ink); }
  .nav-item:hover .nav-name { color: var(--accent); }
  .nav-item[aria-current="page"] { color: var(--accent); font-weight: 700; }
  .nav-item[aria-current="page"]::before { content: ">"; position: absolute; left: 0; }
  .nav-label { display: block; min-width: 0; }
  .nav-name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-sub {
    display: block; font-size: var(--fs-sm); line-height: 1.5; color: var(--muted); font-weight: 400;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  main.content {
    min-width: 0; border-left: 1px solid var(--rule);
    padding: var(--lh) 0 calc(var(--lh) * 2) var(--gutter);
  }

  /* ---- Page head, sections, prose ---- */
  .page-head { margin-bottom: var(--lh); }
  .page-head .view-sub { margin-bottom: 0; }
  .view-title { font-size: var(--fs-lg); }
  .view-title + .sec, .view-title + .subhead { margin-top: var(--lh); }
  .view-sub { color: var(--muted); margin: 0 0 var(--lh); }
  .subgrid { display: grid; gap: 0 var(--gutter); }
  .contents { font-size: var(--fs-sm); line-height: 1.5; color: var(--muted); margin: 0 0 var(--lh); max-width: none; }
  .contents a { color: var(--accent); text-decoration: none; }
  .contents a:hover { text-decoration: underline; }
  .sec { margin: 0 0 var(--lh); }
  .sec-h { text-transform: uppercase; border-bottom: 1px solid var(--rule); margin-bottom: var(--lh-half); }
  .subhead { margin: var(--lh) 0 var(--lh-half); }
  .sec-h + .subhead, .subhead:first-child { margin-top: 0; }
  .section-hint { font-size: var(--fs-sm); line-height: 1.5; color: var(--muted); margin: 0 0 var(--lh-half); max-width: var(--prose); }
  .prose { margin: 0 0 var(--lh-half); max-width: var(--prose); }
  .prose:last-child { margin-bottom: 0; }
  ul.prose-list, ul.clean { list-style: none; margin: 0 0 var(--lh-half); padding: 0; max-width: var(--prose); }
  ul.prose-list:last-child, ul.clean:last-child { margin-bottom: 0; }
  ul.prose-list > li, ul.clean > li { position: relative; padding-left: 2ch; }
  ul.prose-list > li::before, ul.clean > li::before { content: "-"; position: absolute; left: 0; color: var(--muted); }
  .li-strong { font-weight: 700; }
  .li-meta { font-size: var(--fs-sm); line-height: 1.5; color: var(--muted); }
  .li-meta .prose, .li-meta ul.prose-list { font-size: inherit; margin: 0; }
  .glance { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 0 2ch; margin: 0 0 var(--lh); padding: 0; list-style: none; max-width: var(--prose); }
  .glance-item { display: contents; }
  .glance-k { font-size: var(--fs-sm); line-height: var(--lh); text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .tag-list { max-width: var(--prose); }
  .tag { font-weight: 700; }
  .callout { border-left: 2px solid var(--rule); padding-left: 2ch; margin: 0 0 var(--lh-half); max-width: var(--prose); }
  .callout-k { display: block; font-size: var(--fs-sm); line-height: var(--lh); text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .callout.warn .callout-k { color: var(--warn); }
  .callout .prose:last-child, .callout ul.prose-list:last-child { margin-bottom: 0; }
  .verify { color: var(--warn); font-size: var(--fs-sm); white-space: nowrap; }

  /* ---- Tables ---- */
  .table-wrap { overflow-x: auto; margin: 0 0 var(--lh-half); }
  .table-wrap:last-child { margin-bottom: 0; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; vertical-align: bottom; white-space: nowrap;
    font-size: var(--fs-sm); line-height: 1.5; text-transform: uppercase; color: var(--muted);
    padding: 0 1ch .25rem; border-bottom: 1px solid var(--rule);
  }
  tbody td, tbody th { padding: .25rem 1ch; border-bottom: 1px solid var(--rule); vertical-align: top; text-align: left; }
  tbody th[scope="row"] { font-weight: 700; white-space: nowrap; }
  thead th:first-child, tbody td:first-child, tbody th:first-child { padding-left: 0; }
  thead th:last-child, tbody td:last-child { padding-right: 0; }
  .num { text-align: right; white-space: nowrap; }
  .cell-strong { font-weight: 700; }
  tr.total-row td { font-weight: 700; border-top: 1px solid var(--ink); border-bottom: 0; }
  th.ck-col, td.ck-col { width: 3ch; white-space: nowrap; }
  .who-chip { white-space: nowrap; }

  /* ---- Checklist and checkbox ---- */
  .ck-wrap { position: relative; display: inline-block; flex: 0 0 auto; cursor: pointer; white-space: nowrap; }
  .ck-wrap .ck { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); }
  .ck-box::before { content: "[ ]"; color: var(--muted); }
  .ck-wrap:hover .ck-box::before { color: var(--ink); }
  .ck:checked + .ck-box::before { content: "[x]"; color: var(--accent); font-weight: 700; }
  .ck:focus-visible + .ck-box { outline: 2px solid var(--accent); outline-offset: 2px; }
  li.ck-li:has(> .ck-wrap .ck:checked), tr:has(> .ck-col .ck:checked) { color: var(--muted); }
  ul.checklist { max-width: none; }
  ul.checklist > li.ck-li { display: flex; align-items: baseline; gap: 1ch; padding-left: 0; }
  ul.checklist > li.ck-li::before { display: none; }
  .ck-spacer { display: inline-block; width: 3ch; flex: 0 0 auto; }

  /* ---- Badges and tokens ---- */
  .pick-badge, .open-pick, .spell-plan-badge, .item-chip, .badge, .card-count {
    font-size: var(--fs-sm); color: var(--muted); font-weight: 400; white-space: nowrap;
  }
  .item-tier { font-size: var(--fs-sm); font-weight: 700; white-space: nowrap; cursor: help; color: var(--muted); }
  .item-tier.tier-s { color: var(--tier-s); }
  .item-tier.tier-a { color: var(--tier-a); }
  .item-tier.tier-b { color: var(--tier-b); }
  .item-tier.tier-c { color: var(--muted); }
  .item-tier.tier-d { color: var(--warn); }
  .item-tier.tier-rank { color: var(--accent); }
  .item-bis-star { color: var(--accent); font-weight: 700; }

  /* ---- Tooltip ---- */
  .item-tip-wrap { position: relative; display: inline-flex; align-items: baseline; min-width: 0; max-width: 100%; }
  .item-details { font-size: var(--fs-sm); color: var(--muted); margin-left: .5ch; cursor: help; flex: 0 0 auto; }
  .item-details:hover { color: var(--ink); }
  .item-name {
    color: inherit; font-weight: 700; border-bottom: 1px dotted var(--rule);
    max-width: 100%; overflow-wrap: anywhere; cursor: help;
  }
  a.item-name { display: inline; text-decoration: none; cursor: pointer; }
  .item-name.wiki-item-group { display: inline-block; }
  .item-name .wiki-item { text-decoration: none; }
  .item-name:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .item-tip {
    position: fixed; z-index: 1000; left: 16px; top: 16px;
    width: min(390px, calc(100vw - 32px)); padding: var(--lh-half) 1.5ch;
    color: var(--ink); background: var(--bg); border: 1px solid var(--ink);
    font-size: var(--fs-sm); line-height: 1.5; font-weight: 400; text-transform: none; text-align: left;
    visibility: hidden; pointer-events: none;
  }
  .item-tip-k { display: block; margin-bottom: .25rem; color: var(--muted); text-transform: uppercase; font-weight: 700; }
  .tip-content { display: grid; gap: .25rem; }
  .tip-summary { display: block; }
  .tip-facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 0 2ch; }
  .tip-fact { display: contents; }
  .tip-fact-k { color: var(--muted); text-transform: uppercase; white-space: nowrap; }
  .tip-fact-v { min-width: 0; }
  .item-tip-wrap:hover .item-tip,
  .item-tip-wrap:focus-within .item-tip,
  .item-tip-wrap.tip-pinned .item-tip,
  .level-choice:hover > .item-tip,
  .level-choice:focus-within > .item-tip,
  .level-choice:focus-visible > .item-tip { visibility: visible; }
  .item-tip-wrap.tip-dismissed .item-tip,
  .level-choice.tip-dismissed > .item-tip { visibility: hidden !important; }
  .has-hover { border-bottom: 1px dotted var(--rule); cursor: help; }

  /* ---- Leveling ---- */
  .level-table { min-width: 90ch; }
  .level-number { font-weight: 700; }
  /* Column hints, so one long class string cannot starve the gains and picks columns. */
  .level-number-cell { width: 4ch; }
  .level-class-cell { width: 18ch; }
  .level-gains-cell { width: 28ch; }
  .level-gain-list { list-style: none; margin: 0; padding: 0; }
  .level-gain-list li { position: relative; padding-left: 2ch; }
  .level-gain-list li::before { content: "-"; position: absolute; left: 0; color: var(--muted); }
  .level-choice-list { display: grid; gap: .25rem; min-width: 36ch; }
  .level-choice { display: grid; grid-template-columns: 13ch minmax(0, 1fr) auto; column-gap: 1ch; align-items: baseline; }
  .level-choice-category { font-size: var(--fs-sm); line-height: var(--lh); text-transform: uppercase; color: var(--muted); overflow-wrap: anywhere; }
  .level-choice-body { display: flex; flex-wrap: wrap; gap: 0 1ch; align-items: baseline; min-width: 0; }
  .level-choice-recommendation { font-weight: 700; overflow-wrap: anywhere; }
  .detail-cue { font-size: var(--fs-sm); color: var(--muted); }
  .level-choice:hover .detail-cue, .level-choice:focus-visible .detail-cue { color: var(--ink); }
  .level-legend { display: flex; flex-wrap: wrap; gap: 0 3ch; font-size: var(--fs-sm); line-height: 1.5; color: var(--muted); margin: 0 0 var(--lh-half); }
  .level-legend-item { display: inline-flex; gap: 1ch; }

  /* ---- Itemization ---- */
  .itemization-note { font-size: var(--fs-sm); line-height: 1.5; color: var(--muted); margin: 0 0 var(--lh-half); max-width: var(--prose); }
  .item-rows { display: grid; grid-template-columns: repeat(auto-fit, minmax(30ch, 1fr)); gap: var(--lh) var(--gutter); align-items: start; }
  .item-row { min-width: 0; }
  .item-row-label { text-transform: uppercase; margin: 0 0 var(--lh-half); }
  .item-slot { min-width: 0; margin: 0 0 var(--lh-half); }
  .card-heading { display: flex; gap: 1ch; align-items: baseline; font-size: var(--fs-sm); line-height: var(--lh); text-transform: uppercase; color: var(--muted); }
  .slot-part + .slot-part { margin-top: .25rem; }
  .slot-part-label { font-size: var(--fs-sm); line-height: 1.5; text-transform: uppercase; color: var(--muted); }
  .item-body { min-width: 0; flex: 1; }
  .item-head { display: flex; align-items: baseline; gap: 0 1ch; flex-wrap: wrap; min-width: 0; }
  li.ck-li.item-empty .item-name { color: var(--muted); font-weight: 400; border-bottom: 0; cursor: default; }
  .item-empty-icon { color: var(--muted); flex: 0 0 auto; }
  .slot-arrow, .prog-arrow { color: var(--muted); }
  .slot-arrow { padding-left: 4ch; }
  .flex-label { font-weight: 700; color: var(--muted); cursor: help; }
  ul.flex-options { margin: 0; padding-left: 1ch; border-left: 1px solid var(--rule); max-width: none; }
  ul.flex-options > li.ck-li.flex-option { display: flex; flex-wrap: wrap; gap: 0 1ch; align-items: baseline; padding-left: 0; }
  ul.flex-options > li::before { display: none; }
  .prog-step { display: flex; gap: 0 1ch; flex-wrap: wrap; align-items: baseline; color: var(--muted); }
  .prog-step.prog-latest { color: var(--ink); font-weight: 700; }

  /* ---- Ability scores ---- */
  .ability-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--lh-half) 2ch; align-items: start; margin: 0 0 var(--lh-half); }
  .ability-grid:last-child, .statblock:last-child { margin-bottom: 0; }
  .ability-card { min-width: 0; }
  .ability-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1ch; border-bottom: 1px solid var(--rule); }
  .ability-k { font-size: var(--fs-sm); line-height: var(--lh); text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .ability-final { font-weight: 700; }
  ul.ability-steps { margin: 0; padding: 0; max-width: none; }
  ul.ability-steps > li { padding-left: 0; }
  ul.ability-steps > li::before { display: none; }
  .ability-step { display: flex; gap: 0 .5ch; flex-wrap: wrap; align-items: baseline; font-size: var(--fs-sm); line-height: 1.5; color: var(--muted); }
  .ability-step.ability-latest { color: var(--ink); font-weight: 700; }
  .ability-mod { min-width: 3ch; text-align: right; }
  .statblock { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0 2ch; margin: 0 0 var(--lh-half); }
  .stat { border-top: 1px solid var(--rule); }
  .stat-k { font-size: var(--fs-sm); line-height: var(--lh); text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .stat-v { font-weight: 700; }
  .stat-base { text-decoration: line-through; color: var(--muted); font-weight: 400; margin-right: .5ch; }

  /* ---- Facts ---- */
  .facts { display: grid; grid-template-columns: fit-content(24ch) minmax(0, 1fr); gap: 0 2ch; margin: 0 0 var(--lh-half); }
  .facts:last-child { margin-bottom: 0; }
  .fact { display: contents; }
  .fact dt { font-size: var(--fs-sm); line-height: var(--lh); text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .fact dd { margin: 0; min-width: 0; }
  .fact dd .note { display: block; margin: 0; }

  /* ---- Spells ---- */
  .spell-list-note { font-size: var(--fs-sm); line-height: 1.5; color: var(--muted); margin: 0 0 var(--lh-half); max-width: var(--prose); }
  .spell-plan-legend { display: flex; flex-wrap: wrap; gap: 0 1ch; align-items: baseline; font-size: var(--fs-sm); line-height: 1.5; color: var(--muted); }
  .spell-plan-legend + .spell-plan-legend { margin-top: 0; }
  .spell-plan-legend:last-of-type { margin-bottom: var(--lh-half); }
  .spell-plan-legend .item-tier { cursor: default; }
  .spell-level-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(30ch, 1fr)); gap: var(--lh-half) var(--gutter); align-items: start; }
  .spell-entry-main { display: inline-flex; flex-wrap: wrap; gap: 0 1ch; align-items: baseline; min-width: 0; }
  .spell-checklist .spell-alternative .item-name { font-weight: 400; }

  /* ---- Meters and nova ---- */
  .meters { display: grid; gap: 0; }
  .meter { display: flex; gap: 0 1ch; align-items: baseline; flex-wrap: wrap; }
  .meter-k { min-width: 14ch; text-transform: capitalize; }
  .meter-bar { white-space: pre; }
  .meter-fill { color: var(--ink); }
  .meter-rest { color: var(--rule); }
  .meter-v { font-size: var(--fs-sm); color: var(--muted); }
  .nova-config { margin: 0 0 var(--lh-half); }
  .nova-config h4 { margin-bottom: .25rem; }

  /* ---- Sub-tabs ---- */
  .tabs { display: flex; flex-wrap: wrap; align-items: baseline; margin: 0 0 var(--lh-half); }
  .tab { color: var(--muted); }
  .tab + .tab::before { content: "\00B7"; display: inline-block; margin: 0 1ch; color: var(--muted); font-weight: 400; text-decoration: none; }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--accent); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
  .tab .badge { margin-left: .5ch; }

  /* ---- Loot ---- */
  .loot-table td, .loot-table th { vertical-align: top; }
  .loot-events-h { margin: var(--lh) 0 var(--lh-half); }

  /* ---- Proficiencies ---- */
  .prof-table th[scope="col"] { text-align: center; }
  .prof-table th[scope="col"]:first-child { text-align: left; }
  .prof-table td.prof-abil { text-align: center; color: var(--muted); font-size: var(--fs-sm); }
  .prof-table td.prof-cell { text-align: center; font-weight: 700; min-width: 5ch; }
  .prof-table td.prof-exp { color: var(--accent); }
  .prof-table td.prof-yes { color: var(--ink); }
  .prof-table td.prof-half { color: var(--muted); font-weight: 400; }
  .prof-table td.prof-no { color: var(--rule); font-weight: 400; }
  .prof-table tr.prof-saves td.prof-savecell { text-align: center; font-size: var(--fs-sm); }
  .prof-table tr.prof-saves td, .prof-table tr.prof-saves th { border-bottom: 1px solid var(--ink); }

  /* ---- Ratings ---- */
  .rate-tier { margin: 0 0 var(--lh); }
  .rate-tier:last-child { margin-bottom: 0; }
  .rate-tier-h { display: flex; align-items: baseline; gap: 0 1ch; border-bottom: 1px solid var(--rule); margin: 0 0 var(--lh-half); }
  .rate-tier-h .item-tier { font-size: inherit; cursor: default; }
  .rate-tier-what { font-size: var(--fs-sm); line-height: 1.5; color: var(--muted); flex: 1; min-width: 0; }
  ul.rate-list { list-style: none; margin: 0; padding: 0; }
  li.rate-row { margin: 0 0 var(--lh-half); }
  li.rate-row:last-child { margin-bottom: 0; }
  .rate-head { display: flex; align-items: baseline; gap: 0 1ch; flex-wrap: wrap; }
  .rate-name { font-weight: 700; }
  .rate-verdict { font-size: var(--fs-sm); line-height: 1.5; color: var(--muted); max-width: var(--prose); }
  .rate-at { white-space: nowrap; margin-left: 1ch; }
  .rate-lists { font-size: var(--fs-sm); line-height: 1.5; color: var(--muted); margin: 0 0 var(--lh-half); }
  .rate-lists a { color: inherit; }

  /* ---- Locations and route ---- */
  .loc-wiki { margin-left: 1ch; font-size: var(--fs-sm); font-weight: 400; }
  .loc-sub { display: flex; align-items: baseline; gap: 0 2ch; flex-wrap: wrap; }
  .curse-chip { color: var(--muted); }
  .curse-chip.curse-deep { color: var(--warn); }
  .loc-summary { margin: var(--lh-half) 0; }
  ol.route-steps { list-style: none; margin: 0 0 var(--lh-half); padding: 0; }
  li.route-step { display: grid; grid-template-columns: 4ch minmax(0, 1fr); column-gap: 1ch; margin: 0 0 var(--lh-half); }
  li.route-step:last-child { margin-bottom: 0; }
  .route-step-n { grid-column: 1; text-align: right; color: var(--muted); font-weight: 700; }
  .route-step-head { grid-column: 2; display: flex; align-items: baseline; gap: 0 1ch; flex-wrap: wrap; }
  .route-step-title { font-weight: 700; }
  .route-step-do, .route-warn, .route-leave, .route-neighbours { grid-column: 2; }
  .route-step-do .prose, .route-step-do ul.prose-list { margin-bottom: 0; }
  .route-warn { color: var(--warn); }
  .route-warn-k, .route-leave-k { font-size: var(--fs-sm); text-transform: uppercase; font-weight: 700; color: var(--muted); }
  .route-warn-k { color: var(--warn); }
  .route-leave, .route-neighbours { font-size: var(--fs-sm); line-height: 1.5; color: var(--muted); }
  .route-neighbours { display: flex; gap: 0 3ch; flex-wrap: wrap; }
  .route-cutoffs { display: grid; gap: var(--lh-half); margin: 0 0 var(--lh-half); }
  .route-cutoffs .callout { margin: 0; }
  button.loc-link { color: var(--accent); font-weight: 700; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; }
  button.loc-link:hover { color: var(--ink); }
  ul.loc-quests > li.loc-quest { margin: 0 0 var(--lh-half); }
  ul.loc-quests > li.loc-quest:last-child { margin-bottom: 0; }
  .loc-route-open { margin: var(--lh-half) 0 0; }
  .pc-block { margin: 0 0 var(--lh-half); }
  .pc-part { margin: .25rem 0 0; }
  .pc-label { font-size: var(--fs-sm); line-height: 1.5; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .pc-part .prose, .pc-part ul.prose-list { margin: 0; }

  /* ---- Responsive ---- */
  @media (min-width: 60rem) {
    .subgrid.two { grid-template-columns: 1fr 1fr; align-items: start; }
  }
  @media (max-width: 60rem) {
    .layout { grid-template-columns: 1fr; padding: 0 2ch; }
    .header-inner, .toptabs-bar { padding-left: 2ch; padding-right: 2ch; }
    .sidebar { position: static; max-height: none; overflow: visible; padding: var(--lh) 0 var(--lh-half); border-bottom: 1px solid var(--rule); }
    .nav-list { display: flex; flex-wrap: wrap; gap: 0 2ch; }
    .nav-item { width: auto; }
    .sidebar h2, .nav-group-h { width: 100%; margin-top: 0; }
    .nav-sub { display: none; }
    main.content { border-left: 0; padding-left: 0; }
    .ability-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .level-table-wrap { overflow: visible; }
    .level-table, .level-table tbody { display: block; min-width: 0; }
    .level-table thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .level-table tbody { display: grid; gap: var(--lh-half); }
    .level-table tbody tr { display: grid; grid-template-columns: 3ch 4ch minmax(0, 1fr); column-gap: 1ch; border-bottom: 1px solid var(--rule); padding-bottom: var(--lh-half); }
    .level-table tbody td { display: block; border: 0; padding: 0; }
    .level-table .level-gains-cell, .level-table .level-recommendations-cell { grid-column: 1 / -1; margin-top: .25rem; }
    .level-table .level-gains-cell::before, .level-table .level-recommendations-cell::before {
      content: attr(data-label); display: block; font-size: var(--fs-sm); line-height: 1.5;
      text-transform: uppercase; color: var(--muted); font-weight: 700;
    }
    .level-choice-list { min-width: 0; }
  }
  @media (max-width: 40rem) {
    .ability-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .statblock { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .facts { grid-template-columns: minmax(0, 1fr); }
    .fact dt { margin-top: .25rem; }
    .level-choice { grid-template-columns: minmax(0, 1fr) auto; }
    .level-choice-category { grid-column: 1 / -1; }
    .view-title { font-size: var(--fs); }
  }

  /* ---- Print ---- */
  @media print {
    :root, html[data-theme="light"], html[data-theme="dark"] {
      --bg: #ffffff; --ink: #000000; --muted: #444444; --rule: #999999;
    }
    .skip-link, .theme-toggle, .sidebar, .toptabs-bar, .tabs, .detail-cue, .item-details,
    .contents, .item-tip, a.wiki-item::after, a.rate-at::after { display: none !important; }
    header.app { border-bottom: 1px solid var(--ink); }
    .layout { display: block; padding: 0; max-width: none; }
    main.content { border-left: 0; padding-left: 0; }
    .table-wrap { overflow: visible; }
    [role="tabpanel"][hidden] { display: block !important; }
    [role="tabpanel"][data-tab-label]::before {
      content: attr(data-tab-label); display: block; margin: var(--lh-half) 0 .25rem;
      font-size: var(--fs-sm); line-height: 1.5; text-transform: uppercase; font-weight: 700; color: var(--muted);
    }
    .sec, li.route-step, .item-slot, .ability-card, li.rate-row { break-inside: avoid; }
  }
</style>
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>
<header class="app">
  <div class="header-inner" id="app-header"></div>
  <div class="toptabs-bar">
    <div class="toptabs" role="tablist" aria-label="Guide sections" id="top-tabs"></div>
  </div>
</header>

<div class="layout">
  <nav class="sidebar" aria-label="Section sub-navigation">
    <h2 id="nav-heading">Party</h2>
    <ul class="nav-list" id="nav-list" role="list" aria-labelledby="nav-heading"></ul>
  </nav>
  <main class="content" id="main-content" role="tabpanel" tabindex="-1"></main>
</div>


<script>
"use strict";

/* ---------------- Data loading ---------------- */
async function loadData() {
  // Served by the local bg3 server, which assembles the plan from content/*.md.
  const res = await fetch("/api/plan", { cache: "no-store" });
  if (!res.ok) throw new Error("GET /api/plan failed: " + res.status);
  return await res.json();
}

/* ---------------- DOM helper ---------------- */
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      const v = attrs[k];
      if (v == null) continue;
      if (k === "class") e.className = v;
      else if (k === "html") e.innerHTML = v;
      else if (k.slice(0, 2) === "on" && typeof v === "function") e.addEventListener(k.slice(2).toLowerCase(), v);
      else e.setAttribute(k, v);
    }
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    e.appendChild(typeof kid === "object" ? kid : document.createTextNode(String(kid)));
  }
  return e;
}

const arr = (v) => (Array.isArray(v) ? v : v == null ? [] : [v]);
const has = (v) => v != null && !(Array.isArray(v) && v.length === 0) && !(typeof v === "string" && v.trim() === "");
const humanize = (s) => String(s).replace(/_/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
const slug = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");

/* ---------------- Linked items (character page ↔ Loot tab) ----------------
   The same piece of gear is listed twice: once on its owner's Itemization tab
   and once in the Loot tab's area table. Both tick boxes mean the same thing —
   "this is in the party's hands" — so they share one state.

   Checkoff keys stay exactly as they were (progress.json needs no migration):
   instead, every key that names the same item joins a link group, and toggling
   any member writes all of them. Items are matched by name, normalised to shrug
   off the guide's annotations: "Corellon's Grace (levels 2–4 only)" on the
   character page and "Corellon's Grace" in the loot table are one item, as are
   "Hellrider Longbow" / "Hellrider's Longbow" and the first entry of a combined
   loot row like "Caustic Band + Club of Hill Giant Strength". A group is only
   linked if it bridges the two views; a name that appears on one side alone
   keeps its own independent state. */
const ITEM_NAME_SPLIT = /\s\+\s|[\/;,:]|[—–]|→|->|\s-\s|\bor\b|\bthen\b/;
function canonicalItem(label) {
  let s = String(label == null ? "" : label).toLowerCase().replace(/’/g, "'");
  s = s.replace(/\([^)]*\)/g, " ");                                  // "(daily)", "(held over)"
  s = s.split(ITEM_NAME_SPLIT)[0];                                   // combined rows → first item
  s = s.replace(/'s\b/g, "").trim();                                 // "Crusher's Ring" ≡ "Crusher Ring"
  s = s.replace(/^(?:the|a|an)\s+/, "");                             // "The Spellsparkler" ≡ "Spellsparkler"
  s = s.replace(/^(elixirs|arrows|potions|scrolls)\b/, (w) => w.slice(0, -1));
  return s.replace(/[^a-z0-9+]+/g, "-").replace(/^-+|-+$/g, "");
}

/* Key shapes, shared by the renderers and the link builder so the two can't drift. */
function buildKeyRoot(charName, build) {
  return slug(charName || "char") + "/" + slug((build && build.name) || "build");
}
function itemLabel(entry) {
  const isObj = entry && typeof entry === "object";
  return isObj ? entry.item || entry.note || "" : String(entry);
}
function itemEntryId(entry, i) {
  if (entry && typeof entry === "object" && entry.id) return entry.id;
  return slug(itemLabel(entry)).slice(0, 60) || "i" + i;
}
function charItemKey(keyRoot, act, entry, i) {
  return keyRoot ? "item:" + keyRoot + "/" + act + "/" + itemEntryId(entry, i) : null;
}
function lootAreaKey(act, areaName) {
  return "loot:" + act + "/" + slug(areaName);
}
function lootItemKey(areaKey, itemName) {
  return areaKey ? areaKey + "/" + slug(itemName) : null;
}

let ITEM_LINK_OF = Object.create(null);     // checkoff key → canonical item name
let ITEM_LINK_GROUPS = Object.create(null); // canonical item name → [{ key, where, kind }]

function buildItemLinks(data) {
  ITEM_LINK_OF = Object.create(null);
  ITEM_LINK_GROUPS = Object.create(null);
  const add = (canon, key, where, kind) => {
    if (!canon || !key) return;
    const group = ITEM_LINK_GROUPS[canon] || (ITEM_LINK_GROUPS[canon] = []);
    if (group.some((m) => m.key === key)) return;
    group.push({ key: key, where: where, kind: kind });
  };

  const characters = (data && data.characters) || {};
  Object.keys(characters).forEach((name) => {
    arr(characters[name]).forEach((build) => {
      const keyRoot = buildKeyRoot(name, build);
      const it = build.itemization || {};
      Object.keys(it).forEach((act) => {
        arr(it[act]).forEach((entry, i) => {
          add(canonicalItem(itemLabel(entry)), charItemKey(keyRoot, act, entry, i), name, "char");
        });
      });
    });
  });

  arr(data && data.loot_guide).forEach((a) => {
    arr(a.areas).forEach((area) => {
      const areaKey = lootAreaKey(a.act, area.area);
      arr(area.items).forEach((item) => {
        add(canonicalItem(item.name), lootItemKey(areaKey, item.name), "Loot — Act " + a.act, "loot");
      });
    });
  });

  arr(data && data.locations).forEach((loc) => {
    arr(loc && loc.items).forEach((item, i) => {
      if (!item) return;
      add(canonicalItem(item.name), placeItemKey(loc.slug, item, i), loc.name, "place");
    });
  });

  Object.keys(ITEM_LINK_GROUPS).forEach((canon) => {
    const group = ITEM_LINK_GROUPS[canon];
    // Only a group that spans two or more views has anything to keep in step.
    const kinds = {};
    group.forEach((m) => { kinds[m.kind] = true; });
    if (Object.keys(kinds).length < 2) { delete ITEM_LINK_GROUPS[canon]; return; }
    group.forEach((m) => { ITEM_LINK_OF[m.key] = canon; });
  });
}

/* Every key that moves together with `key` — itself when it isn't linked. */
function linkedKeys(key) {
  const canon = ITEM_LINK_OF[key];
  const group = canon ? ITEM_LINK_GROUPS[canon] : null;
  return group ? group.map((m) => m.key) : [key];
}
/* Where else this checkoff shows up, for the tick box's tooltip. */
function linkedPlaces(key) {
  const canon = ITEM_LINK_OF[key];
  const group = canon ? ITEM_LINK_GROUPS[canon] : null;
  if (!group) return [];
  const places = [];
  group.forEach((m) => {
    if (m.key === key) return;
    if (places.indexOf(m.where) < 0) places.push(m.where);
  });
  return places;
}

/* ---------------- Checkoff state (server-persisted) ----------------
   PROGRESS is a flat { key: true } map mirrored from the server's
   progress.json. Renderers read isChecked(key) at build time (the DOM is
   rebuilt on every nav switch, so state lives here, not in the DOM). Toggling
   updates the map and POSTs; if there's no server (file://) it stays in-memory. */
let PROGRESS = {};
async function loadProgress() {
  try {
    const res = await fetch("/api/progress", { cache: "no-store" });
    if (!res.ok) throw new Error("bad status " + res.status);
    const data = await res.json();
    PROGRESS = (data && data.checked) || {};
  } catch (e) {
    PROGRESS = {}; // no server → checkoffs are session-only
  }
}
function isChecked(key) { return !!PROGRESS[key]; }
/* One key, one request — the server's POST body carries a single key. */
async function postProgress(key, checked) {
  try {
    const res = await fetch("/api/progress", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key: key, checked: checked }),
    });
    if (!res.ok) throw new Error("bad status " + res.status);
    return true;
  } catch (e) {
    return false;
  }
}
/* Toggling a linked item writes every key in its group, so the character page
   and the Loot tab never disagree. Writes are applied optimistically and each
   one is rolled back on its own if the server rejects it, so PROGRESS stays in
   step with what the server actually accepted even on a partial failure. */
async function setChecked(key, checked) {
  const keys = linkedKeys(key);
  const previous = keys.map((k) => !!PROGRESS[k]);
  keys.forEach((k) => { if (checked) PROGRESS[k] = true; else delete PROGRESS[k]; });
  syncCheckboxNodes(keys);
  const results = await Promise.all(keys.map((k) => postProgress(k, checked)));
  const failed = results.some((ok) => !ok);
  if (failed) {
    keys.forEach((k, i) => {
      if (results[i]) return;
      if (previous[i]) PROGRESS[k] = true;
      else delete PROGRESS[k];
    });
    syncCheckboxNodes(keys);
  }
  return !failed;
}

/* progress.json predates linking, so a group can arrive with some keys ticked
   and some not — an item collected before the two views shared a state. Fill the
   rest of the group in so both views agree from the first paint. This is done in
   memory only and never written back: a boot has no business rewriting the
   playthrough file, and the next real toggle of that item persists the whole
   group anyway. Only ever adds, so nothing already recorded is lost. */
function reconcileLinkedProgress() {
  let added = 0;
  Object.keys(ITEM_LINK_GROUPS).forEach((canon) => {
    const keys = ITEM_LINK_GROUPS[canon].map((m) => m.key);
    if (!keys.some(isChecked)) return;
    keys.forEach((k) => {
      if (isChecked(k)) return;
      PROGRESS[k] = true;
      added++;
    });
  });
  return added;
}

/* Live tick boxes, so linked items update in place instead of waiting for the
   next rebuild. Nodes are dropped once their view is torn out of the document. */
const CHECKBOX_NODES = new Map();
function registerCheckbox(key, node) {
  let nodes = CHECKBOX_NODES.get(key);
  if (!nodes) { nodes = new Set(); CHECKBOX_NODES.set(key, nodes); }
  nodes.add(node);
}
function syncCheckboxNodes(keys) {
  keys.forEach((k) => {
    const nodes = CHECKBOX_NODES.get(k);
    if (!nodes) return;
    nodes.forEach((node) => {
      if (node.isConnected) node.checked = isChecked(k);
      else nodes.delete(node);
    });
    if (!nodes.size) CHECKBOX_NODES.delete(k);
  });
}

/* A checkbox bound to a checkoff key. */
function checkbox(key, label) {
  const places = linkedPlaces(key);
  const cb = h("input", {
    type: "checkbox",
    class: "ck",
    "aria-label": label || "Mark item complete",
    title: places.length ? "Shared checkoff — also ticks " + places.join(", ") : null,
  });
  cb.checked = isChecked(key);
  cb.addEventListener("change", async () => {
    const ok = await setChecked(key, cb.checked);
    if (!ok) cb.checked = isChecked(key);
  });
  registerCheckbox(key, cb);
  /* The native input stays for keyboard and screen readers; the visible mark is the
     text "[ ]" / "[x]" drawn by .ck-box, so it prints and reads like Markdown. */
  return h("label", { class: "ck-wrap", title: places.length ? "Shared checkoff — also ticks " + places.join(", ") : null },
    cb, h("span", { class: "ck-box", "aria-hidden": "true" }));
}

/* ---------------- Per-view UI state (scroll offset + open tabs) ----------------
   Switching sub-views rebuilds the whole page, which would otherwise dump you
   back at the top of a long character page every time. Each view key remembers
   how far it was scrolled and which tab was open inside each of its tab groups,
   so coming back to a character lands on the section you left. Held in
   sessionStorage — it survives a reload of the same browser tab and is gone on
   a fresh one; any storage failure quietly degrades to in-memory only. */
const VIEW_STATE_STORE = "bg3-view-state-v1";
const VIEW_STATE = { scroll: {}, tabs: {} };
(function loadViewState() {
  try {
    const raw = window.sessionStorage.getItem(VIEW_STATE_STORE);
    const saved = raw ? JSON.parse(raw) : null;
    if (saved && typeof saved === "object") {
      if (saved.scroll && typeof saved.scroll === "object") VIEW_STATE.scroll = saved.scroll;
      if (saved.tabs && typeof saved.tabs === "object") VIEW_STATE.tabs = saved.tabs;
    }
  } catch (e) { /* private mode, file://, corrupt value — start empty */ }
})();
let viewStateWrite = null;
function saveViewState() {
  if (viewStateWrite) return;
  viewStateWrite = setTimeout(() => {
    viewStateWrite = null;
    try { window.sessionStorage.setItem(VIEW_STATE_STORE, JSON.stringify(VIEW_STATE)); } catch (e) { /* ignore */ }
  }, 300);
}

/* The view currently on screen, or null while one is being swapped in — the
   scroll churn of a rebuild must not overwrite a remembered offset. */
let CURRENT_VIEW = null;
function viewScrollTop(key) {
  const y = VIEW_STATE.scroll[key];
  return typeof y === "number" && y > 0 ? y : 0;
}
let scrollFrame = false;
window.addEventListener("scroll", () => {
  if (scrollFrame || !CURRENT_VIEW) return;
  scrollFrame = true;
  window.requestAnimationFrame(() => {
    scrollFrame = false;
    if (!CURRENT_VIEW) return;
    VIEW_STATE.scroll[CURRENT_VIEW] = Math.round(window.scrollY || window.pageYOffset || 0);
    saveViewState();
  });
}, { passive: true });

/* Tab groups restore by index. idBase is stable per view (it is derived from the
   character/build or the loot act and area), so the stored index outlives the
   rebuild that discards the DOM. */
function rememberedTab(idBase, count) {
  const i = VIEW_STATE.tabs[idBase];
  return typeof i === "number" && i >= 0 && i < count ? i : 0;
}
function rememberTab(idBase, index) {
  VIEW_STATE.tabs[idBase] = index;
  saveViewState();
}

/* Reusable components */
function section(title, ...content) {
  return h("section", { class: "sec" }, h("h3", { class: "sec-h" }, title), ...content);
}
function tableWrap(node) {
  return h("div", { class: "table-wrap" }, node);
}
function bulletList(items) {
  return h(
    "ul",
    { class: "clean" },
    items.map((it) => (typeof it === "string" ? h("li", null, it) : it))
  );
}

/* ---------------- Lightweight prose formatter ----------------
   Renders a small, safe Markdown subset from the content files into DOM nodes
   (content is never fed to innerHTML, so there's nothing to escape):
     • blank line       → new paragraph
     • lines "- "/"* "  → bullet list
     • **bold**         → <strong>
     • "Label: rest"    → bold lead-in on a bullet (auto, ≤18 chars)
   Used for the long prose fields so they scan at a glance. */
function inlineBold(text, target) {
  String(text).split(/\*\*(.+?)\*\*/g).forEach((part, i) => {
    if (part === "") return;
    if (i % 2 === 1) target.appendChild(h("strong", null, part));
    else target.appendChild(document.createTextNode(part));
  });
}
function bulletItem(text) {
  const li = h("li", null);
  const m = text.match(/^([^:*]{1,18}):\s+([\s\S]+)$/);
  if (m) {
    li.appendChild(h("strong", null, m[1]));
    li.appendChild(document.createTextNode(": "));
    inlineBold(m[2], li);
  } else {
    inlineBold(text, li);
  }
  return li;
}
function richText(str, pClass) {
  const frag = document.createDocumentFragment();
  const lines = String(str).replace(/\r\n/g, "\n").split("\n");
  let para = [];
  let list = null;
  const flushPara = () => {
    if (!para.length) return;
    const p = h("p", { class: "prose" + (pClass ? " " + pClass : "") });
    inlineBold(para.join(" "), p);
    frag.appendChild(p);
    para = [];
  };
  const flushList = () => {
    if (list) { frag.appendChild(list); list = null; }
  };
  lines.forEach((raw) => {
    const line = raw.trim();
    if (!line) { flushPara(); flushList(); return; }
    if (/^[-*]\s+/.test(line)) {
      flushPara();
      if (!list) list = h("ul", { class: "prose-list" });
      list.appendChild(bulletItem(line.replace(/^[-*]\s+/, "")));
    } else {
      flushList();
      para.push(line);
    }
  });
  flushPara();
  flushList();
  return frag;
}

/* ---------------- Field renderers ---------------- */
const STAT_ORDER = ["STR", "DEX", "CON", "INT", "WIS", "CHA"];

/* An ability's growth as a chain. Each row reads "modifier <- score (what moved it)",
   base at the top and the final value at the bottom, so the number you actually play
   with is the last thing you read. */
function abilityMod(score) {
  return Math.floor((Number(score) - 10) / 2);
}
function signedMod(n) {
  return (n >= 0 ? "+" : "\u2212") + Math.abs(n);
}
function renderAbilityChains(chains) {
  return h(
    "div",
    { class: "ability-grid" },
    arr(chains).map((ch) => {
      const steps = arr(ch.steps);
      const last = steps.length ? steps[steps.length - 1] : null;
      return h(
        "section",
        { class: "ability-card" },
        h("div", { class: "ability-head" },
          h("span", { class: "ability-k" }, ch.ability),
          last ? h("span", { class: "ability-final" }, signedMod(abilityMod(last.score))) : null
        ),
        h("ul", { class: "clean ability-steps" }, steps.map((st, i) =>
          h("li", { class: "ability-step" + (i === steps.length - 1 && steps.length > 1 ? " ability-latest" : "") },
            h("span", { class: "ability-mod" }, signedMod(abilityMod(st.score))),
            h("span", { class: "ability-arrow", "aria-hidden": "true" }, "\u2190"),
            h("span", { class: "ability-score" }, String(st.score)),
            has(st.source) ? h("span", { class: "ability-src" }, "(" + st.source + ")") : null
          )
        ))
      );
    })
  );
}

function renderStatblock(stats) {
  return h(
    "div",
    { class: "statblock" },
    STAT_ORDER.map((k) => {
      const v = stats[k];
      let valNode;
      if (v && typeof v === "object") {
        // Item-fixed score: base struck through, final value with the source on hover.
        valNode = h("div", { class: "stat-v" },
          h("span", { class: "stat-base" }, String(v.base != null ? v.base : "")),
          h("span", { class: "stat-final has-hover", title: v.via || null }, String(v.final != null ? v.final : "")));
      } else {
        valNode = h("div", { class: "stat-v" }, v != null ? v : "—");
      }
      return h("div", { class: "stat" }, h("div", { class: "stat-k" }, k), valNode);
    })
  );
}

function renderFeats(feats) {
  return bulletList(
    feats.map((f) =>
      h(
        "li",
        null,
        h("span", { class: "li-strong" }, f.feat),
        f.at ? h("span", { class: "li-meta" }, "  —  " + f.at) : null,
        f.note ? h("div", { class: "li-meta" }, f.note) : null
      )
    )
  );
}

/* Comma-separated inline text, each tag bold. */
function renderTags(items) {
  const out = [];
  arr(items).forEach((t, i) => {
    if (i) out.push(", ");
    out.push(h("span", { class: "tag" }, t));
  });
  return h("p", { class: "tag-list" }, out);
}

/* A slot or level-group label: the name, then "(n)" for the count. No icon; the
   style guide names things instead of drawing them. */
function cardHeading(label, count) {
  return h("h4", { class: "card-heading" },
    h("span", null, label),
    count != null ? h("span", { class: "card-count", "aria-label": count + " entries" }, "(" + count + ")") : null
  );
}

function renderClass(className) {
  return h("span", { class: "level-class" }, className);
}

function renderLevelGains(gains) {
  const entries = arr(gains).filter(has);
  if (!entries.length) return h("span", { class: "muted" }, "—");
  return h("ul", { class: "level-gain-list" },
    entries.map((gain) => h("li", null, gain))
  );
}

/* `granted: true` marks an entry the class, subclass or race supplies for free
   -- it spends no pick and no prepared slot. `picks: N` is how many selections
   the level opens for that category; when the guide names fewer than N, the
   remainder render as explicit "open pick" placeholders so an unspent choice is
   never invisible. `optional: true` is the level-up replacement swap. */
function pickBadge(rec, namedCount) {
  const granted = rec.granted === true || /^(granted|grant|class|free|fixed)$/i.test(String(rec.source || ""));
  if (granted) {
    const fixed = /^fixed$/i.test(String(rec.source || "")) || rec.fixed === true;
    return {
      granted: true,
      open: 0,
      node: h("span", {
        class: "pick-badge is-grant",
        title: fixed
          ? "Fixed by the class, subclass or race — not a selection you make"
          : "Granted by the class, subclass or race — costs no pick and no prepared slot",
      }, fixed ? "[fixed]" : "[free]"),
    };
  }
  const raw = Number(rec.picks);
  if (!has(rec.picks) || !isFinite(raw) || raw <= 0) return { granted: false, open: 0, node: null };
  const picks = Math.trunc(raw);
  const open = Math.max(0, picks - namedCount);
  const parts = [picks === 1 ? "1 pick" : picks + " picks"];
  if (rec.optional === true) parts.push("swap");
  if (namedCount > picks) parts.push(namedCount + " listed");
  else if (open) parts.push(open + " open");
  return {
    granted: false,
    open,
    node: h("span", {
      class: "pick-badge",
      title: picks === 1
        ? "This level grants one selection in this category"
        : "This level grants " + picks + " selections in this category",
    }, "[" + parts.join(" · ") + "]"),
  };
}

function renderLevelRecommendation(rec) {
  const category = String(rec.category || "Choice");
  const values = arr(rec.recommendation).filter(has).map(String);
  /* `wiki: false` opts a row out of linking, same as an itemization entry --
     a row whose recommendation is prose rather than a spell name would
     otherwise auto-link to a page that does not exist. */
  const noWiki = rec.wiki === false;
  const wikiTitles = noWiki ? [] : arr(rec.wiki).filter(has).map(String);
  const spellRecommendations = !noWiki && /spell|cantrip|magical secrets/i.test(category);
  const recommendation = [];
  values.forEach((value, index) => {
    if (index) recommendation.push(" · ");
    const wikiTitle = wikiTitles[index] || (wikiTitles.length === 1 ? wikiTitles[0] : value);
    recommendation.push(
      wikiTitles.length
        ? wikiPageLink(wikiTitle, null, value)
        : spellRecommendations
          ? wikiSpellNode(value)
          : value
    );
  });
  const badge = pickBadge(rec, values.length);
  for (let i = 0; i < badge.open; i++) {
    /* One separator between the named picks and the placeholders, then plain
       spaces -- a chain of dot-separated chips reads as a wrapped orphan. */
    if (recommendation.length) recommendation.push(i === 0 ? " · " : " ");
    recommendation.push(h("span", {
      class: "open-pick",
      title: "A selection this level grants that the guide has not assigned — pick it in play",
    }, "[ open ]"));
  }
  const hasNote = has(rec.note);
  const tipId = hasNote ? "level-tip-" + (++LEVEL_TIP_SERIAL) : null;
  const tipNode = hasNote ? h("span", { class: "item-tip", id: tipId, role: "tooltip" },
    h("span", { class: "item-tip-k" }, badge.granted ? "Why it matters" : "Why this pick"),
    h("span", { class: "tip-content" }, h("span", { class: "tip-summary" }, rec.note))
  ) : null;
  const choice = h("div", {
    class: "level-choice" + (hasNote ? " has-detail" : "") + (badge.granted ? " is-grant" : ""),
    tabindex: hasNote ? "0" : null,
    "aria-describedby": tipId,
  },
    h("div", { class: "level-choice-category" }, category),
    h("div", { class: "level-choice-body" },
      h("div", { class: "level-choice-recommendation" }, recommendation.length ? recommendation : "—"),
      badge.node
    ),
    hasNote ? h("span", { class: "detail-cue", "aria-hidden": "true" }, "[?]") : null,
    tipNode
  );
  if (tipNode) attachHoverTip(choice, choice, tipNode);
  return choice;
}

let LEVEL_TIP_SERIAL = 0;

function renderLevelRecommendations(recommendations) {
  const entries = arr(recommendations).filter((rec) => rec && typeof rec === "object");
  if (!entries.length) return h("span", { class: "muted" }, "No selection required");
  return h("div", { class: "level-choice-list" }, entries.map(renderLevelRecommendation));
}

function renderLevelingTable(rows, keyPrefix) {
  const wrapped = tableWrap(
    h(
      "table",
      { class: "level-table" },
      h("thead", null, h("tr", null,
        keyPrefix ? h("th", { scope: "col", class: "ck-col", "aria-label": "Done" }, "") : null,
        h("th", { scope: "col" }, "Lvl"),
        h("th", { scope: "col" }, "Class"),
        h("th", { scope: "col" }, "Automatic gains"),
        h("th", { scope: "col" }, "Picks & class grants"))),
      h(
        "tbody",
        null,
        rows.map((r) =>
          h(
            "tr",
            null,
            keyPrefix ? h("td", { class: "ck-col level-check-cell" }, checkbox(keyPrefix + "/" + r.char_level, "Mark character level " + r.char_level + " complete")) : null,
            h("td", { class: "num cell-strong level-number-cell" }, h("span", { class: "level-number" }, r.char_level)),
            h("td", { class: "cell-strong level-class-cell" }, renderClass(r.class)),
            h("td", { class: "level-gains-cell", "data-label": "Automatic gains" }, renderLevelGains(r.gains)),
            h("td", { class: "level-recommendations-cell", "data-label": "Picks & class grants" }, renderLevelRecommendations(r.recommendations))
          )
        )
      )
    )
  );
  wrapped.className += " level-table-wrap";
  return wrapped;
}

/* Leveling can be a flat array (single table) or { respecs: [...] }. A respec
   rebuilds the character from level 1, so each respec segment is its own tab
   holding that segment's full leveling order. */
function renderLeveling(lv, idHint, keyRoot) {
  if (Array.isArray(lv)) return renderLevelingTable(lv, keyRoot ? "lvl:" + keyRoot + "/main" : null);
  if (lv && Array.isArray(lv.respecs)) {
    const idBase = "lvl-" + String(idHint || "build").replace(/[^a-z0-9]+/gi, "-").toLowerCase();
    return miniTabs(
      idBase,
      lv.respecs.map((seg) => ({
        label: seg.label || "Segment",
        content: h(
          "div",
          null,
          has(seg.note) ? h("p", { class: "note" }, seg.note) : null,
          renderLevelingTable(arr(seg.rows), keyRoot ? "lvl:" + keyRoot + "/" + slug(seg.label || "segment") : null)
        ),
      }))
    );
  }
  return h("div");
}

/* Slot cards are laid out in three fixed rows — worn kit, then weapons, then
   consumables — so a build's gear reads top-to-bottom instead of as one long
   alphabetical grid. Rows and slots with no entries are dropped. */
/* Three vertical columns that mirror how the gear actually reads: what he swings,
   what he wears, what hangs off him. Each column stacks its slot cards. */
const ITEM_SLOT_ROWS = [
  { label: "Weapons & consumables", slots: ["Melee & Shield", "Ranged Weapons", "Potions & Oils", "Elixirs", "Other"] },
  { label: "Worn", slots: ["Head", "Armour", "Hands", "Boots"] },
  { label: "Accessories", slots: ["Amulets", "Cloaks", "Ring 1", "Ring 2", "Rings"] },
];
/* The main hand and the off-hand read as one loadout, so both slots share a card.
   The finer slot names survive underneath: classification, the ranged split and the
   sequential arrows all still key off them, and the card lists its parts in this order. */
const ITEM_SLOT_CARDS = { "Melee & Shield": ["Melee Weapons", "Off-hand & Shields"] };
const ITEM_SLOT_TO_CARD = {};
Object.keys(ITEM_SLOT_CARDS).forEach((card) => ITEM_SLOT_CARDS[card].forEach((slot) => { ITEM_SLOT_TO_CARD[slot] = card; }));
function itemSlotCard(slot) {
  return ITEM_SLOT_TO_CARD[slot] || slot;
}
/* Short label for a part inside a shared card. */
const ITEM_SLOT_PART_LABELS = { "Melee Weapons": "Weapon", "Off-hand & Shields": "Off-hand" };

/* Content writes slots freely ("feet", "off-hand", "consumables", …); map the
   spellings that exist onto the card names above. */
const ITEM_SLOT_ALIASES = {
  head: "Head", helmet: "Head", helm: "Head", circlet: "Head", hat: "Head",
  armour: "Armour", armor: "Armour", chest: "Armour", body: "Armour", robes: "Armour",
  hands: "Hands", gloves: "Hands", bracers: "Hands", gauntlets: "Hands",
  rings: "Rings", ring: "Rings",
  "ring 1": "Ring 1", ring1: "Ring 1", "ring one": "Ring 1", "first ring": "Ring 1",
  "ring 2": "Ring 2", ring2: "Ring 2", "ring two": "Ring 2", "second ring": "Ring 2",
  feet: "Boots", boots: "Boots", shoes: "Boots",
  amulets: "Amulets", amulet: "Amulets", neck: "Amulets", necklace: "Amulets",
  cloaks: "Cloaks", cloak: "Cloaks", back: "Cloaks",
  weapons: "Melee Weapons", weapon: "Melee Weapons", melee: "Melee Weapons",
  "melee weapons": "Melee Weapons", "main hand": "Melee Weapons",
  "ranged weapons": "Ranged Weapons", ranged: "Ranged Weapons", "ranged weapon": "Ranged Weapons",
  "off-hand": "Off-hand & Shields", "off hand": "Off-hand & Shields", offhand: "Off-hand & Shields",
  shields: "Off-hand & Shields", shield: "Off-hand & Shields",
  elixirs: "Elixirs", elixir: "Elixirs",
  consumables: "Potions & Oils", consumable: "Potions & Oils", potions: "Potions & Oils",
  potion: "Potions & Oils", oils: "Potions & Oils", coatings: "Potions & Oils", arrows: "Potions & Oils",
  other: "Other", misc: "Other", "party aura": "Other",
};

const RANGED_WEAPON_WORDS = ["bow", "crossbow", "sling", "dart", "javelin", "ranged"];

/* Keyword fallback for entries whose slot is missing or unrecognised. */
function classifyItemText(text) {
  const hasAny = (words) => words.some((word) => text.includes(word));
  if (hasAny(RANGED_WEAPON_WORDS)) return "Ranged Weapons";
  if (hasAny(["shield", "warboard", "off-hand", "off hand"])) return "Off-hand & Shields";
  if (hasAny(["blade", "pike", "sword", "staff", "markoheshkir", "phalar", "weapon"])) return "Melee Weapons";
  if (hasAny(["armour", "armor", "robe", "cloth", "mail"])) return "Armour";
  if (hasAny(["helmet", "helm", "head", "cowl", "mask", "diadem", "birthright", "hat"])) return "Head";
  if (hasAny(["glove", "bracer", "gauntlet"])) return "Hands";
  if (hasAny(["boot", "night walker", "shoes"])) return "Boots";
  if (hasAny(["cloak", "mantle", "cape"])) return "Cloaks";
  if (hasAny(["amulet", "neck", "periapt"])) return "Amulets";
  if (hasAny(["ring", "band"])) return "Rings";
  if (hasAny(["elixir"])) return "Elixirs";
  if (hasAny(["potion", "oil", "coating", "arrow", "hair"])) return "Potions & Oils";
  return "Other";
}

/* Prefer an explicit content slot, but classify legacy entries so older content
   remains useful. This is intentionally presentation-only; checklist keys still
   derive from the content IDs. */
function itemSlot(entry) {
  const isObj = entry && typeof entry === "object";
  const text = String(isObj ? entry.item || entry.id || "" : entry).toLowerCase();
  const declared = isObj && has(entry.slot) ? String(entry.slot).trim().toLowerCase() : "";
  const slot = declared
    ? ITEM_SLOT_ALIASES[declared] || classifyItemText(declared + " " + text)
    : classifyItemText(text);
  // Content files file bows and crossbows under the generic "weapons" slot, and
  // elixirs under "consumables"; split both so the narrower cards stay accurate.
  if (slot === "Melee Weapons" && RANGED_WEAPON_WORDS.some((word) => text.includes(word))) return "Ranged Weapons";
  if (slot === "Potions & Oils" && text.includes("elixir")) return "Elixirs";
  return slot;
}

function tooltipContent(summary, facts) {
  const rows = arr(facts).filter((fact) => fact && has(fact[1]));
  return h("span", { class: "tip-content" },
    has(summary) ? h("span", { class: "tip-summary" }, summary) : null,
    rows.length ? h("span", { class: "tip-facts" },
      rows.map((fact) => h("span", { class: "tip-fact" },
        h("span", { class: "tip-fact-k" }, fact[0]),
        h("span", { class: "tip-fact-v" }, fact[1])
      ))
    ) : null
  );
}

function itemTip(entry) {
  if (!entry || typeof entry !== "object") return null;
  const effect = has(entry.effect) ? String(entry.effect) : null;
  const why = has(entry.why) ? String(entry.why) : null;
  const note = has(entry.note) ? String(entry.note) : null;
  const tier = itemTier(entry);
  const rank = itemRank(entry);
  const summary = why || (!effect ? note : null);
  const facts = [
    ["Tier", tier ? tier.text : null],
    ["Ranked", rank ? rank.text : null],
    ["Effect", effect],
    ["Note", note && note !== summary && note !== effect ? note : null],
  ];
  return summary || effect || tier || rank ? tooltipContent(summary, facts) : null;
}

/* Published ratings carried on the content entry, from the guide corpus. They are
   independent, and an item often holds both: `tier` is a letter from that slot's tier
   list, `rank` is a placing such as "#12" in that act's top-20 countdown. The matching
   `_note` field names the source video, its timestamp, and the verdict. */
const ITEM_TIER_CLASS = { S: "tier-s", A: "tier-a", B: "tier-b", C: "tier-c", D: "tier-d", F: "tier-d" };
/* A handful of lists define an "S+" above their S, so colour by the base letter. */
function itemTierClass(letter) {
  return ITEM_TIER_CLASS[String(letter || "").charAt(0).toUpperCase()] || "tier-rank";
}
function itemTier(entry) {
  if (!entry || typeof entry !== "object" || !has(entry.tier)) return null;
  const raw = String(entry.tier).trim();
  const letter = /^[SABCDF]\+?$/i.test(raw) ? raw.toUpperCase() : null;
  /* A rank used to live in `tier`; tolerate that shape so old content still renders. */
  const label = letter
    ? "[" + letter + "]"
    : (/^#?\d+$/.test(raw) ? raw.replace(/^#?/, "#") : "[" + raw.toUpperCase() + "]");
  const note = has(entry.tier_note) ? String(entry.tier_note) : null;
  const named = letter ? "Tier " + letter : label;
  /* A rank note already names its list and repeats the rank, so it stands alone; a
     letter tier needs the letter spelled out in front of it. */
  return {
    label: label,
    cls: "item-tier " + (letter ? itemTierClass(letter) : "tier-rank"),
    text: note ? (letter ? named + " — " + note : note) : named + " (guide rating)",
  };
}
function itemRank(entry) {
  if (!entry || typeof entry !== "object" || !has(entry.rank)) return null;
  const raw = String(entry.rank).trim();
  const label = /^#?\d+$/.test(raw) ? raw.replace(/^#?/, "#") : raw.toUpperCase();
  const note = has(entry.rank_note) ? String(entry.rank_note) : null;
  return {
    label: label,
    cls: "item-tier tier-rank",
    text: note || (label + " on a best-items list"),
  };
}
/* The letter first, then the placing: the letter says how good the item is in its own
   slot, the placing how it stacks up against every item in the act. */
function itemBadges(entry) {
  return [itemTier(entry), itemRank(entry)]
    .filter(Boolean)
    .map((badge) => h("span", { class: badge.cls, title: badge.text }, badge.label));
}

const BG3_WIKI_ROOT = "https://bg3.wiki/wiki/";

function bg3WikiUrl(title) {
  return BG3_WIKI_ROOT + encodeURIComponent(title).replace(/%20/g, "_");
}

function wikiPageLink(title, attrs, label) {
  const linkAttrs = Object.assign({
    href: bg3WikiUrl(title),
    target: "_blank",
    rel: "noopener noreferrer",
    title: "Open " + title + " on bg3.wiki",
  }, attrs || {});
  linkAttrs.class = ["wiki-item", attrs && attrs.class].filter(Boolean).join(" ");
  delete linkAttrs.type;
  if (linkAttrs["aria-describedby"]) delete linkAttrs.title;
  return h("a", linkAttrs, label || title);
}

/* Content may provide `wiki: false`, one page title, or a list of page titles. */
function wikiItemNode(entry, attrs, linkByDefault = true) {
  const isObj = entry && typeof entry === "object";
  const label = String(isObj ? entry.item || entry.name || "" : entry);
  const configured = isObj ? entry.wiki : undefined;
  if (configured === false || (!linkByDefault && configured == null)) return null;
  const titles = configured == null ? [label] : arr(configured).filter(has).map(String);
  if (!titles.length) return null;
  if (titles.length > 1) {
    const groupAttrs = Object.assign({}, attrs || {});
    groupAttrs.class = ["wiki-item-group", attrs && attrs.class].filter(Boolean).join(" ");
    delete groupAttrs.type;
    const linkAttrs = groupAttrs["aria-describedby"]
      ? { "aria-describedby": groupAttrs["aria-describedby"] }
      : null;
    const links = [];
    titles.forEach((title, i) => {
      if (i) links.push(" + ");
      links.push(wikiPageLink(title, linkAttrs));
    });
    return h("span", groupAttrs, links);
  }
  return wikiPageLink(titles[0], attrs, label);
}

function positionItemTip(button, tip) {
  if (!button || !tip) return;
  const gap = 9;
  const edge = 16;
  const header = document.querySelector("header.app");
  const headerBottom = header ? header.getBoundingClientRect().bottom : 0;
  const buttonRect = button.getBoundingClientRect();
  const width = Math.min(390, Math.max(180, window.innerWidth - edge * 2));
  tip.style.width = width + "px";
  // visibility:hidden still has layout, so the real wrapped height is available.
  const height = tip.offsetHeight;
  const centered = buttonRect.left + buttonRect.width / 2 - width / 2;
  const left = Math.max(edge, Math.min(centered, window.innerWidth - width - edge));
  const above = buttonRect.top - height - gap;
  const below = buttonRect.bottom + gap;
  const minTop = Math.max(edge, headerBottom + 8);
  const maxTop = Math.max(minTop, window.innerHeight - height - edge);
  let top = above >= minTop ? above : below;
  if (top + height > window.innerHeight - edge && above >= minTop) top = above;
  tip.style.left = left + "px";
  tip.style.top = Math.max(minTop, Math.min(top, maxTop)) + "px";
}

let ACTIVE_HOVER_TIP = null;
let HOVER_TIP_FRAME = 0;

function scheduleHoverTipPosition() {
  if (!ACTIVE_HOVER_TIP || HOVER_TIP_FRAME) return;
  HOVER_TIP_FRAME = window.requestAnimationFrame(() => {
    HOVER_TIP_FRAME = 0;
    if (!ACTIVE_HOVER_TIP) return;
    const { anchor, tipNode } = ACTIVE_HOVER_TIP;
    if (!anchor.isConnected || !tipNode.isConnected) {
      ACTIVE_HOVER_TIP = null;
      return;
    }
    positionItemTip(anchor, tipNode);
  });
}

window.addEventListener("scroll", scheduleHoverTipPosition, true);
window.addEventListener("resize", scheduleHoverTipPosition);

function attachHoverTip(host, anchor, tipNode) {
  if (!host || !anchor || !tipNode) return;
  const reveal = () => {
    host.classList.remove("tip-dismissed");
    ACTIVE_HOVER_TIP = { host, anchor, tipNode };
    positionItemTip(anchor, tipNode);
  };
  const release = () => {
    window.requestAnimationFrame(() => {
      if (!ACTIVE_HOVER_TIP || ACTIVE_HOVER_TIP.host !== host) return;
      if (host.classList.contains("tip-pinned")) return;
      if (!host.matches(":hover") && !host.contains(document.activeElement)) ACTIVE_HOVER_TIP = null;
    });
  };
  host.addEventListener("mouseenter", reveal);
  host.addEventListener("focusin", reveal);
  host.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") {
      ev.preventDefault();
      host.classList.remove("tip-pinned");
      const details = host.querySelector(".item-details");
      if (details) details.setAttribute("aria-expanded", "false");
      host.classList.add("tip-dismissed");
      if (ACTIVE_HOVER_TIP && ACTIVE_HOVER_TIP.host === host) ACTIVE_HOVER_TIP = null;
    }
  });
  host.addEventListener("mouseleave", () => {
    host.classList.remove("tip-dismissed");
    release();
  });
  host.addEventListener("focusout", () => {
    host.classList.remove("tip-dismissed");
    release();
  });
}

/* Shared linked-name tooltip used by both item and spell checklists. */
function linkedNameTip(label, linkedNode, tip, tipId, heading) {
  const tipNode = tip ? h("span", { class: "item-tip", id: tipId, role: "tooltip" },
    h("span", { class: "item-tip-k" }, heading),
    tip
  ) : null;
  const nameControl = linkedNode || h("button", {
    class: "item-name", type: "button",
    "aria-describedby": tip ? tipId : null,
    title: tip ? null : "No details provided",
  }, label);
  const detailsControl = tipNode ? h("button", {
    class: "item-details", type: "button",
    "aria-label": "Show details for " + label,
    "aria-describedby": tipId,
    "aria-expanded": "false",
  }, "[?]") : null;
  const tipWrap = h("span", { class: "item-tip-wrap" + (tipNode ? " has-tip" : "") },
    nameControl, detailsControl, tipNode);
  if (tipNode) {
    attachHoverTip(tipWrap, detailsControl, tipNode);
    detailsControl.addEventListener("click", () => {
      const pinned = tipWrap.classList.toggle("tip-pinned");
      detailsControl.setAttribute("aria-expanded", String(pinned));
      if (pinned) {
        document.querySelectorAll(".item-tip-wrap.tip-pinned").forEach((other) => {
          if (other === tipWrap) return;
          other.classList.remove("tip-pinned");
          const otherButton = other.querySelector(".item-details");
          if (otherButton) otherButton.setAttribute("aria-expanded", "false");
        });
        ACTIVE_HOVER_TIP = { host: tipWrap, anchor: detailsControl, tipNode };
        positionItemTip(detailsControl, tipNode);
      } else if (ACTIVE_HOVER_TIP && ACTIVE_HOVER_TIP.host === tipWrap) {
        ACTIVE_HOVER_TIP = null;
      }
    });
  }
  return tipWrap;
}

/* A checkable, slot-grouped item list. The visible row is deliberately only the
   item name; effect and build rationale live in an accessible hover/focus bubble. */
/* Carrying gear over from an earlier act is presentation, not part of the item's name:
   it renders as an act chip beside the name. Content states it as `held: 1|2|3`, or
   `held: true` when the act is not worth naming. The older "(held over from Act 1)"
   parenthetical is still read out of the name so legacy content keeps its chip. */
const ITEM_HELD_RE = /\s*\(\s*(?:held|carried)\s+over(?:\s+from\s+act\s*([123]))?\s*\)\s*/i;
function itemHeldChip(entry) {
  const held = entry && typeof entry === "object" ? entry.held : null;
  if (has(held) && held !== false) return /^[123]$/.test(String(held)) ? "(Act " + held + ")" : "(held)";
  const m = itemLabel(entry).match(ITEM_HELD_RE);
  if (!m) return null;
  return m[1] ? "(Act " + m[1] + ")" : "(held)";
}
/* A shallow clone whose visible name has the held-over parenthetical removed. The
   `wiki` field is untouched, so wiki linking is unaffected. */
function itemDisplayEntry(entry) {
  if (!entry || typeof entry !== "object") return entry;
  const stripped = String(entry.item || "").replace(ITEM_HELD_RE, " ").replace(/\s{2,}/g, " ").trim();
  if (!stripped || stripped === entry.item) return entry;
  return Object.assign({}, entry, { item: stripped });
}
/* Build-defining gear. Explicit `bis: true` wins; otherwise the existing prose
   conventions (LOCKED / best-in-slot / BIS) are honoured so old content still pops. */
function itemIsBis(entry) {
  if (!entry || typeof entry !== "object") return false;
  if (entry.bis === true) return true;
  if (entry.bis === false) return false;
  return /\bLOCKED\b|\bBIS\b|best[- ]in[- ]slot/i.test(String(entry.item || "") + " " + String(entry.note || ""));
}
/* Slots that hold exactly one thing at a time, so several entries in one act read as
   a progression. Weapons and consumables can hold parallel picks, so they are excluded. */
const SEQUENTIAL_SLOTS = new Set(["Head", "Armour", "Hands", "Boots", "Amulets", "Cloaks", "Ring 1", "Ring 2", "Ranged Weapons"]);
/* "No cloak exists yet" is a deliberate empty state in the content, not an item. */
function itemIsEmpty(entry) {
  if (entry && typeof entry === "object" && entry.empty === true) return true;
  return /^\s*(?:no\b[^.]*\b(?:exists|available|option)|none\b|nothing\b|empty\b)/i.test(itemLabel(entry));
}
/* An entry with `options` is a flex slot, and its parent takes one of two shapes. A
   bare placeholder ("Glove slot", "Second ring") is only a heading, and the options
   are the whole field. A real item ("Elixir of Bloodlust", tier S) is the default
   pick, and the options are its alternates. A rated parent is always a real item. */
const ITEM_PLACEHOLDER_RE = /\b(?:slot|alternatives?|options?|flex|choices?|candidates?)\b|^(?:first|second)\s+ring\b/i;
function itemIsPlaceholder(entry) {
  if (!entry || typeof entry !== "object") return false;
  if (has(entry.tier) || has(entry.rank)) return false;
  return ITEM_PLACEHOLDER_RE.test(itemLabel(entry));
}
/* A flex slot: no checkbox of its own, just small checkable candidates. A real-item
   parent joins the list as the first candidate, so it keeps its name, badges and the
   checkoff saved under its own id from before it grew alternates. */
function itemFlexOptions(entry) {
  if (!entry || typeof entry !== "object") return null;
  const opts = arr(entry.options);
  if (!opts.length) return null;
  if (itemIsPlaceholder(entry)) return opts;
  const self = Object.assign({}, entry);
  delete self.options;
  return [self].concat(opts);
}
/* "Head: Haste Helm -> Covert Cowl -> Helm of Balduran" becomes a vertical list with
   the latest pick on top, which is the one you actually want to read first. */
function progressionParts(entry) {
  const raw = itemLabel(entry);
  const colon = raw.indexOf(":");
  const prefix = colon > 0 ? raw.slice(0, colon).trim() : "";
  const body = colon > 0 ? raw.slice(colon + 1) : raw;
  const steps = body.split(/\u2192|->/).map((s) => s.trim()).filter(Boolean);
  return { prefix: prefix, steps: steps };
}
/* Canonical name -> the rated entry, gathered from every act tab including flex
   options. The progression tab names the same items in prose, so it can borrow their
   badges rather than carrying its own copy of the ratings. */
function itemRatingIndex(it) {
  const index = Object.create(null);
  Object.keys(it || {}).forEach((key) => {
    if (key === "progression") return;
    arr(it[key]).forEach((entry) => {
      if (!entry || typeof entry !== "object") return;
      [entry].concat(arr(entry.options)).forEach((row) => {
        if (!row || typeof row !== "object") return;
        if (!has(row.tier) && !has(row.rank)) return;
        const canon = canonicalItem(row.item);
        if (canon && !index[canon]) index[canon] = row;
      });
    });
  });
  return index;
}

function progressionSteps(steps, rated) {
  const out = [];
  steps.forEach((s, i) => {
    if (i) out.push(h("div", { class: "prog-arrow", "aria-hidden": "true" }, "\u2193"));
    /* A step is prose, not an entry, so "none available" or "all three acts" simply
       finds nothing and renders bare. */
    const match = rated ? rated[canonicalItem(s)] : null;
    out.push(h("div", { class: "prog-step" + (i === steps.length - 1 ? " prog-latest" : "") },
      h("span", { class: "prog-step-name" }, s),
      match ? itemBadges(match) : null));
  });
  return h("div", { class: "prog-steps" }, out);
}

function itemChecklist(entries, act, keyRoot, slotName, rated) {
  const isProgression = act === "progression";
  /* Several entries in a one-at-a-time slot are a progression: arrow each one down to
     the next thing acquired, so the best pick ends up at the bottom. */
  const sequential = !isProgression && entries.length > 1 && SEQUENTIAL_SLOTS.has(slotName);
  const rows = [];
  const out = entries.map((entry, i) => {
      const label = itemLabel(entry);
      const shown = itemDisplayEntry(entry);
      const chip = itemHeldChip(entry);
      const bis = itemIsBis(entry);
      const badges = itemBadges(entry);
      const flex = itemFlexOptions(entry);
      const empty = itemIsEmpty(entry);
      const tip = itemTip(entry);
      const id = itemEntryId(entry, i);
      const key = charItemKey(keyRoot, act, entry, i);
      const tipId = "item-tip-" + slug(keyRoot || "build") + "-" + slug(act) + "-" + slug(id) + "-" + i;
      /* A real-item flex parent is rendered as its own option row, which is where its
         build-defining border belongs; only a placeholder parent styles the block. */
      const placeholder = flex ? itemIsPlaceholder(entry) : false;
      const cls = ["ck-li", bis && (!flex || placeholder) ? "item-bis" : null, flex ? "flex-parent" : null,
        empty ? "item-empty" : null].filter(Boolean).join(" ");

      if (isProgression) {
        const parts = progressionParts(entry);
        const heading = parts.prefix || label;
        const plain = h("span", { class: "item-name", tabindex: tip ? "0" : null, "aria-describedby": tip ? tipId : null }, heading);
        return h("li", { class: cls },
          key ? checkbox(key, "Mark " + label + " acquired") : null,
          h("div", { class: "item-body" },
            h("div", { class: "item-head" },
              bis ? h("span", { class: "item-bis-star", title: "Build-defining" }, "*") : null,
              linkedNameTip(heading, plain, tip, tipId, "How the slot progresses"),
              badges
            ),
            parts.steps.length > 1 ? progressionSteps(parts.steps, rated) : null
          )
        );
      }

      if (flex) {
        /* The label explains how to pick only when the parent is a placeholder. A
           real-item parent's note, tier and held chip describe that item, and they
           render on its own option row below. */
        const flexTip = placeholder ? tip : null;
        const flexLabel = h("span", {
          class: "flex-label", tabindex: flexTip ? "0" : null,
          "aria-describedby": flexTip ? tipId : null,
        }, "flex");
        return h("li", { class: cls },
          h("span", { class: "ck-spacer", "aria-hidden": "true" }),
          h("div", { class: "item-body" },
            h("div", { class: "item-head flex-head" },
              linkedNameTip("flex", flexLabel, flexTip, tipId, "How to pick this slot")
            ),
            h("ul", { class: "clean flex-options" }, flex.map((opt, j) => {
              const oLabel = itemLabel(opt);
              const oTip = itemTip(opt);
              const oTipId = tipId + "-opt-" + j;
              const oChip = itemHeldChip(opt);
              const oBis = itemIsBis(opt);
              const isDefault = !placeholder && j === 0;
              /* Flat key, deliberately NOT nested under the parent id: an option is often a
                 slot's former top-level entry, and nesting would orphan its saved checkoff. */
              const oKey = charItemKey(keyRoot, act, opt, j);
              const oName = wikiItemNode(itemDisplayEntry(opt), {
                class: "item-name", type: "button",
                "aria-describedby": oTip ? oTipId : null,
              });
              return h("li", { class: "ck-li flex-option" + (oBis ? " item-bis" : "") },
                oKey ? checkbox(oKey, "Mark " + oLabel + " acquired") : null,
                oBis ? h("span", { class: "item-bis-star", title: "Build-defining" }, "*") : null,
                linkedNameTip(oLabel, oName, oTip, oTipId, "What it does & why it fits"),
                itemBadges(opt),
